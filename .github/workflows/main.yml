- name: Patch and sign IPA
        run: |
          mkdir -p extracted
          unzip -q Roblox.ipa -d extracted/
          APP=$(find extracted/Payload -name "*.app" | head -1)
          cp build/serfix.dylib "$APP/"
          rm -rf "$APP/_CodeSignature"
          ./tools/insert_dylib --all-yes @executable_path/serfix.dylib "$APP/Roblox" "$APP/Roblox_patched"
          mv "$APP/Roblox_patched" "$APP/Roblox"
          plutil -convert xml1 "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SERFIX" "$APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SERFIX" "$APP/Info.plist"
          plutil -convert binary1 "$APP/Info.plist"
          
          codesign --force --sign - --entitlements entitlements.plist "$APP/serfix.dylib"
          codesign --force --deep --sign - --entitlements entitlements.plist "$APP/Roblox"
          codesign --force --deep --sign - "$APP"

      - name: Package IPA
        run: cd extracted && zip -qr ../SERFIX.ipa Payload/ && cd ..
