name: Build SERFIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download IPA
        run: |
          pipx run gdown https://drive.google.com/uc?id=16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW -O Roblox.ipa

      - name: Build insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Build Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -target arm64-apple-ios15.0 -I src -o "src/$filename.o" "$file"
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Make dirs
        run: mkdir -p build SERFIX/UI injector/dylib

      - name: Write entry.m
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "SRFXCore.h"
          __attribute__((constructor))
          static void srfx_entry(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [[SRFXCore shared] start];
              });
          }
          EOF

      - name: Write SRFXCore.h
        run: |
          cat > injector/dylib/SRFXCore.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface SRFXCore : NSObject
          + (instancetype)shared;
          - (void)start;
          - (void)showUI;
          - (void)hideUI;
          @property (nonatomic, strong) UIWindow *uiWindow;
          @property (nonatomic, assign) BOOL inGame;
          @property (nonatomic, strong) NSTimer *checkTimer;
          @end
          EOF

      - name: Write SRFXCore.m
        run: |
          cat > injector/dylib/SRFXCore.m << 'EOF'
          #import "SRFXCore.h"
          #import "SRFXMainViewController.h"
          #import <QuartzCore/QuartzCore.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include <pthread.h>
          #include <unistd.h>

          static SRFXCore *instance = nil;
          static const NSInteger kDebounce = 3;
          static NSInteger positiveCount = 0;
          static NSInteger negativeCount = 0;

          static lua_State *L = NULL;
          static pthread_mutex_t lua_mutex = PTHREAD_MUTEX_INITIALIZER;

          static int srfx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *out = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [out appendString:@" "];
                  if (lua_isstring(L, i))       [out appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i))  [out appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [out appendString:lua_toboolean(L, i) ? @"true" : @"false"];
                  else if (lua_istable(L, i))   [out appendString:@"table"];
                  else if (lua_isfunction(L, i))[out appendString:@"function"];
                  else                          [out appendString:@"nil"];
              }
              NSString *copy = [out copy];
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"SRFXPrint" object:copy];
              });
              return 0;
          }

          static int srfx_warn(lua_State *L) { return srfx_print(L); }

          static int srfx_getscript(lua_State *L) {
              const char *urlStr = luaL_checkstring(L, 1);
              NSURL *url = [NSURL URLWithString:[NSString stringWithUTF8String:urlStr]];
              if (!url) { lua_pushnil(L); return 1; }
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:url];
              [req setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              [[[NSURLSession sharedSession] dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  if (data && !e) result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(sem);
              }] resume];
              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC));
              if (result) lua_pushstring(L, result.UTF8String);
              else lua_pushnil(L);
              return 1;
          }

          static int srfx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              int s = luaL_loadstring(L, code);
              if (s != LUA_OK) { lua_pushnil(L); lua_insert(L, -2); return 2; }
              return 1;
          }

          static int srfx_base64_encode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSString *e = [[NSData dataWithBytes:d length:strlen(d)] base64EncodedStringWithOptions:0];
              lua_pushstring(L, [e UTF8String]); return 1;
          }

          static int srfx_base64_decode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSData *dec = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:d] options:0];
              NSString *s = dec ? [[NSString alloc] initWithData:dec encoding:NSUTF8StringEncoding] : nil;
              lua_pushstring(L, s ? [s UTF8String] : ""); return 1;
          }

          static int srfx_identifyexecutor (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_getexecutorname  (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_checkcaller      (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int srfx_isrbxactive      (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int srfx_getthreadidentity(lua_State *L) { lua_pushinteger(L,8); return 1; }
          static int srfx_setthreadidentity(lua_State *L) { (void)L; return 0; }
          static int srfx_fireclickdetector(lua_State *L) { (void)L; return 0; }
          static int srfx_getgenv          (lua_State *L) { lua_pushglobaltable(L); return 1; }
          static int srfx_getreg           (lua_State *L) { lua_pushvalue(L, LUA_REGISTRYINDEX); return 1; }
          static int srfx_wait(lua_State *L) {
              double sec = luaL_optnumber(L, 1, 0);
              if (sec > 0) { pthread_mutex_unlock(&lua_mutex); usleep(sec * 1000000); pthread_mutex_lock(&lua_mutex); }
              return 0;
          }
          static int srfx_getgc            (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getconnections   (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_hookfunction     (lua_State *L) { lua_pushvalue(L,1); return 1; }
          static int srfx_newcclosure      (lua_State *L) { lua_pushvalue(L,1); return 1; }
          static int srfx_getconstants     (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getupvalues      (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_setupvalue       (lua_State *L) { (void)L; return 0; }
          static int srfx_getupvalue       (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getproto         (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getstack         (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getinfo          (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_islclosure       (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int srfx_firesignal       (lua_State *L) { (void)L; return 0; }
          static int srfx_connect          (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_disconnect       (lua_State *L) { (void)L; return 0; }
          static int srfx_waitforchild     (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getservice       (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getchildren      (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getdescendants   (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_findfirstchild   (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getproperties    (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getproperty      (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_setproperty      (lua_State *L) { (void)L; return 0; }
          static int srfx_gethiddenproperty(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_sethiddenproperty(lua_State *L) { (void)L; return 0; }
          static int srfx_getrawmetatable  (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_setrawmetatable  (lua_State *L) { (void)L; return 0; }
          static int srfx_make_writeable   (lua_State *L) { (void)L; return 0; }
          static int srfx_getcallingscript (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_getscripthash    (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_httpget          (lua_State *L) { return srfx_getscript(L); }
          static int srfx_httppost         (lua_State *L) { lua_pushstring(L,""); return 1; }
          static int srfx_setclipboard     (lua_State *L) { (void)L; return 0; }
          static int srfx_getclipboard     (lua_State *L) { lua_pushstring(L,""); return 1; }
          static int srfx_messagebox       (lua_State *L) { (void)L; return 0; }
          static int srfx_isfile           (lua_State *L) { lua_pushboolean(L,0); return 1; }
          static int srfx_isfolder         (lua_State *L) { lua_pushboolean(L,0); return 1; }
          static int srfx_listfiles        (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_readfile         (lua_State *L) { lua_pushstring(L,""); return 1; }
          static int srfx_writefile        (lua_State *L) { (void)L; return 0; }
          static int srfx_appendfile       (lua_State *L) { (void)L; return 0; }
          static int srfx_deletefile       (lua_State *L) { (void)L; return 0; }
          static int srfx_makefolder       (lua_State *L) { (void)L; return 0; }
          static int srfx_dofile           (lua_State *L) { (void)L; return 0; }
          static int srfx_loadfile         (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_createnotification(lua_State *L){ (void)L; return 0; }
          static int srfx_webhook          (lua_State *L) { (void)L; return 0; }
          static int srfx_setfpscap        (lua_State *L) { (void)L; return 0; }
          static int srfx_getfps           (lua_State *L) { lua_pushinteger(L,60); return 1; }
          static int srfx_getping          (lua_State *L) { lua_pushinteger(L,30); return 1; }
          static int srfx_getinstances     (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getscripts       (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getloadedmodules (lua_State *L) { lua_newtable(L); return 1; }

          static void SRFXLuaInit(void) {
              if (L) return;
              L = luaL_newstate();
              if (!L) return;
              luaL_openlibs(L);
              #define REG(name, fn) lua_register(L, name, fn)
              REG("print",srfx_print); REG("warn",srfx_warn);
              REG("getscript",srfx_getscript); REG("loadstring",srfx_loadstring);
              REG("base64_encode",srfx_base64_encode); REG("base64_decode",srfx_base64_decode);
              REG("identifyexecutor",srfx_identifyexecutor); REG("getexecutorname",srfx_getexecutorname);
              REG("checkcaller",srfx_checkcaller); REG("isrbxactive",srfx_isrbxactive);
              REG("getthreadidentity",srfx_getthreadidentity); REG("setthreadidentity",srfx_setthreadidentity);
              REG("fireclickdetector",srfx_fireclickdetector); REG("getgenv",srfx_getgenv);
              REG("getreg",srfx_getreg); REG("wait",srfx_wait);
              REG("getgc",srfx_getgc); REG("getconnections",srfx_getconnections);
              REG("hookfunction",srfx_hookfunction); REG("newcclosure",srfx_newcclosure);
              REG("getconstants",srfx_getconstants); REG("getupvalues",srfx_getupvalues);
              REG("setupvalue",srfx_setupvalue); REG("getupvalue",srfx_getupvalue);
              REG("getproto",srfx_getproto); REG("getstack",srfx_getstack);
              REG("getinfo",srfx_getinfo); REG("islclosure",srfx_islclosure);
              REG("firesignal",srfx_firesignal); REG("connect",srfx_connect);
              REG("disconnect",srfx_disconnect); REG("waitforchild",srfx_waitforchild);
              REG("getservice",srfx_getservice); REG("getchildren",srfx_getchildren);
              REG("getdescendants",srfx_getdescendants); REG("findfirstchild",srfx_findfirstchild);
              REG("getproperties",srfx_getproperties); REG("getproperty",srfx_getproperty);
              REG("setproperty",srfx_setproperty); REG("gethiddenproperty",srfx_gethiddenproperty);
              REG("sethiddenproperty",srfx_sethiddenproperty); REG("getrawmetatable",srfx_getrawmetatable);
              REG("setrawmetatable",srfx_setrawmetatable); REG("make_writeable",srfx_make_writeable);
              REG("getcallingscript",srfx_getcallingscript); REG("getscripthash",srfx_getscripthash);
              REG("http_get",srfx_httpget); REG("http_post",srfx_httppost);
              REG("setclipboard",srfx_setclipboard); REG("getclipboard",srfx_getclipboard);
              REG("messagebox",srfx_messagebox); REG("isfile",srfx_isfile);
              REG("isfolder",srfx_isfolder); REG("listfiles",srfx_listfiles);
              REG("readfile",srfx_readfile); REG("writefile",srfx_writefile);
              REG("appendfile",srfx_appendfile); REG("deletefile",srfx_deletefile);
              REG("makefolder",srfx_makefolder); REG("dofile",srfx_dofile);
              REG("loadfile",srfx_loadfile); REG("createnotification",srfx_createnotification);
              REG("webhook",srfx_webhook); REG("setfpscap",srfx_setfpscap);
              REG("getfps",srfx_getfps); REG("getping",srfx_getping);
              REG("getinstances",srfx_getinstances); REG("getscripts",srfx_getscripts);
              REG("getloadedmodules",srfx_getloadedmodules);
              #undef REG
              lua_newtable(L);
              lua_pushstring(L,"SERFIX"); lua_setfield(L,-2,"name");
              lua_pushstring(L,"2.5.0");  lua_setfield(L,-2,"version");
              lua_setglobal(L,"serfix");
          }

          void SRFXLuaExecute(const char *script) {
              if (!script || !script[0]) return;
              pthread_mutex_lock(&lua_mutex);
              if (!L) SRFXLuaInit();
              if (L) {
                  int s = luaL_dostring(L, script);
                  if (s != LUA_OK) {
                      const char *err = lua_tostring(L, -1);
                      NSString *errStr = err ? [NSString stringWithUTF8String:err] : @"unknown error";
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [[NSNotificationCenter defaultCenter] postNotificationName:@"SRFXError" object:errStr];
                      });
                      lua_pop(L, 1);
                  }
              }
              pthread_mutex_unlock(&lua_mutex);
          }

          @implementation SRFXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ instance = [[self alloc] init]; });
              return instance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) { _inGame = NO; _uiWindow = nil; }
              return self;
          }

          - (void)start {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  SRFXLuaInit();
                  [self startGameDetection];
              });
          }

          - (void)startGameDetection {
              __weak typeof(self) weak = self;
              self.checkTimer = [NSTimer scheduledTimerWithTimeInterval:1.2 repeats:YES block:^(NSTimer *t) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      __strong typeof(self) strong = weak;
                      if (!strong) { [t invalidate]; return; }
                      [strong pollGameState];
                  });
              }];
          }

          - (void)pollGameState {
              BOOL nowInGame = [self isInsideGame];
              if (nowInGame) { positiveCount++; negativeCount = 0; }
              else           { negativeCount++; positiveCount = 0; }
              if (!self.inGame && positiveCount >= kDebounce) {
                  self.inGame = YES; positiveCount = 0; [self showUI];
              } else if (self.inGame && negativeCount >= kDebounce) {
                  self.inGame = NO; negativeCount = 0; [self hideUI];
              }
          }

          - (BOOL)isInsideGame {
              @try {
                  for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                      if (![scene isKindOfClass:[UIWindowScene class]]) continue;
                      UIWindowScene *ws = (UIWindowScene *)scene;
                      if (ws.activationState != UISceneActivationStateForegroundActive) continue;
                      if (ws.statusBarManager.statusBarHidden) {
                          for (UIWindow *w in ws.windows) {
                              if (w == self.uiWindow) continue;
                              if ([self viewHasMetalLayer:w]) return YES;
                          }
                      }
                  }
              } @catch (NSException *e) {}
              return NO;
          }

          - (BOOL)viewHasMetalLayer:(UIView *)view {
              if ([view.layer isKindOfClass:NSClassFromString(@"CAMetalLayer")]) return YES;
              for (CALayer *sub in view.layer.sublayers) {
                  if ([sub isKindOfClass:NSClassFromString(@"CAMetalLayer")]) return YES;
              }
              for (UIView *sub in view.subviews) {
                  if ([self viewHasMetalLayer:sub]) return YES;
              }
              return NO;
          }

          - (void)showUI {
              if (!self.inGame) return;
              if (self.uiWindow && !self.uiWindow.hidden) return;
              if (UIApplication.sharedApplication.applicationState != UIApplicationStateActive) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ [self showUI]; });
                  return;
              }
              UIWindowScene *scene = nil;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]] && ((UIWindowScene *)s).activationState == UISceneActivationStateForegroundActive) {
                      scene = (UIWindowScene *)s; break;
                  }
              }
              if (!scene) for (UIScene *s in UIApplication.sharedApplication.connectedScenes) if ([s isKindOfClass:[UIWindowScene class]]) { scene = (UIWindowScene *)s; break; }
              if (!scene) return;
              if (!self.uiWindow) {
                  SRFXMainViewController *vc = [[SRFXMainViewController alloc] init];
                  self.uiWindow = [[UIWindow alloc] initWithWindowScene:scene];
                  self.uiWindow.windowLevel = UIWindowLevelAlert + 5;
                  self.uiWindow.backgroundColor = UIColor.clearColor;
                  self.uiWindow.rootViewController = vc;
                  self.uiWindow.hidden = YES;
              }
              self.uiWindow.hidden = NO;
              [self.uiWindow makeKeyAndVisible];
          }

          - (void)hideUI {
              if (!self.uiWindow) return;
              self.uiWindow.hidden = YES;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]]) {
                      for (UIWindow *w in ((UIWindowScene *)s).windows) {
                          if (w != self.uiWindow && !w.isKeyWindow) { [w makeKeyWindow]; return; }
                      }
                  }
              }
          }

          - (void)dealloc { [self.checkTimer invalidate]; self.checkTimer = nil; }

          @end
          EOF

      - name: Write SRFXScriptBlox.h
        run: |
          cat > injector/dylib/SRFXScriptBlox.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXScriptBlox : NSObject
          + (void)fetchTrending:(void(^)(NSArray *))completion;
          + (void)fetchScript:(NSString *)slug completion:(void(^)(NSString *))completion;
          + (void)search:(NSString *)query completion:(void(^)(NSArray *))completion;
          @end
          EOF

      - name: Write SRFXScriptBlox.m
        run: |
          cat > injector/dylib/SRFXScriptBlox.m << 'EOF'
          #import "SRFXScriptBlox.h"
          @implementation SRFXScriptBlox
          + (void)fetchTrending:(void(^)(NSArray *))completion {
              NSURL *url = [NSURL URLWithString:@"https://scriptblox.com/api/scripts?sort=trending&limit=50"];
              [[[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      id json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([json isKindOfClass:[NSDictionary class]]) {
                          NSArray *scripts = json[@"scripts"];
                          NSMutableArray *res = [NSMutableArray array];
                          for (NSDictionary *s in scripts) [res addObject:@{@"title":s[@"title"]?:@"",@"author":s[@"author"]?:@"",@"game":s[@"game"]?:@"",@"slug":s[@"slug"]?:@""}];
                          completion(res); return;
                      }
                  }
                  completion(@[]);
              }] resume];
          }
          + (void)fetchScript:(NSString *)slug completion:(void(^)(NSString *))completion {
              NSString *urlStr = [NSString stringWithFormat:@"https://scriptblox.com/api/scripts/%@", slug];
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:urlStr] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      id json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([json isKindOfClass:[NSDictionary class]]) { NSString *code = json[@"script"]; if (code) { completion(code); return; } }
                  }
                  completion(@"");
              }] resume];
          }
          + (void)search:(NSString *)query completion:(void(^)(NSArray *))completion {
              NSString *enc = [query stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              NSString *urlStr = [NSString stringWithFormat:@"https://scriptblox.com/api/scripts?search=%@&limit=30", enc];
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:urlStr] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      id json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([json isKindOfClass:[NSDictionary class]]) {
                          NSArray *scripts = json[@"scripts"];
                          NSMutableArray *res = [NSMutableArray array];
                          for (NSDictionary *s in scripts) [res addObject:@{@"title":s[@"title"]?:@"",@"slug":s[@"slug"]?:@""}];
                          completion(res); return;
                      }
                  }
                  completion(@[]);
              }] resume];
          }
          @end
          EOF

      - name: Write SRFXMainViewController.h
        run: |
          cat > SERFIX/UI/SRFXMainViewController.h << 'EOF'
          #import <UIKit/UIKit.h>
          @interface SRFXMainViewController : UIViewController
          @property (nonatomic, strong) UITextView      *editor;
          @property (nonatomic, strong) UITableView     *scriptList;
          @property (nonatomic, strong) NSMutableArray  *scripts;
          @property (nonatomic, strong) UITextView      *consoleView;
          @property (nonatomic, strong) NSMutableString *consoleText;
          @property (nonatomic, assign) NSInteger        selectedTab;
          @property (nonatomic, strong) UIButton        *floatBtn;
          @end
          EOF

      - name: Write SRFXMainViewController.m
        run: |
          cat > SERFIX/UI/SRFXMainViewController.m << 'EOF'
          #import "SRFXMainViewController.h"
          #import "SRFXScriptBlox.h"
          void SRFXLuaExecute(const char *script);

          #define SRFX_BG       [UIColor colorWithRed:0.04 green:0.04 blue:0.09 alpha:0.97]
          #define SRFX_SURFACE  [UIColor colorWithRed:0.08 green:0.07 blue:0.14 alpha:1.0]
          #define SRFX_SURFACE2 [UIColor colorWithRed:0.11 green:0.10 blue:0.18 alpha:1.0]
          #define SRFX_PURPLE   [UIColor colorWithRed:0.55 green:0.18 blue:0.79 alpha:1.0]
          #define SRFX_PINK     [UIColor colorWithRed:1.00 green:0.12 blue:0.56 alpha:1.0]
          #define SRFX_BORDER   [UIColor colorWithRed:0.25 green:0.14 blue:0.42 alpha:1.0]
          #define SRFX_TEXT     [UIColor colorWithRed:0.92 green:0.88 blue:1.00 alpha:1.0]
          #define SRFX_MUTED    [UIColor colorWithRed:0.55 green:0.50 blue:0.68 alpha:1.0]

          #define PANEL_W  MIN(UIScreen.mainScreen.bounds.size.width  - 24, 640.0)
          #define PANEL_H  MIN(UIScreen.mainScreen.bounds.size.height - 80, 480.0)
          #define SIDEBAR_W 52.0

          @interface SRFXScriptCell : UITableViewCell
          @property (nonatomic, strong) UIView   *thumb;
          @property (nonatomic, strong) UILabel  *titleLbl;
          @property (nonatomic, strong) UILabel  *gameLbl;
          @property (nonatomic, strong) UILabel  *viewsLbl;
          @property (nonatomic, strong) UIButton *runBtn;
          - (void)configureWithData:(NSDictionary *)d gradientIndex:(NSInteger)idx;
          @end

          @implementation SRFXScriptCell

          - (instancetype)initWithStyle:(UITableViewCellStyle)s reuseIdentifier:(NSString *)r {
              self = [super initWithStyle:s reuseIdentifier:r];
              if (!self) return nil;
              self.backgroundColor = UIColor.clearColor;
              self.selectionStyle  = UITableViewCellSelectionStyleNone;
              self.contentView.backgroundColor = SRFX_SURFACE2;
              self.contentView.layer.cornerRadius = 12;
              self.contentView.layer.borderWidth  = 1;
              self.contentView.layer.borderColor  = SRFX_BORDER.CGColor;
              self.contentView.layer.masksToBounds = YES;
              self.thumb = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 90, 72)];
              self.thumb.layer.masksToBounds = YES;
              [self.contentView addSubview:self.thumb];
              CAGradientLayer *g = [CAGradientLayer layer];
              g.frame  = CGRectMake(0, 0, 90, 72);
              g.colors = @[(id)SRFX_PURPLE.CGColor, (id)SRFX_PINK.CGColor];
              g.startPoint = CGPointMake(0, 0);
              g.endPoint   = CGPointMake(1, 1);
              [self.thumb.layer addSublayer:g];
              UILabel *iconLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, 90, 72)];
              iconLbl.text          = @"</>";
              iconLbl.textColor     = [UIColor colorWithWhite:1 alpha:0.5];
              iconLbl.font          = [UIFont boldSystemFontOfSize:20];
              iconLbl.textAlignment = NSTextAlignmentCenter;
              [self.thumb addSubview:iconLbl];
              self.titleLbl = [[UILabel alloc] init];
              self.titleLbl.textColor     = SRFX_TEXT;
              self.titleLbl.font          = [UIFont boldSystemFontOfSize:13];
              self.titleLbl.numberOfLines = 2;
              [self.contentView addSubview:self.titleLbl];
              self.gameLbl = [[UILabel alloc] init];
              self.gameLbl.textColor = SRFX_MUTED;
              self.gameLbl.font      = [UIFont systemFontOfSize:11];
              [self.contentView addSubview:self.gameLbl];
              self.viewsLbl = [[UILabel alloc] init];
              self.viewsLbl.textColor = SRFX_MUTED;
              self.viewsLbl.font      = [UIFont systemFontOfSize:10];
              [self.contentView addSubview:self.viewsLbl];
              self.runBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              [self.runBtn setTitle:@"Load" forState:UIControlStateNormal];
              [self.runBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.runBtn.titleLabel.font    = [UIFont boldSystemFontOfSize:12];
              self.runBtn.layer.cornerRadius = 8;
              [self.contentView addSubview:self.runBtn];
              CAGradientLayer *bg = [CAGradientLayer layer];
              bg.colors     = @[(id)SRFX_PURPLE.CGColor, (id)SRFX_PINK.CGColor];
              bg.startPoint = CGPointMake(0, 0.5);
              bg.endPoint   = CGPointMake(1, 0.5);
              bg.cornerRadius = 8;
              bg.frame = CGRectMake(0, 0, 58, 28);
              [self.runBtn.layer insertSublayer:bg atIndex:0];
              return self;
          }

          - (void)layoutSubviews {
              [super layoutSubviews];
              CGFloat h = self.contentView.bounds.size.height;
              CGFloat w = self.contentView.bounds.size.width;
              self.thumb.frame    = CGRectMake(0, 0, 90, h);
              self.titleLbl.frame = CGRectMake(100, 8, w - 170, 32);
              self.gameLbl.frame  = CGRectMake(100, 42, w - 170, 16);
              self.viewsLbl.frame = CGRectMake(100, 56, 80, 14);
              self.runBtn.frame   = CGRectMake(w - 68, h/2 - 14, 58, 28);
              for (CALayer *l in self.runBtn.layer.sublayers)
                  if ([l isKindOfClass:[CAGradientLayer class]])
                      l.frame = self.runBtn.bounds;
          }

          - (void)configureWithData:(NSDictionary *)d gradientIndex:(NSInteger)idx {
              self.titleLbl.text = d[@"title"] ?: @"Untitled";
              self.gameLbl.text  = d[@"game"]  ?: @"Universal";
              NSString *views    = d[@"views"] ? [NSString stringWithFormat:@"👁 %@", d[@"views"]] : @"";
              self.viewsLbl.text = views;
              static NSArray *palettes = nil;
              if (!palettes) palettes = @[
                  @[@"#8B2FC9",@"#FF1F8F"],
                  @[@"#4B2FC9",@"#FF1F4F"],
                  @[@"#C92F8B",@"#FF8F1F"],
                  @[@"#2F4BC9",@"#8F1FFF"],
                  @[@"#C92F4B",@"#FF2FBF"],
              ];
              NSArray *pair = palettes[idx % palettes.count];
              auto hexToColor = ^UIColor *(NSString *hex) {
                  unsigned int rgb = 0;
                  [[NSScanner scannerWithString:[hex substringFromIndex:1]] scanHexInt:&rgb];
                  return [UIColor colorWithRed:((rgb>>16)&0xFF)/255.0
                                         green:((rgb>>8)&0xFF)/255.0
                                          blue:(rgb&0xFF)/255.0 alpha:1];
              };
              for (CALayer *l in self.thumb.layer.sublayers) {
                  if ([l isKindOfClass:[CAGradientLayer class]])
                      ((CAGradientLayer *)l).colors = @[(id)hexToColor(pair[0]).CGColor,
                                                        (id)hexToColor(pair[1]).CGColor];
              }
          }

          @end

          @interface SRFXSidebarButton : UIButton
          @property (nonatomic, assign) BOOL srfxSelected;
          @end
          @implementation SRFXSidebarButton
          - (void)setSrfxSelected:(BOOL)s {
              _srfxSelected = s;
              UIColor *c = s ? [UIColor colorWithRed:1 green:1 blue:1 alpha:1]
                             : [UIColor colorWithWhite:1 alpha:0.35];
              [self setTitleColor:c forState:UIControlStateNormal];
              if (s) {
                  self.backgroundColor = [UIColor colorWithRed:0.55 green:0.18 blue:0.79 alpha:0.28];
                  self.layer.borderColor  = SRFX_PURPLE.CGColor;
                  self.layer.borderWidth  = 1;
              } else {
                  self.backgroundColor   = UIColor.clearColor;
                  self.layer.borderWidth = 0;
              }
          }
          @end

          @interface SRFXMainViewController () <UITableViewDelegate, UITableViewDataSource, UISearchBarDelegate>
          @property (nonatomic, strong) UIView        *panel;
          @property (nonatomic, strong) UIView        *sidebar;
          @property (nonatomic, strong) UIView        *contentArea;
          @property (nonatomic, strong) NSArray<SRFXSidebarButton*> *sideBtns;
          @property (nonatomic, strong) UIView        *header;
          @property (nonatomic, strong) UISearchBar   *searchBar;
          @property (nonatomic, strong) UIActivityIndicatorView *spinner;
          @property (nonatomic, strong) UITextView    *lineNumbers;
          @property (nonatomic, assign) BOOL           panelVisible;
          @end

          @implementation SRFXMainViewController

          - (CAGradientLayer *)purplePinkGradientForFrame:(CGRect)f {
              CAGradientLayer *g = [CAGradientLayer layer];
              g.colors     = @[(id)SRFX_PURPLE.CGColor, (id)SRFX_PINK.CGColor];
              g.startPoint = CGPointMake(0, 0.5);
              g.endPoint   = CGPointMake(1, 0.5);
              g.frame      = f;
              return g;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.clearColor;
              [self buildFloatButton];
              [self buildPanel];
              [self buildSidebar];
              [self buildHeader];
              [self buildEditorTab];
              [self buildHubTab];
              [self buildConsoleTab];
              self.panelVisible = NO;
              self.panel.hidden  = YES;
              self.panel.alpha   = 0;
              self.selectedTab   = 0;
              [self switchToTab:0];
              self.scripts     = [NSMutableArray array];
              self.consoleText = [NSMutableString string];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(onPrint:)    name:@"SRFXPrint" object:nil];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(onError:)    name:@"SRFXError" object:nil];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(onLoadScript:) name:@"SRFXLoadScript" object:nil];
          }

          - (void)viewDidLayoutSubviews {
              [super viewDidLayoutSubviews];
              CGFloat sw = UIScreen.mainScreen.bounds.size.width;
              CGFloat sh = UIScreen.mainScreen.bounds.size.height;
              CGFloat pw = PANEL_W, ph = PANEL_H;
              self.panel.frame = CGRectMake((sw - pw) / 2, (sh - ph) / 2, pw, ph);
              [self relayoutContentArea];
          }

          - (void)buildFloatButton {
              self.floatBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              self.floatBtn.frame = CGRectMake(20, 100, 50, 50);
              self.floatBtn.layer.cornerRadius = 25;
              self.floatBtn.layer.masksToBounds = YES;
              self.floatBtn.layer.shadowColor   = SRFX_PINK.CGColor;
              self.floatBtn.layer.shadowOpacity = 0.7;
              self.floatBtn.layer.shadowRadius  = 12;
              self.floatBtn.layer.shadowOffset  = CGSizeZero;
              CAGradientLayer *g = [self purplePinkGradientForFrame:CGRectMake(0,0,50,50)];
              g.cornerRadius = 25;
              [self.floatBtn.layer insertSublayer:g atIndex:0];
              [self.floatBtn setTitle:@"S" forState:UIControlStateNormal];
              [self.floatBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.floatBtn.titleLabel.font = [UIFont boldSystemFontOfSize:20];
              [self.floatBtn addTarget:self action:@selector(togglePanel) forControlEvents:UIControlEventTouchUpInside];
              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(dragFloatBtn:)];
              [self.floatBtn addGestureRecognizer:pan];
              [self.view addSubview:self.floatBtn];
              CABasicAnimation *pulse = [CABasicAnimation animationWithKeyPath:@"shadowRadius"];
              pulse.fromValue = @8; pulse.toValue = @18;
              pulse.duration  = 1.4; pulse.autoreverses = YES;
              pulse.repeatCount = HUGE_VALF;
              [self.floatBtn.layer addAnimation:pulse forKey:@"pulse"];
          }

          - (void)dragFloatBtn:(UIPanGestureRecognizer *)gr {
              CGPoint t = [gr translationInView:self.view];
              self.floatBtn.center = CGPointMake(self.floatBtn.center.x + t.x, self.floatBtn.center.y + t.y);
              [gr setTranslation:CGPointZero inView:self.view];
          }

          - (void)buildPanel {
              CGFloat pw = PANEL_W, ph = PANEL_H;
              self.panel = [[UIView alloc] initWithFrame:CGRectMake(0, 0, pw, ph)];
              self.panel.backgroundColor    = SRFX_BG;
              self.panel.layer.cornerRadius = 18;
              self.panel.layer.masksToBounds = YES;
              self.panel.layer.borderWidth  = 1.5;
              self.panel.layer.borderColor = SRFX_PURPLE.CGColor;
              self.panel.layer.shadowColor   = SRFX_PURPLE.CGColor;
              self.panel.layer.shadowOpacity = 0.5;
              self.panel.layer.shadowRadius  = 24;
              self.panel.layer.shadowOffset  = CGSizeZero;
              [self.view addSubview:self.panel];
          }

          - (void)buildSidebar {
              CGFloat ph = PANEL_H;
              self.sidebar = [[UIView alloc] initWithFrame:CGRectMake(0, 0, SIDEBAR_W, ph)];
              self.sidebar.backgroundColor = SRFX_SURFACE;
              [self.panel addSubview:self.sidebar];
              UIView *border = [[UIView alloc] initWithFrame:CGRectMake(SIDEBAR_W-1, 0, 1, ph)];
              border.backgroundColor = SRFX_BORDER;
              [self.sidebar addSubview:border];
              UILabel *logo = [[UILabel alloc] initWithFrame:CGRectMake(0, 14, SIDEBAR_W, 26)];
              logo.text          = @"S";
              logo.textColor     = SRFX_PINK;
              logo.font          = [UIFont boldSystemFontOfSize:22];
              logo.textAlignment = NSTextAlignmentCenter;
              [self.sidebar addSubview:logo];
              UIView *sep = [[UIView alloc] initWithFrame:CGRectMake(8, 46, SIDEBAR_W-16, 1)];
              sep.backgroundColor = SRFX_BORDER;
              [self.sidebar addSubview:sep];
              NSArray *icons = @[@"< >", @"◎", @"⌨", @"≡"];
              NSArray *tips  = @[@"Editor", @"ScriptBlox", @"Console", @"Settings"];
              NSMutableArray *btns = [NSMutableArray array];
              for (NSInteger i = 0; i < (NSInteger)icons.count; i++) {
                  SRFXSidebarButton *btn = [SRFXSidebarButton buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(6, 56 + i*52, SIDEBAR_W-12, 42);
                  btn.layer.cornerRadius = 10;
                  btn.titleLabel.font    = [UIFont systemFontOfSize:11 weight:UIFontWeightSemibold];
                  [btn setTitle:icons[i] forState:UIControlStateNormal];
                  btn.tag = i;
                  [btn addTarget:self action:@selector(sidebarTap:) forControlEvents:UIControlEventTouchUpInside];
                  btn.srfxSelected = (i == 0);
                  [self.sidebar addSubview:btn];
                  [btns addObject:btn];
              }
              self.sideBtns = [btns copy];
              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              closeBtn.frame = CGRectMake(6, ph - 52, SIDEBAR_W-12, 38);
              closeBtn.layer.cornerRadius = 10;
              closeBtn.backgroundColor = [UIColor colorWithRed:1 green:0.1 blue:0.1 alpha:0.18];
              [closeBtn setTitle:@"✕" forState:UIControlStateNormal];
              [closeBtn setTitleColor:[UIColor colorWithRed:1 green:0.4 blue:0.4 alpha:1] forState:UIControlStateNormal];
              closeBtn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [closeBtn addTarget:self action:@selector(closePanel) forControlEvents:UIControlEventTouchUpInside];
              [self.sidebar addSubview:closeBtn];
              for (NSInteger i = 0; i < (NSInteger)tips.count; i++) {
                  UILabel *tip = [[UILabel alloc] initWithFrame:CGRectMake(6, 94 + i*52, SIDEBAR_W-12, 12)];
                  tip.text          = tips[i];
                  tip.font          = [UIFont systemFontOfSize:8 weight:UIFontWeightRegular];
                  tip.textColor     = SRFX_MUTED;
                  tip.textAlignment = NSTextAlignmentCenter;
                  [self.sidebar addSubview:tip];
              }
          }

          - (void)buildHeader {
              CGFloat pw = PANEL_W;
              self.header = [[UIView alloc] initWithFrame:CGRectMake(SIDEBAR_W, 0, pw - SIDEBAR_W, 44)];
              self.header.backgroundColor = SRFX_SURFACE;
              [self.panel addSubview:self.header];
              CAGradientLayer *line = [self purplePinkGradientForFrame:CGRectMake(0, 43, pw - SIDEBAR_W, 1)];
              [self.header.layer addSublayer:line];
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(14, 0, 150, 44)];
              title.text      = @"SERFIX";
