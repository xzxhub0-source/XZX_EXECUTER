name: Build SERFIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download IPA
        run: |
          pipx run gdown https://drive.google.com/uc?id=16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW -O Roblox.ipa

      - name: Build insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Build Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 \
                -target arm64-apple-ios15.0 -I src \
                -o "src/$filename.o" "$file"
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Make dirs
        run: mkdir -p build SERFIX/UI injector/dylib/Core

      # FIX #6: Write stubs with explicit correct class names (no shell expansion)
      - name: Create stub files
        run: |
          # srfx_obfuscator
          cat > injector/dylib/srfx_obfuscator.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXObfuscator : NSObject
          + (instancetype)shared;
          @end
          EOF
          cat > injector/dylib/srfx_obfuscator.m << 'EOF'
          #import "srfx_obfuscator.h"
          @implementation SRFXObfuscator
          + (instancetype)shared {
              static id i; static dispatch_once_t t;
              dispatch_once(&t, ^{ i = [[self alloc] init]; }); return i;
          }
          @end
          EOF

          # srfx_editor
          cat > injector/dylib/srfx_editor.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXEditor : NSObject
          + (instancetype)shared;
          @end
          EOF
          cat > injector/dylib/srfx_editor.m << 'EOF'
          #import "srfx_editor.h"
          @implementation SRFXEditor
          + (instancetype)shared {
              static id i; static dispatch_once_t t;
              dispatch_once(&t, ^{ i = [[self alloc] init]; }); return i;
          }
          @end
          EOF

          # srfx_uibridge
          cat > injector/dylib/srfx_uibridge.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXUIBridge : NSObject
          + (instancetype)shared;
          @end
          EOF
          cat > injector/dylib/srfx_uibridge.m << 'EOF'
          #import "srfx_uibridge.h"
          @implementation SRFXUIBridge
          + (instancetype)shared {
              static id i; static dispatch_once_t t;
              dispatch_once(&t, ^{ i = [[self alloc] init]; }); return i;
          }
          @end
          EOF

          # FIX #7: srfx_memory now has a proper .m stub
          cat > injector/dylib/srfx_memory.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXMemory : NSObject
          + (void)obfuscate;
          @end
          EOF
          cat > injector/dylib/srfx_memory.m << 'EOF'
          #import "srfx_memory.h"
          @implementation SRFXMemory
          + (void)obfuscate {}
          @end
          EOF

      - name: Write entry.m
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "SRFXCore.h"
          __attribute__((constructor))
          static void srfx_entry(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC),
                             dispatch_get_main_queue(), ^{
                  [[SRFXCore shared] start];
              });
          }
          EOF

      - name: Write SRFXCore.h
        run: |
          cat > injector/dylib/SRFXCore.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface SRFXCore : NSObject
          + (instancetype)shared;
          - (void)start;
          - (void)showUI;
          - (void)hideUI;
          @property (nonatomic, strong) UIWindow *uiWindow;
          @property (nonatomic, assign) BOOL inGame;
          @property (nonatomic, strong) NSTimer *checkTimer;
          @property (nonatomic, assign) NSInteger positiveCount;
          @property (nonatomic, assign) NSInteger negativeCount;
          @end
          EOF

      - name: Write SRFXCore.m
        run: |
          cat > injector/dylib/SRFXCore.m << 'EOF'
          #import "SRFXCore.h"
          #import "SRFXMainViewController.h"
          #import <QuartzCore/QuartzCore.h>
          #include "Core/SRFXLua.h"

          static SRFXCore *instance = nil;
          static const NSInteger kDebounce = 3;

          @implementation SRFXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ instance = [[self alloc] init]; });
              return instance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _inGame = NO; _uiWindow = nil;
                  _positiveCount = 0; _negativeCount = 0;
              }
              return self;
          }

          - (void)start {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC),
                             dispatch_get_main_queue(), ^{
                  SRFXLuaInit();
                  [self startGameDetection];
              });
          }

          - (void)startGameDetection {
              __weak typeof(self) weak = self;
              self.checkTimer = [NSTimer scheduledTimerWithTimeInterval:1.2
                                                               repeats:YES
                                                                 block:^(NSTimer *t) {
                  __strong typeof(self) s = weak;
                  if (!s) { [t invalidate]; return; }
                  // All UIKit access on main queue — this timer already fires on main
                  BOOL nowInGame = [s isInsideGame];
                  if (nowInGame) { s.positiveCount++; s.negativeCount  = 0; }
                  else           { s.negativeCount++; s.positiveCount  = 0; }
                  if (!s.inGame && s.positiveCount >= kDebounce) {
                      s.inGame = YES; s.positiveCount = 0;
                      [s showUI];
                  } else if (s.inGame && s.negativeCount >= kDebounce) {
                      s.inGame = NO; s.negativeCount = 0;
                      [s hideUI];
                  }
              }];
          }

          // FIX #9: statusBarHidden + button count detection
          // Works on Roblox 2.714 where NSClassFromString returns nil for all
          // internal Roblox class names (they are obfuscated).
          //
          // Roblox 2.714 facts:
          //   Home screen: status bar VISIBLE, 15+ UIButtons
          //   In-game:     status bar HIDDEN (fullscreen), 3-5 UIButtons max
          //   Both states: CAMetalLayer present (Roblox renders everything via Metal)
          - (BOOL)isInsideGame {
              @try {
                  BOOL statusBarHidden = NO;
                  NSInteger buttonCount = 0;
                  BOOL hasMetalLayer = NO;

                  for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                      if (![scene isKindOfClass:[UIWindowScene class]]) continue;
                      UIWindowScene *ws = (UIWindowScene *)scene;

                      // Signal 1: status bar hidden = fullscreen game
                      if (ws.statusBarManager.statusBarHidden) statusBarHidden = YES;

                      for (UIWindow *window in ws.windows) {
                          if (window == self.uiWindow) continue;
                          // Signal 2: Metal = Roblox rendering active
                          if (!hasMetalLayer) hasMetalLayer = [self windowHasMetalLayer:window];
                          // Signal 3: few buttons = in-game HUD only
                          if (buttonCount < 20) buttonCount += [self countButtons:window];
                      }
                  }

                  return hasMetalLayer && statusBarHidden && (buttonCount < 6);
              } @catch (NSException *e) {
                  NSLog(@"[SERFIX] isInsideGame error: %@", e);
              }
              return NO;
          }

          - (BOOL)windowHasMetalLayer:(UIView *)view {
              @try {
                  if ([view.layer isKindOfClass:NSClassFromString(@"CAMetalLayer")]) return YES;
                  for (CALayer *sub in view.layer.sublayers ?: @[]) {
                      if ([sub isKindOfClass:NSClassFromString(@"CAMetalLayer")]) return YES;
                      for (CALayer *s2 in sub.sublayers ?: @[])
                          if ([s2 isKindOfClass:NSClassFromString(@"CAMetalLayer")]) return YES;
                  }
                  for (UIView *sub in view.subviews)
                      if ([self windowHasMetalLayer:sub]) return YES;
              } @catch (NSException *e) {}
              return NO;
          }

          - (NSInteger)countButtons:(UIView *)view {
              NSInteger n = 0;
              @try {
                  if ([view isKindOfClass:[UIButton class]]) n++;
                  if (n >= 20) return n;
                  for (UIView *sub in view.subviews) {
                      n += [self countButtons:sub];
                      if (n >= 20) return n;
                  }
              } @catch (NSException *e) {}
              return n;
          }

          - (void)showUI {
              if (!self.inGame) return;
              if (self.uiWindow && !self.uiWindow.hidden) return;
              if (UIApplication.sharedApplication.applicationState != UIApplicationStateActive) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC),
                                 dispatch_get_main_queue(), ^{ [self showUI]; });
                  return;
              }
              UIWindowScene *scene = nil;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]] &&
                      ((UIWindowScene *)s).activationState == UISceneActivationStateForegroundActive) {
                      scene = (UIWindowScene *)s; break;
                  }
              }
              if (!scene)
                  for (UIScene *s in UIApplication.sharedApplication.connectedScenes)
                      if ([s isKindOfClass:[UIWindowScene class]]) { scene=(UIWindowScene *)s; break; }
              if (!scene) return;

              if (!self.uiWindow) {
                  SRFXMainViewController *vc = [[SRFXMainViewController alloc] init];
                  self.uiWindow = [[UIWindow alloc] initWithWindowScene:scene];
                  self.uiWindow.windowLevel = UIWindowLevelAlert + 5;
                  self.uiWindow.backgroundColor = UIColor.clearColor;
                  self.uiWindow.hidden = YES;
                  self.uiWindow.rootViewController = vc;
              }
              self.uiWindow.hidden = NO;
              [self.uiWindow makeKeyAndVisible];
          }

          - (void)hideUI {
              if (!self.uiWindow) return;
              self.uiWindow.hidden = YES;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]]) {
                      UIWindow *rw = ((UIWindowScene *)s).windows.firstObject;
                      if (rw && rw != self.uiWindow) { [rw makeKeyWindow]; break; }
                  }
              }
          }

          @end
          EOF

      - name: Write SRFXScriptBlox.h
        run: |
          cat > injector/dylib/SRFXScriptBlox.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXScriptBlox : NSObject
          + (void)fetchTrending:(void(^)(NSArray *))completion;
          + (void)fetchScript:(NSString *)slug completion:(void(^)(NSString *))completion;
          + (void)search:(NSString *)query completion:(void(^)(NSArray *))completion;
          @end
          EOF

      - name: Write SRFXScriptBlox.m
        run: |
          cat > injector/dylib/SRFXScriptBlox.m << 'EOF'
          #import "SRFXScriptBlox.h"
          @implementation SRFXScriptBlox
          + (void)fetchTrending:(void(^)(NSArray *))completion {
              NSURL *url = [NSURL URLWithString:@"https://scriptblox.com/api/scripts?sort=trending&limit=50"];
              [[[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      id json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([json isKindOfClass:[NSDictionary class]]) {
                          NSMutableArray *res = [NSMutableArray array];
                          for (NSDictionary *s in json[@"scripts"])
                              [res addObject:@{@"title":s[@"title"]?:@"",@"author":s[@"author"]?:@"",@"game":s[@"game"]?:@"",@"slug":s[@"slug"]?:@""}];
                          completion(res); return;
                      }
                  }
                  completion(@[]);
              }] resume];
          }
          + (void)fetchScript:(NSString *)slug completion:(void(^)(NSString *))completion {
              NSString *us = [NSString stringWithFormat:@"https://scriptblox.com/api/scripts/%@", slug];
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:us] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      id json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      NSString *code = [json isKindOfClass:[NSDictionary class]] ? json[@"script"] : nil;
                      if (code) { completion(code); return; }
                  }
                  completion(@"");
              }] resume];
          }
          + (void)search:(NSString *)query completion:(void(^)(NSArray *))completion {
              NSString *enc = [query stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              NSString *us = [NSString stringWithFormat:@"https://scriptblox.com/api/scripts?search=%@&limit=30", enc];
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:us] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      id json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([json isKindOfClass:[NSDictionary class]]) {
                          NSMutableArray *res = [NSMutableArray array];
                          for (NSDictionary *s in json[@"scripts"])
                              [res addObject:@{@"title":s[@"title"]?:@"",@"slug":s[@"slug"]?:@""}];
                          completion(res); return;
                      }
                  }
                  completion(@[]);
              }] resume];
          }
          @end
          EOF

      - name: Write SRFXHooks.h
        run: |
          cat > injector/dylib/SRFXHooks.h << 'EOF'
          #ifndef SRFXHooks_h
          #define SRFXHooks_h
          void SRFXHooksInstall(void);
          #endif
          EOF

      - name: Write SRFXHooks.m
        run: |
          cat > injector/dylib/SRFXHooks.m << 'EOF'
          #import "SRFXHooks.h"
          void SRFXHooksInstall(void) {}
          EOF

      - name: Write srfx_security.h
        run: |
          cat > injector/dylib/srfx_security.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXSecurity : NSObject
          + (NSString *)spoofedHWID;
          @end
          EOF

      - name: Write srfx_security.m
        run: |
          cat > injector/dylib/srfx_security.m << 'EOF'
          #import "srfx_security.h"
          #import <CommonCrypto/CommonDigest.h>
          @implementation SRFXSecurity
          + (NSString *)spoofedHWID {
              NSMutableString *h = [NSMutableString string];
              for (int i=0;i<32;i++) [h appendFormat:@"%X",arc4random_uniform(16)];
              const char *in=[h UTF8String]; unsigned char out[CC_SHA256_DIGEST_LENGTH];
              CC_SHA256(in,(CC_LONG)strlen(in),out);
              NSMutableString *r=[NSMutableString string];
              for (int i=0;i<CC_SHA256_DIGEST_LENGTH;i++) [r appendFormat:@"%02X",out[i]];
              return r;
          }
          @end
          EOF

      - name: Write SRFXLua.h
        run: |
          cat > injector/dylib/Core/SRFXLua.h << 'EOF'
          #ifndef SRFXLua_h
          #define SRFXLua_h
          struct lua_State;
          #ifdef __cplusplus
          extern "C" {
          #endif
          void SRFXLuaInit(void);
          void SRFXLuaExecute(const char *script);
          void SRFXLuaRegister(const char *name, int (*func)(struct lua_State*));
          struct lua_State* SRFXLuaState(void);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      # FIX #2 + #3: srfx_getscript uses semaphore not NSRunLoop spin.
      # srfx_wait released mutex before sleeping then reacquires.
      - name: Write SRFXLua.mm
        run: |
          cat > injector/dylib/Core/SRFXLua.mm << 'CPPEOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include <pthread.h>
          #include <unistd.h>
          #include "SRFXLua.h"
          #import "srfx_security.h"

          static lua_State *L = NULL;
          static pthread_mutex_t lua_mutex = PTHREAD_MUTEX_INITIALIZER;

          extern "C" {

          static int srfx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *out = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [out appendString:@" "];
                  if (lua_isstring(L, i))       [out appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i))  [out appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [out appendString:lua_toboolean(L, i) ? @"true" : @"false"];
                  else if (lua_istable(L, i))   [out appendString:@"table"];
                  else if (lua_isfunction(L, i))[out appendString:@"function"];
                  else                          [out appendString:@"nil"];
              }
              NSString *copy = [out copy];
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"SRFXPrint" object:copy];
              });
              return 0;
          }

          static int srfx_warn(lua_State *L) { return srfx_print(L); }

          // FIX #2: use dispatch_semaphore, not NSRunLoop spin
          static int srfx_getscript(lua_State *L) {
              const char *urlStr = luaL_checkstring(L, 1);
              NSURL *url = [NSURL URLWithString:[NSString stringWithUTF8String:urlStr]];
              if (!url) { lua_pushnil(L); return 1; }
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:url];
              [req setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              [[[NSURLSession sharedSession] dataTaskWithRequest:req
                  completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  if (data && !e)
                      result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(sem);
              }] resume];
              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC));
              if (result) lua_pushstring(L, result.UTF8String);
              else lua_pushnil(L);
              return 1;
          }

          static int srfx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              int s = luaL_loadstring(L, code);
              if (s != LUA_OK) { lua_pushnil(L); lua_insert(L, -2); return 2; }
              return 1;
          }

          static int srfx_base64_encode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSString *e = [[NSData dataWithBytes:d length:strlen(d)] base64EncodedStringWithOptions:0];
              lua_pushstring(L, [e UTF8String]); return 1;
          }

          static int srfx_base64_decode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSData *dec = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:d] options:0];
              NSString *s = dec ? [[NSString alloc] initWithData:dec encoding:NSUTF8StringEncoding] : nil;
              lua_pushstring(L, s ? [s UTF8String] : ""); return 1;
          }

          static int srfx_identifyexecutor (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_getexecutorname  (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_checkcaller      (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int srfx_isrbxactive      (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int srfx_getthreadidentity(lua_State *L) { lua_pushinteger(L,8); return 1; }
          static int srfx_setthreadidentity(lua_State *L) { (void)L; return 0; }
          static int srfx_fireclickdetector(lua_State *L) { (void)L; return 0; }
          static int srfx_getgenv          (lua_State *L) { lua_pushglobaltable(L); return 1; }
          static int srfx_getreg           (lua_State *L) { lua_pushvalue(L, LUA_REGISTRYINDEX); return 1; }

          // FIX #3: srfx_wait must NOT hold the mutex while sleeping.
          // This is a C function called FROM within a locked SRFXLuaExecute call,
          // so we unlock before sleeping and relock after.
          static int srfx_wait(lua_State *L) {
              double sec = luaL_optnumber(L, 1, 0);
              if (sec > 0) {
                  pthread_mutex_unlock(&lua_mutex);
                  usleep((useconds_t)(sec * 1000000));
                  pthread_mutex_lock(&lua_mutex);
              }
              return 0;
          }

          static int srfx_getgc            (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getconnections   (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_hookfunction     (lua_State *L) { lua_pushvalue(L,1); return 1; }
          static int srfx_newcclosure      (lua_State *L) { lua_pushvalue(L,1); return 1; }
          static int srfx_getconstants     (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getupvalues      (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_setupvalue       (lua_State *L) { (void)L; return 0; }
          static int srfx_getupvalue       (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getproto         (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getstack         (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getinfo          (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_islclosure       (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int srfx_firesignal       (lua_State *L) { (void)L; return 0; }
          static int srfx_connect          (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_disconnect       (lua_State *L) { (void)L; return 0; }
          static int srfx_waitforchild     (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getservice       (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getchildren      (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getdescendants   (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_findfirstchild   (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getproperties    (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getproperty      (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_setproperty      (lua_State *L) { (void)L; return 0; }
          static int srfx_gethiddenproperty(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_sethiddenproperty(lua_State *L) { (void)L; return 0; }
          static int srfx_getrawmetatable  (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_setrawmetatable  (lua_State *L) { (void)L; return 0; }
          static int srfx_make_writeable   (lua_State *L) { (void)L; return 0; }
          static int srfx_getcallingscript (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_getscripthash    (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_httpget          (lua_State *L) { return srfx_getscript(L); }
          static int srfx_httppost         (lua_State *L) { lua_pushstring(L,""); return 1; }
          static int srfx_setclipboard     (lua_State *L) { (void)L; return 0; }
          static int srfx_getclipboard     (lua_State *L) { lua_pushstring(L,""); return 1; }
          static int srfx_messagebox       (lua_State *L) { (void)L; return 0; }
          static int srfx_isfile           (lua_State *L) { lua_pushboolean(L,0); return 1; }
          static int srfx_isfolder         (lua_State *L) { lua_pushboolean(L,0); return 1; }
          static int srfx_listfiles        (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_readfile         (lua_State *L) { lua_pushstring(L,""); return 1; }
          static int srfx_writefile        (lua_State *L) { (void)L; return 0; }
          static int srfx_appendfile       (lua_State *L) { (void)L; return 0; }
          static int srfx_deletefile       (lua_State *L) { (void)L; return 0; }
          static int srfx_makefolder       (lua_State *L) { (void)L; return 0; }
          static int srfx_dofile           (lua_State *L) { (void)L; return 0; }
          static int srfx_loadfile         (lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_createnotification(lua_State *L){ (void)L; return 0; }
          static int srfx_webhook          (lua_State *L) { (void)L; return 0; }
          static int srfx_setfpscap        (lua_State *L) { (void)L; return 0; }
          static int srfx_getfps           (lua_State *L) { lua_pushinteger(L,60); return 1; }
          static int srfx_getping          (lua_State *L) { lua_pushinteger(L,30); return 1; }
          static int srfx_gethwid          (lua_State *L) {
              lua_pushstring(L, [SRFXSecurity spoofedHWID].UTF8String); return 1;
          }
          static int srfx_getuser          (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_getexecutionpath (lua_State *L) { lua_pushstring(L,"SERFIX"); return 1; }
          static int srfx_clonefunction    (lua_State *L) { lua_pushvalue(L,1); return 1; }
          static int srfx_isfolder_ins     (lua_State *L) { lua_pushboolean(L,0); return 1; }
          static int srfx_isscript         (lua_State *L) { lua_pushboolean(L,0); return 1; }
          static int srfx_getinstances     (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getscripts       (lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getloadedmodules (lua_State *L) { lua_newtable(L); return 1; }

          void SRFXLuaInit(void) {
              if (L) return;
              L = luaL_newstate();
              if (!L) { NSLog(@"[SERFIX] FATAL: luaL_newstate failed"); return; }
              luaL_openlibs(L);
              #define REG(name, fn) lua_register(L, name, fn)
              REG("print",srfx_print); REG("warn",srfx_warn);
              REG("getscript",srfx_getscript); REG("loadstring",srfx_loadstring);
              REG("base64_encode",srfx_base64_encode); REG("base64_decode",srfx_base64_decode);
              REG("identifyexecutor",srfx_identifyexecutor); REG("getexecutorname",srfx_getexecutorname);
              REG("checkcaller",srfx_checkcaller); REG("isrbxactive",srfx_isrbxactive);
              REG("getthreadidentity",srfx_getthreadidentity); REG("setthreadidentity",srfx_setthreadidentity);
              REG("fireclickdetector",srfx_fireclickdetector); REG("getgenv",srfx_getgenv);
              REG("getreg",srfx_getreg); REG("wait",srfx_wait);
              REG("getgc",srfx_getgc); REG("getconnections",srfx_getconnections);
              REG("hookfunction",srfx_hookfunction); REG("newcclosure",srfx_newcclosure);
              REG("getconstants",srfx_getconstants); REG("getupvalues",srfx_getupvalues);
              REG("setupvalue",srfx_setupvalue); REG("getupvalue",srfx_getupvalue);
              REG("getproto",srfx_getproto); REG("getstack",srfx_getstack);
              REG("getinfo",srfx_getinfo); REG("islclosure",srfx_islclosure);
              REG("firesignal",srfx_firesignal); REG("connect",srfx_connect);
              REG("disconnect",srfx_disconnect); REG("waitforchild",srfx_waitforchild);
              REG("getservice",srfx_getservice); REG("getchildren",srfx_getchildren);
              REG("getdescendants",srfx_getdescendants); REG("findfirstchild",srfx_findfirstchild);
              REG("getproperties",srfx_getproperties); REG("getproperty",srfx_getproperty);
              REG("setproperty",srfx_setproperty); REG("gethiddenproperty",srfx_gethiddenproperty);
              REG("sethiddenproperty",srfx_sethiddenproperty); REG("getrawmetatable",srfx_getrawmetatable);
              REG("setrawmetatable",srfx_setrawmetatable); REG("make_writeable",srfx_make_writeable);
              REG("getcallingscript",srfx_getcallingscript); REG("getscripthash",srfx_getscripthash);
              REG("http_get",srfx_httpget); REG("http_post",srfx_httppost);
              REG("setclipboard",srfx_setclipboard); REG("getclipboard",srfx_getclipboard);
              REG("messagebox",srfx_messagebox); REG("isfile",srfx_isfile);
              REG("isfolder",srfx_isfolder); REG("listfiles",srfx_listfiles);
              REG("readfile",srfx_readfile); REG("writefile",srfx_writefile);
              REG("appendfile",srfx_appendfile); REG("deletefile",srfx_deletefile);
              REG("makefolder",srfx_makefolder); REG("dofile",srfx_dofile);
              REG("loadfile",srfx_loadfile); REG("createnotification",srfx_createnotification);
              REG("webhook",srfx_webhook); REG("setfpscap",srfx_setfpscap);
              REG("getfps",srfx_getfps); REG("getping",srfx_getping);
              REG("gethwid",srfx_gethwid); REG("getuser",srfx_getuser);
              REG("getexecutionpath",srfx_getexecutionpath); REG("clonefunction",srfx_clonefunction);
              REG("isfolder_ins",srfx_isfolder_ins); REG("isscript",srfx_isscript);
              REG("getinstances",srfx_getinstances); REG("getscripts",srfx_getscripts);
              REG("getloadedmodules",srfx_getloadedmodules);
              #undef REG
              lua_newtable(L);
              lua_pushstring(L,"SERFIX"); lua_setfield(L,-2,"name");
              lua_pushstring(L,"2.5.0");  lua_setfield(L,-2,"version");
              lua_setglobal(L,"serfix");
              NSLog(@"[SERFIX] Lua ready");
          }

          void SRFXLuaExecute(const char *script) {
              if (!script || !script[0]) return;
              pthread_mutex_lock(&lua_mutex);
              if (!L) SRFXLuaInit();
              if (L) {
                  int s = luaL_dostring(L, script);
                  if (s != LUA_OK) {
                      const char *err = lua_tostring(L, -1);
                      NSString *errStr = err ? [NSString stringWithUTF8String:err] : @"unknown error";
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [[NSNotificationCenter defaultCenter]
                              postNotificationName:@"SRFXError" object:errStr];
                      });
                      lua_pop(L, 1);
                  }
              }
              pthread_mutex_unlock(&lua_mutex);
          }

          void SRFXLuaRegister(const char *name, int (*func)(lua_State*)) {
              pthread_mutex_lock(&lua_mutex);
              if (L && name && func) lua_register(L, name, func);
              pthread_mutex_unlock(&lua_mutex);
          }

          lua_State* SRFXLuaState(void) { return L; }

          } // extern "C"
          CPPEOF

      - name: Write SRFXMainViewController.h
        run: |
          cat > SERFIX/UI/SRFXMainViewController.h << 'EOF'
