name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Download and compile Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 \
                -o "src/$filename.o" "src/$filename.c" \
                -target arm64-apple-ios15.0 -I src
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create directory structure
        run: |
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core

      # (Include all the source file creation steps as shown above)
      # For brevity, I have omitted the full `cat` commands here,
      # but they must match the files listed in this document.

      - name: Compile Objective-C files
        run: |
          mkdir -p build
          CORE_FILES="
            injector/dylib/entry.m
            injector/dylib/xzx_core.m
            injector/dylib/xzx_hooks.m
            XZX/UI/XZXMainViewController.m
          "
          STUB_FILES=$(ls injector/dylib/xzx_*.m 2>/dev/null \
            | grep -v xzx_core.m | grep -v xzx_hooks.m || true)
          ALL_FILES="$CORE_FILES $STUB_FILES"
          for file in $ALL_FILES; do
            [ -f "$file" ] || continue
            out="build/$(basename "$file" .m).o"
            xcrun -sdk iphoneos clang -c \
              -I./injector/dylib \
              -I./injector/dylib/Core \
              -I./XZX/UI \
              -I${{ env.LUA_INCLUDE_DIR }} \
              -o "$out" "$file" \
              -target arm64-apple-ios15.0 \
              && echo "✓ $file" || { echo "✗ FAILED: $file"; exit 1; }
          done

      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            [ -f "$file" ] || continue
            out="build/$(basename "$file" .mm).o"
            xcrun -sdk iphoneos clang++ -c -std=c++17 \
              -I./injector/dylib \
              -I./injector/dylib/Core \
              -I${{ env.LUA_INCLUDE_DIR }} \
              -o "$out" "$file" \
              -target arm64-apple-ios15.0 \
              && echo "✓ $file" || { echo "✗ FAILED: $file"; exit 1; }
          done

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework WebKit \
            -framework QuartzCore \
            -framework Metal \
            -L${{ env.LUA_LIB_DIR }} \
            -Wl,-force_load,${{ env.LUA_LIB_DIR }}/liblua.a \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -undefined dynamic_lookup \
            -o build/executor.dylib build/*.o \
            -lc++ -target arm64-apple-ios15.0
          echo "✅ Dylib linked"
          ls -lh build/executor.dylib

      - name: Sign dylib
        run: codesign -f -s - build/executor.dylib

      - name: Extract and patch IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f  extracted/Payload/Roblox.app/embedded.mobileprovision

          ./tools/insert_dylib --all-yes @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched
          mv extracted/Payload/Roblox.app/Roblox_patched \
             extracted/Payload/Roblox.app/Roblox

          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"

      - name: Resign the app
        run: codesign -f -s - extracted/Payload/Roblox.app

      - name: Create IPA
        run: |
          cd extracted && zip -qr ../XZX.ipa Payload/ && cd ..
          echo "✅ IPA ready"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
