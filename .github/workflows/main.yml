      - name: Create xzx_obfuscator.m
        run: |
          cat > injector/dylib/xzx_obfuscator.m << 'EOF'
          #import "xzx_obfuscator.h"
          #import <objc/runtime.h>

          static XZXObfuscator *sharedInstance = nil;
          static int xorKey = 0xAA;

          @implementation XZXObfuscator

          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedInstance = [[self alloc] init];
              });
              return sharedInstance;
          }

          - (NSString*)decrypt:(NSString*)encrypted {
              NSMutableString *decrypted = [NSMutableString string];
              for (int i = 0; i < encrypted.length; i++) {
                  unichar c = [encrypted characterAtIndex:i];
                  c ^= xorKey;
                  [decrypted appendFormat:@"%C", c];
              }
              return decrypted;
          }

          - (NSString*)encrypt:(NSString*)plain {
              NSMutableString *encrypted = [NSMutableString string];
              for (int i = 0; i < plain.length; i++) {
                  unichar c = [plain characterAtIndex:i];
                  c ^= xorKey;
                  [encrypted appendFormat:@"%C", c];
              }
              return encrypted;
          }

          @end

          NSString* xzx_obfuscate(const char* input) {
              NSMutableString *result = [NSMutableString string];
              int key = 0xAA;
              for (size_t i = 0; i < strlen(input); i++) {
                  char c = input[i] ^ key;
                  [result appendFormat:@"%c", c];
                  key = (key * 31) & 0xFF;
              }
              return result;
          }

          Class xzx_getClass(const char* encryptedName) {
              NSString *decrypted = xzx_obfuscate(encryptedName);
              return NSClassFromString(decrypted);
          }

          SEL xzx_getSelector(const char* encryptedName) {
              NSString *decrypted = xzx_obfuscate(encryptedName);
              return NSSelectorFromString(decrypted);
          }
          EOF

