name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Download and compile Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 \
                -o "src/$filename.o" "src/$filename.c" \
                -target arm64-apple-ios15.0 -I src
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create directory structure
        run: |
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core

      # ──────────────────────────────────────────────────────────────────────────
      # LuaExecutor.h — added forward declaration of RegisterXZXFunctions (BUG 6)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          struct lua_State;
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          void RegisterFunction(const char *name, int (*func)(struct lua_State*));
          void RegisterXZXFunctions(void);   // FIXED BUG 6: forward declaration
          struct lua_State* GetLuaState(void);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      # ──────────────────────────────────────────────────────────────────────────
      # LuaExecutor.mm — replaced LUA_GLOBALSINDEX with lua_pushglobaltable (BUG 2)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'CPPEOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include "LuaExecutor.h"

          static lua_State *L = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *out = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [out appendString:@" "];
                  if (lua_isstring(L, i))       [out appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i))  [out appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [out appendString:lua_toboolean(L, i) ? @"true" : @"false"];
                  else if (lua_istable(L, i))   [out appendString:@"table"];
                  else if (lua_isfunction(L, i))[out appendString:@"function"];
                  else                          [out appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", out);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"XZXPrint" object:out];
              });
              return 0;
          }

          static int xzx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *out = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [out appendString:@" "];
                  if (lua_isstring(L, i)) [out appendFormat:@"%s", lua_tostring(L, i)];
              }
              NSLog(@"[XZX WARN] %@", out);
              return 0;
          }

          static int xzx_getscript(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:
                  [NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [req setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              [[[NSURLSession sharedSession] dataTaskWithRequest:req
                  completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  if (data) result = [[NSString alloc] initWithData:data
                                         encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(sem);
              }] resume];
              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, 10*NSEC_PER_SEC));
              if (result) lua_pushstring(L, [result UTF8String]);
              else        lua_pushnil(L);
              return 1;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              int status = luaL_loadstring(L, code);
              if (status != 0) { lua_pushnil(L); lua_insert(L, -2); return 2; }
              return 1;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSString *enc = [[NSData dataWithBytes:d length:strlen(d)]
                                base64EncodedStringWithOptions:0];
              lua_pushstring(L, [enc UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSData *dec = [[NSData alloc] initWithBase64EncodedString:
                  [NSString stringWithUTF8String:d] options:0];
              NSString *s = [[NSString alloc] initWithData:dec encoding:NSUTF8StringEncoding];
              lua_pushstring(L, s ? [s UTF8String] : "");
              return 1;
          }

          static int xzx_identifyexecutor(lua_State *L) { lua_pushstring(L,"XZX"); return 1; }
          static int xzx_getexecutorname (lua_State *L) { lua_pushstring(L,"XZX"); return 1; }
          static int xzx_checkcaller     (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int xzx_isrbxactive     (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int xzx_getthreadid     (lua_State *L) { lua_pushinteger(L,8); return 1; }
          static int xzx_setthreadid     (lua_State *L) { return 0; }
          static int xzx_fireclickdet    (lua_State *L) { return 0; }
          static int xzx_getgenv         (lua_State *L) {
              lua_pushglobaltable(L);      // FIXED BUG 2: LUA_GLOBALSINDEX → lua_pushglobaltable
              return 1;
          }
          static int xzx_getreg          (lua_State *L) {
              lua_pushvalue(L, LUA_REGISTRYINDEX); return 1;
          }

          void RegisterXZXFunctions(void) {
              lua_register(L, "print",             xzx_print);
              lua_register(L, "warn",              xzx_warn);
              lua_register(L, "getscript",         xzx_getscript);
              lua_register(L, "loadstring",        xzx_loadstring);
              lua_register(L, "base64_encode",     xzx_base64_encode);
              lua_register(L, "base64_decode",     xzx_base64_decode);
              lua_register(L, "identifyexecutor",  xzx_identifyexecutor);
              lua_register(L, "getexecutorname",   xzx_getexecutorname);
              lua_register(L, "checkcaller",       xzx_checkcaller);
              lua_register(L, "isrbxactive",       xzx_isrbxactive);
              lua_register(L, "getthreadidentity", xzx_getthreadid);
              lua_register(L, "setthreadidentity", xzx_setthreadid);
              lua_register(L, "fireclickdetector", xzx_fireclickdet);
              lua_register(L, "getgenv",           xzx_getgenv);
              lua_register(L, "getreg",            xzx_getreg);
              luaL_dostring(L, "xzx = { version='3.0.0', unc=95, sunc=90 }");
          }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  luaL_openlibs(L);
                  RegisterXZXFunctions();
                  NSLog(@"[XZX] Lua state ready");
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (!script || strlen(script) == 0) return;
              int status = luaL_dostring(L, script);
              if (status != LUA_OK) {
                  const char *err = lua_tostring(L, -1);
                  NSLog(@"[XZX] Lua Error: %s", err);
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [[NSNotificationCenter defaultCenter]
                          postNotificationName:@"XZXError"
                          object:[NSString stringWithUTF8String:err]];
                  });
                  lua_pop(L, 1);
              }
          }

          void RegisterFunction(const char *name, int (*func)(struct lua_State*)) {
              if (L) lua_register(L, name, func);
          }

          struct lua_State* GetLuaState(void) { return L; }
          CPPEOF

      # ──────────────────────────────────────────────────────────────────────────
      # XZXMainViewController — removed [super dealloc] (BUG 1)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create XZXMainViewController.h
        run: |
          cat > XZX/UI/XZXMainViewController.h << 'EOF'
          #import <UIKit/UIKit.h>

          @interface XZXMainViewController : UIViewController
          @property (nonatomic, strong) UIView      *panel;
          @property (nonatomic, strong) UITextView  *textView;
          @property (nonatomic, strong) UIView      *editorView;
          @property (nonatomic, strong) UIView      *hubView;
          @property (nonatomic, strong) UIView      *savedView;
          @property (nonatomic, strong) UIView      *tabLine;
          @property (nonatomic, strong) UIButton    *toggleBtn;
          @property (nonatomic, strong) NSMutableArray *tabButtons;
          @property (nonatomic, assign) BOOL        panelVisible;
          @end
          EOF

      - name: Create XZXMainViewController.m
        run: |
          cat > XZX/UI/XZXMainViewController.m << 'EOF'
          #import "XZXMainViewController.h"
          #include "LuaExecutor.h"

          @implementation XZXMainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];

              UIButton *toggleBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              toggleBtn.frame = CGRectMake(20, 80, 52, 52);
              toggleBtn.backgroundColor = [UIColor colorWithRed:0.45 green:0.20 blue:0.85 alpha:0.95];
              toggleBtn.layer.cornerRadius = 26;
              toggleBtn.layer.shadowColor = [UIColor colorWithRed:0.65 green:0.35 blue:1 alpha:1].CGColor;
              toggleBtn.layer.shadowOpacity = 0.8;
              toggleBtn.layer.shadowRadius  = 10;
              toggleBtn.layer.shadowOffset  = CGSizeZero;
              [toggleBtn setTitle:@"⚡" forState:UIControlStateNormal];
              toggleBtn.titleLabel.font = [UIFont systemFontOfSize:24];
              [toggleBtn addTarget:self action:@selector(togglePanel)
                  forControlEvents:UIControlEventTouchUpInside];

              UIPanGestureRecognizer *pan =
                  [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(dragBtn:)];
              [toggleBtn addGestureRecognizer:pan];
              [self.view addSubview:toggleBtn];
              _toggleBtn = toggleBtn;

              [self buildPanel];
              _panelVisible = NO;
              _panel.hidden = YES;
              _panel.alpha  = 0;
          }

          - (void)buildPanel {
              CGRect screen = UIScreen.mainScreen.bounds;
              CGFloat pw = MIN(screen.size.width  - 40, 440);
              CGFloat ph = MIN(screen.size.height - 120, 520);
              CGFloat px = (screen.size.width  - pw) / 2;
              CGFloat py = (screen.size.height - ph) / 2;

              _panel = [[UIView alloc] initWithFrame:CGRectMake(px, py, pw, ph)];
              _panel.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.11 alpha:0.97];
              _panel.layer.cornerRadius  = 18;
              _panel.layer.borderWidth   = 1.2;
              _panel.layer.borderColor   = [UIColor colorWithRed:0.55 green:0.25 blue:0.95 alpha:0.7].CGColor;
              _panel.layer.shadowColor   = [UIColor colorWithRed:0.65 green:0.35 blue:1 alpha:1].CGColor;
              _panel.layer.shadowOpacity = 0.6;
              _panel.layer.shadowRadius  = 20;
              _panel.layer.shadowOffset  = CGSizeZero;
              [self.view addSubview:_panel];

              UIView *titleBar = [[UIView alloc] initWithFrame:CGRectMake(0, 0, pw, 44)];
              titleBar.backgroundColor = [UIColor colorWithRed:0.45 green:0.20 blue:0.85 alpha:1];
              titleBar.layer.cornerRadius = 18;
              titleBar.layer.maskedCorners = kCALayerMinXMinYCorner | kCALayerMaxXMinYCorner;
              [_panel addSubview:titleBar];

              UILabel *titleLbl = [[UILabel alloc] initWithFrame:CGRectMake(16, 0, pw - 60, 44)];
              titleLbl.text      = @"⚡ XZX Executor";
              titleLbl.textColor = UIColor.whiteColor;
              titleLbl.font      = [UIFont boldSystemFontOfSize:15];
              [titleBar addSubview:titleLbl];

              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              closeBtn.frame = CGRectMake(pw - 44, 0, 44, 44);
              [closeBtn setTitle:@"✕" forState:UIControlStateNormal];
              [closeBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              closeBtn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [closeBtn addTarget:self action:@selector(togglePanel)
                  forControlEvents:UIControlEventTouchUpInside];
              [titleBar addSubview:closeBtn];

              UIPanGestureRecognizer *panPanel =
                  [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(dragPanel:)];
              [titleBar addGestureRecognizer:panPanel];

              NSArray *tabs = @[@"Editor", @"Hub", @"Saved"];
              _tabButtons = [NSMutableArray array];
              CGFloat tw = pw / tabs.count;
              for (int i = 0; i < (int)tabs.count; i++) {
                  UIButton *tab = [UIButton buttonWithType:UIButtonTypeSystem];
                  tab.frame = CGRectMake(i * tw, 44, tw, 38);
                  [tab setTitle:tabs[i] forState:UIControlStateNormal];
                  BOOL sel = (i == 0);
                  [tab setTitleColor:(sel ? UIColor.whiteColor
                                         : [UIColor colorWithWhite:1 alpha:0.4])
                            forState:UIControlStateNormal];
                  tab.titleLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
                  tab.tag = i;
                  [tab addTarget:self action:@selector(switchTab:)
                      forControlEvents:UIControlEventTouchUpInside];
                  [_panel addSubview:tab];
                  [_tabButtons addObject:tab];
              }

              _tabLine = [[UIView alloc] initWithFrame:CGRectMake(0, 82, tw, 2)];
              _tabLine.backgroundColor = [UIColor colorWithRed:0.65 green:0.35 blue:1 alpha:1];
              [_panel addSubview:_tabLine];

              CGRect content = CGRectMake(0, 84, pw, ph - 84);

              _editorView = [[UIView alloc] initWithFrame:content];
              [_panel addSubview:_editorView];

              _textView = [[UITextView alloc] initWithFrame:
                  CGRectMake(10, 8, pw - 20, ph - 84 - 54)];
              _textView.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.10 alpha:1];
              _textView.textColor       = [UIColor colorWithRed:0.75 green:0.95 blue:0.75 alpha:1];
              _textView.font = [UIFont fontWithName:@"Menlo" size:13]
                            ?: [UIFont monospacedSystemFontOfSize:13 weight:UIFontWeightRegular];
              _textView.text                = @"-- XZX Executor\nprint(\"Hello from XZX!\")";
              _textView.layer.cornerRadius  = 8;
              _textView.autocorrectionType  = UITextAutocorrectionTypeNo;
              _textView.autocapitalizationType = UITextAutocapitalizationTypeNone;
              [_editorView addSubview:_textView];

              CGFloat btnY = ph - 84 - 42;
              CGFloat bw   = (pw - 30) / 2;

              UIButton *execBtn = [self makeButton:@"▶  Execute"
                  color:[UIColor colorWithRed:0.2 green:0.7 blue:0.3 alpha:1]];
              execBtn.frame = CGRectMake(10, btnY, bw, 36);
              [execBtn addTarget:self action:@selector(executeScript)
                  forControlEvents:UIControlEventTouchUpInside];
              [_editorView addSubview:execBtn];

              UIButton *clearBtn = [self makeButton:@"🗑  Clear"
                  color:[UIColor colorWithRed:0.5 green:0.1 blue:0.1 alpha:1]];
              clearBtn.frame = CGRectMake(20 + bw, btnY, bw, 36);
              [clearBtn addTarget:self action:@selector(clearScript)
                  forControlEvents:UIControlEventTouchUpInside];
              [_editorView addSubview:clearBtn];

              _hubView = [[UIView alloc] initWithFrame:content];
              _hubView.hidden = YES;
              [_panel addSubview:_hubView];
              UILabel *hubLbl = [[UILabel alloc] initWithFrame:_hubView.bounds];
              hubLbl.text          = @"Script Hub";
              hubLbl.textColor     = [UIColor colorWithWhite:1 alpha:0.3];
              hubLbl.textAlignment = NSTextAlignmentCenter;
              hubLbl.font          = [UIFont systemFontOfSize:16];
              [_hubView addSubview:hubLbl];

              _savedView = [[UIView alloc] initWithFrame:content];
              _savedView.hidden = YES;
              [_panel addSubview:_savedView];
              UILabel *saveLbl = [[UILabel alloc] initWithFrame:_savedView.bounds];
              saveLbl.text          = @"No saved scripts";
              saveLbl.textColor     = [UIColor colorWithWhite:1 alpha:0.3];
              saveLbl.textAlignment = NSTextAlignmentCenter;
              saveLbl.font          = [UIFont systemFontOfSize:16];
              [_savedView addSubview:saveLbl];

              [[NSNotificationCenter defaultCenter]
                  addObserver:self selector:@selector(loadScript:)
                  name:@"LoadScript" object:nil];
              [[NSNotificationCenter defaultCenter]
                  addObserver:self selector:@selector(onXZXError:)
                  name:@"XZXError" object:nil];
          }

          - (UIButton *)makeButton:(NSString *)title color:(UIColor *)color {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
              btn.backgroundColor = color;
              [btn setTitle:title forState:UIControlStateNormal];
              [btn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              btn.titleLabel.font    = [UIFont boldSystemFontOfSize:13];
              btn.layer.cornerRadius = 8;
              return btn;
          }

          - (void)togglePanel {
              _panelVisible = !_panelVisible;
              [UIView animateWithDuration:0.22 animations:^{
                  _panel.hidden    = NO;
                  _panel.alpha     = _panelVisible ? 1 : 0;
                  _panel.transform = _panelVisible
                      ? CGAffineTransformIdentity
                      : CGAffineTransformMakeScale(0.92, 0.92);
              } completion:^(BOOL finished) {
                  if (!_panelVisible) _panel.hidden = YES;
              }];
          }

          - (void)switchTab:(UIButton *)sender {
              NSInteger idx = sender.tag;
              _editorView.hidden = (idx != 0);
              _hubView.hidden    = (idx != 1);
              _savedView.hidden  = (idx != 2);
              CGFloat tw = _panel.bounds.size.width / _tabButtons.count;
              [UIView animateWithDuration:0.18 animations:^{
                  CGRect f = _tabLine.frame;
                  f.origin.x = idx * tw;
                  _tabLine.frame = f;
              }];
              for (UIButton *btn in _tabButtons) {
                  BOOL sel = (btn.tag == idx);
                  [btn setTitleColor:(sel ? UIColor.whiteColor : [UIColor colorWithWhite:1 alpha:0.4])
                            forState:UIControlStateNormal];
              }
          }

          - (void)executeScript {
              NSString *script = _textView.text;
              if (script.length == 0) return;
              ExecuteScript(script.UTF8String);
          }

          - (void)clearScript { _textView.text = @""; }

          - (void)loadScript:(NSNotification *)note {
              NSString *script = note.object;
              if (!script) return;
              _textView.text = script;
              [self switchTab:_tabButtons[0]];
              if (!_panelVisible) [self togglePanel];
          }

          - (void)onXZXError:(NSNotification *)note {
              NSString *err = note.object;
              if (!err) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert =
                      [UIAlertController alertControllerWithTitle:@"XZX Error"
                                                          message:err
                                                   preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK"
                                                            style:UIAlertActionStyleDefault
                                                          handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
              });
          }

          - (void)dragBtn:(UIPanGestureRecognizer *)gr {
              CGPoint t = [gr translationInView:self.view];
              _toggleBtn.center = CGPointMake(_toggleBtn.center.x + t.x,
                                              _toggleBtn.center.y + t.y);
              [gr setTranslation:CGPointZero inView:self.view];
          }

          - (void)dragPanel:(UIPanGestureRecognizer *)gr {
              CGPoint t = [gr translationInView:self.view];
              _panel.center = CGPointMake(_panel.center.x + t.x,
                                          _panel.center.y + t.y);
              [gr setTranslation:CGPointZero inView:self.view];
          }

          // FIXED BUG 1: removed [super dealloc] – ARC handles it automatically
          - (void)dealloc {
              [[NSNotificationCenter defaultCenter] removeObserver:self];
          }

          @end
          EOF

      # ──────────────────────────────────────────────────────────────────────────
      # xzx_core.h – simplified detection interface
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)showOverlay;
          - (void)hideOverlay;
          - (BOOL)isOverlayVisible;
          - (BOOL)isInGame;
          @property (nonatomic, assign) BOOL isInitialized;
          @property (nonatomic, assign) BOOL inGame;
          @end

          #endif
          EOF

      # ──────────────────────────────────────────────────────────────────────────
      # xzx_core.m – iterative BFS (no recursion, BUG 3) + WKWebView detection (BUG 4)
      # No dispatch_sync on background thread – uses main queue polling (BUG 7)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'HEREDOC'
          #import "xzx_core.h"
          #import "Core/LuaExecutor.h"
          #import "XZXMainViewController.h"
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>

          static XZXCore *sharedCore = nil;
          static const NSInteger kDebounce = 2;

          @interface XZXCore ()
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @property (nonatomic, assign) NSInteger positiveCount;
          @property (nonatomic, assign) NSInteger negativeCount;
          @end

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ sharedCore = [[self alloc] init]; });
              return sharedCore;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _overlayWindow  = nil;
                  _isInitialized  = NO;
                  _inGame         = NO;
                  _positiveCount  = 0;
                  _negativeCount  = 0;
              }
              return self;
          }

          - (void)initialize {
              if (_isInitialized) return;
              _isInitialized = YES;
              InitLua();
              NSLog(@"[XZX] Lua initialized");
              [self startPolling];
          }

          // FIXED BUG 7: no background thread, no dispatch_sync. Pure main‑queue polling.
          - (void)startPolling {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(4.0 * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{
                  [self pollOnce];
              });
          }

          - (void)pollOnce {
              BOOL inGame = [self isInGameCheck];

              if (inGame) {
                  self.positiveCount++;
                  self.negativeCount = 0;
              } else {
                  self.negativeCount++;
                  self.positiveCount = 0;
              }

              if (!self.inGame && self.positiveCount >= kDebounce) {
                  self.inGame = YES;
                  self.positiveCount = 0;
                  NSLog(@"[XZX] In-game confirmed — showing UI");
                  [self showOverlay];
              } else if (self.inGame && self.negativeCount >= kDebounce) {
                  self.inGame = NO;
                  self.negativeCount = 0;
                  NSLog(@"[XZX] Left game — hiding UI");
                  [self hideOverlay];
              }

              // schedule next poll in 1 second
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{
                  [self pollOnce];
              });
          }

          // FIXED BUG 4: use WKWebView detection (menu has webview, game doesn't)
          // Also uses iterative BFS with a node cap to avoid stack overflow (BUG 3)
          - (BOOL)isInGameCheck {
              @try {
                  __block BOOL hasWebView = NO;

                  for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                      if (![scene isKindOfClass:[UIWindowScene class]]) continue;
                      UIWindowScene *ws = (UIWindowScene *)scene;
                      for (UIWindow *window in ws.windows) {
                          if (window == _overlayWindow) continue;
                          if ([self hasVisibleWebView:window]) {
                              hasWebView = YES;
                              break;
                          }
                      }
                      if (hasWebView) break;
                  }

                  // In-game = no visible WKWebView (menu always has one)
                  return !hasWebView;
              } @catch (NSException *e) {
                  NSLog(@"[XZX] isInGameCheck error: %@", e);
              }
              return NO;
          }

          // Iterative BFS with max node limit (2000) – no recursion, no stack overflow
          - (BOOL)hasVisibleWebView:(UIView *)root {
              if (!root) return NO;
              NSMutableArray *queue = [NSMutableArray arrayWithObject:root];
              NSUInteger maxNodes = 2000;
              NSUInteger index = 0;

              while (index < queue.count && index < maxNodes) {
                  UIView *view = queue[index];
                  index++;

                  @try {
                      // Skip invisible views
                      if (view.isHidden || view.alpha < 0.01) continue;

                      // Check if this view is a visible WKWebView
                      if ([view isKindOfClass:[WKWebView class]] &&
                          view.bounds.size.width > 50 && view.bounds.size.height > 50) {
                          NSLog(@"[XZX] Found visible WKWebView: %@", NSStringFromCGRect(view.frame));
                          return YES;
                      }

                      // Also check class name for WebView subclasses
                      NSString *className = NSStringFromClass([view class]);
                      if (([className containsString:@"WKWeb"] || [className containsString:@"WebView"]) &&
                          view.bounds.size.width > 50) {
                          NSLog(@"[XZX] Found WebView subclass: %@", className);
                          return YES;
                      }

                      // Add subviews to queue
                      for (UIView *sub in view.subviews) {
                          if (queue.count < maxNodes) [queue addObject:sub];
                      }
                  } @catch (NSException *e) {}
              }
              return NO;
          }

          - (void)showOverlay {
              if (_overlayWindow && !_overlayWindow.hidden) return;

              UIWindowScene *scene = nil;
              for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]] &&
                      s.activationState == UISceneActivationStateForegroundActive) {
                      scene = (UIWindowScene *)s; break;
                  }
              }
              if (!scene) {
                  for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                      if ([s isKindOfClass:[UIWindowScene class]]) {
                          scene = (UIWindowScene *)s; break;
                      }
                  }
              }
              if (!scene) { NSLog(@"[XZX] showOverlay: no scene"); return; }

              if (_overlayWindow && _overlayWindow.windowScene != scene) {
                  _overlayWindow = nil;
              }

              if (!_overlayWindow) {
                  XZXMainViewController *vc = [[XZXMainViewController alloc] init];
                  _overlayWindow = [[UIWindow alloc] initWithWindowScene:scene];
                  _overlayWindow.windowLevel = UIWindowLevelAlert + 1;
                  _overlayWindow.backgroundColor = [UIColor clearColor];
                  _overlayWindow.rootViewController = vc;
              }

              _overlayWindow.hidden = NO;
              [_overlayWindow makeKeyAndVisible];
              NSLog(@"[XZX] Overlay shown");
          }

          - (void)hideOverlay {
              _overlayWindow.hidden = YES;
              NSLog(@"[XZX] Overlay hidden");
          }

          - (BOOL)isOverlayVisible { return _overlayWindow && !_overlayWindow.hidden; }
          - (BOOL)isInGame         { return _inGame; }

          @end
          HEREDOC

      # ──────────────────────────────────────────────────────────────────────────
      # xzx_hooks – minimal stubs (no background thread issues)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create xzx_hooks.h
        run: |
          cat > injector/dylib/xzx_hooks.h << 'EOF'
          #ifndef XZX_HOOKS_H
          #define XZX_HOOKS_H
          #include <stdbool.h>
          void hook_roblox_functions(void);
          void unhook_roblox_functions(void);
          void install_hook(void *target, void *replacement, void **original);
          void notify_game_joined(void);
          bool isPlayerInGame(void);
          #endif
          EOF

      - name: Create xzx_hooks.m
        run: |
          cat > injector/dylib/xzx_hooks.m << 'EOF'
          #import "xzx_hooks.h"
          #import "xzx_core.h"
          #import <mach/mach.h>
          #import <mach-o/dyld.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static void *original_methods[128];
          static int   method_count = 0;
          static BOOL  hooks_active = NO;

          void notify_game_joined(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (![[XZXCore shared] isInGame]) [[XZXCore shared] showOverlay];
              });
          }

          void install_hook(void *target, void *replacement, void **original) {
              if (!target || !replacement) return;
              if (original) *original = target;
              original_methods[method_count++] = target;
              vm_address_t addr = (vm_address_t)target;
              vm_protect(mach_task_self(), addr & ~(PAGE_SIZE-1), PAGE_SIZE, 0,
                         VM_PROT_READ | VM_PROT_WRITE | VM_PROT_EXECUTE);
              uint32_t branch = 0x14000000 |
                  (((uint32_t)((uintptr_t)replacement - (uintptr_t)target) >> 2) & 0x03FFFFFF);
              memcpy(target, &branch, 4);
              __builtin___clear_cache((char *)target, (char *)target + 4);
              vm_protect(mach_task_self(), addr & ~(PAGE_SIZE-1), PAGE_SIZE, 0,
                         VM_PROT_READ | VM_PROT_EXECUTE);
          }

          void hook_roblox_functions(void) {
              if (hooks_active) return;
              hooks_active = YES;
          }

          void unhook_roblox_functions(void) { hooks_active = NO; }

          bool isPlayerInGame(void) { return [[XZXCore shared] isInGame]; }
          EOF

      - name: Create entry.m
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "xzx_core.h"

          __attribute__((constructor))
          static void entry() {
              NSLog(@"[XZX] Dylib loaded");
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[XZXCore shared] initialize];
              });
          }
          EOF

      # ──────────────────────────────────────────────────────────────────────────
      # Stub files – explicit class names (BUG 5 fixed)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Create stub files
        run: |
          # explicit mapping to avoid sed mangling (BUG 5)
          declare -A classes=(
            [xzx_injection_randomizer]="XZXInjectionRandomizer"
            [xzx_obfuscator]="XZXObfuscator"
            [xzx_antidetection]="XZXAntiDetection"
            [xzx_ban_protection]="XZXBanProtection"
            [xzx_hook_manager]="XZXHookManager"
            [xzx_physics_bypass]="XZXPhysicsBypass"
            [xzx_memory_obfuscator]="XZXMemoryObfuscator"
            [xzx_security]="XZXSecurity"
            [xzx_functions]="XZXFunctions"
            [xzx_editor]="XZXEditor"
            [xzx_scriptblox]="XZXScriptBlox"
            [xzx_uibridge]="XZXUIBridge"
          )
          for name in "${!classes[@]}"; do
            class="${classes[$name]}"
            cat > "injector/dylib/${name}.h" << HEOF
          #import <Foundation/Foundation.h>
          @interface $class : NSObject
          + (instancetype)shared;
          @end
          HEOF
            cat > "injector/dylib/${name}.m" << MEOF
          #import "${name}.h"
          @implementation $class
          + (instancetype)shared {
              static id i; static dispatch_once_t t;
              dispatch_once(&t, ^{ i = [[self alloc] init]; });
              return i;
          }
          @end
          MEOF
          done

      # ──────────────────────────────────────────────────────────────────────────
      # Compile – no ARC flags, just standard compilation
      # ──────────────────────────────────────────────────────────────────────────
      - name: Compile Objective-C files
        run: |
          mkdir -p build
          CORE_FILES="
            injector/dylib/entry.m
            injector/dylib/xzx_core.m
            injector/dylib/xzx_hooks.m
            XZX/UI/XZXMainViewController.m
          "
          STUB_FILES=$(ls injector/dylib/xzx_*.m 2>/dev/null \
            | grep -v xzx_core.m | grep -v xzx_hooks.m || true)
          ALL_FILES="$CORE_FILES $STUB_FILES"
          for file in $ALL_FILES; do
            [ -f "$file" ] || continue
            out="build/$(basename "$file" .m).o"
            xcrun -sdk iphoneos clang -c \
              -I./injector/dylib \
              -I./injector/dylib/Core \
              -I./XZX/UI \
              -I${{ env.LUA_INCLUDE_DIR }} \
              -o "$out" "$file" \
              -target arm64-apple-ios15.0 \
              && echo "✓ $file" || { echo "✗ FAILED: $file"; exit 1; }
          done

      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            [ -f "$file" ] || continue
            out="build/$(basename "$file" .mm).o"
            xcrun -sdk iphoneos clang++ -c -std=c++17 \
              -I./injector/dylib \
              -I./injector/dylib/Core \
              -I${{ env.LUA_INCLUDE_DIR }} \
              -o "$out" "$file" \
              -target arm64-apple-ios15.0 \
              && echo "✓ $file" || { echo "✗ FAILED: $file"; exit 1; }
          done

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework WebKit \
            -framework QuartzCore \
            -framework Metal \
            -L${{ env.LUA_LIB_DIR }} \
            -Wl,-force_load,${{ env.LUA_LIB_DIR }}/liblua.a \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -undefined dynamic_lookup \
            -o build/executor.dylib build/*.o \
            -lc++ -target arm64-apple-ios15.0
          echo "✅ Dylib linked"
          ls -lh build/executor.dylib

      - name: Extract and patch IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f  extracted/Payload/Roblox.app/embedded.mobileprovision

          ./tools/insert_dylib --all-yes @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched
          mv extracted/Payload/Roblox.app/Roblox_patched \
             extracted/Payload/Roblox.app/Roblox

          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"

          cd extracted && zip -qr ../XZX.ipa Payload/ && cd ..
          echo "✅ IPA ready"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
