      - name: Compile Objective-C files
        run: |
          mkdir -p build
          FILES="
            injector/dylib/entry.m
            injector/dylib/xzx_core.m
            injector/dylib/xzx_renderer_hook.m
            injector/dylib/xzx_task_hook.m
            injector/dylib/xzx_antidetection.m
            injector/dylib/xzx_obfuscator.m
            injector/dylib/xzx_hooks.m
            injector/dylib/xzx_ban_protection.m
            injector/dylib/xzx_hook_manager.m
          "
          for file in $FILES; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang -c \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/$(basename "$file" .m).o" "$file" -target arm64-apple-ios15.0
            fi
          done

      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang++ -c -std=c++11 \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/$(basename "$file" .mm).o" "$file" -target arm64-apple-ios15.0
            fi
          done

      - name: Compile Swift file
        run: |
          xcrun -sdk iphoneos swiftc -c \
            -module-name XZX \
            -import-objc-header XZX/XZX-Bridging-Header.h \
            -I . -I ./injector/dylib -I ./injector/dylib/Core -I ${{ env.LUA_INCLUDE_DIR }} \
            -target arm64-apple-ios15.0 \
            -o build/XZXSwift.o \
            XZX/MainViewController.swift

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework WebKit -framework QuartzCore \
            -L${{ env.LUA_LIB_DIR }} -Wl,-force_load,${{ env.LUA_LIB_DIR }}/liblua.a \
            -Xlinker -rpath -Xlinker /usr/lib/swift -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -undefined dynamic_lookup \
            -o build/executor.dylib build/*.o -lc++ -target arm64-apple-ios15.0
          echo "✅ Dylib compiled"

      - name: Extract and modify IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib --all-yes @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          cd extracted && zip -qr ../XZX.ipa Payload/ && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
