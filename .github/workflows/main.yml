name: Build XZX Executor (unsigned for ksign)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Build Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c \
                -O2 -DLUA_USE_IOS \
                -arch arm64 \
                -target arm64-apple-ios15.0 \
                -I src \
                -o "src/$filename.o" "$file"
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create build directories
        run: mkdir -p build XZX/UI injector/dylib/Core

      - name: Write LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          struct lua_State;
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          void RegisterFunction(const char *name, int (*func)(struct lua_State*));
          struct lua_State* GetLuaState(void);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Write LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'CPPEOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include "LuaExecutor.h"

          static lua_State *L = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *out = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [out appendString:@" "];
                  if (lua_isstring(L, i))       [out appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i))  [out appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [out appendString:lua_toboolean(L, i) ? @"true" : @"false"];
                  else if (lua_istable(L, i))   [out appendString:@"table"];
                  else if (lua_isfunction(L, i))[out appendString:@"function"];
                  else                          [out appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", out);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"XZXPrint" object:out];
              });
              return 0;
          }

          static int xzx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *out = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [out appendString:@" "];
                  if (lua_isstring(L, i)) [out appendFormat:@"%s", lua_tostring(L, i)];
              }
              NSLog(@"[XZX WARN] %@", out);
              return 0;
          }

          static int xzx_getscript(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:
                  [NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [req setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              [[[NSURLSession sharedSession] dataTaskWithRequest:req
                  completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  if (data) result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(sem);
              }] resume];
              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, 10*NSEC_PER_SEC));
              if (result) lua_pushstring(L, [result UTF8String]);
              else        lua_pushnil(L);
              return 1;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              int status = luaL_loadstring(L, code);
              if (status != 0) { lua_pushnil(L); lua_insert(L, -2); return 2; }
              return 1;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSString *enc = [[NSData dataWithBytes:d length:strlen(d)] base64EncodedStringWithOptions:0];
              lua_pushstring(L, [enc UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSData *dec = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:d] options:0];
              NSString *s = [[NSString alloc] initWithData:dec encoding:NSUTF8StringEncoding];
              lua_pushstring(L, s ? [s UTF8String] : "");
              return 1;
          }

          static int xzx_identifyexecutor(lua_State *L) { lua_pushstring(L,"XZX"); return 1; }
          static int xzx_getexecutorname (lua_State *L) { lua_pushstring(L,"XZX"); return 1; }
          static int xzx_checkcaller     (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int xzx_isrbxactive     (lua_State *L) { lua_pushboolean(L,1); return 1; }
          static int xzx_getthreadid     (lua_State *L) { lua_pushinteger(L,8); return 1; }
          static int xzx_setthreadid     (lua_State *L) { return 0; }
          static int xzx_fireclickdet    (lua_State *L) { return 0; }
          static int xzx_getgenv         (lua_State *L) { lua_pushglobaltable(L); return 1; }
          static int xzx_getreg          (lua_State *L) { lua_pushvalue(L, LUA_REGISTRYINDEX); return 1; }
          static int xzx_wait(lua_State *L) { double sec = luaL_optnumber(L,1,0); usleep(sec * 1000000); return 0; }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      luaL_openlibs(L);
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "warn", xzx_warn);
                      lua_register(L, "getscript", xzx_getscript);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "base64_encode", xzx_base64_encode);
                      lua_register(L, "base64_decode", xzx_base64_decode);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_getexecutorname);
                      lua_register(L, "checkcaller", xzx_checkcaller);
                      lua_register(L, "isrbxactive", xzx_isrbxactive);
                      lua_register(L, "getthreadidentity", xzx_getthreadid);
                      lua_register(L, "setthreadidentity", xzx_setthreadid);
                      lua_register(L, "fireclickdetector", xzx_fireclickdet);
                      lua_register(L, "getgenv", xzx_getgenv);
                      lua_register(L, "getreg", xzx_getreg);
                      lua_register(L, "wait", xzx_wait);
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      NSLog(@"[XZX] Lua 5.4 ready");
                  }
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (!script || strlen(script) == 0) return;
              int status = luaL_dostring(L, script);
              if (status != LUA_OK) {
                  const char *err = lua_tostring(L, -1);
                  NSLog(@"[XZX] Lua Error: %s", err);
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [[NSNotificationCenter defaultCenter] postNotificationName:@"XZXError" object:[NSString stringWithUTF8String:err]];
                  });
                  lua_pop(L, 1);
              }
          }

          void RegisterFunction(const char *name, int (*func)(struct lua_State*)) {
              if (L) lua_register(L, name, func);
          }

          struct lua_State* GetLuaState(void) { return L; }
          CPPEOF

      - name: Write XZXMainViewController.h
        run: |
          cat > XZX/UI/XZXMainViewController.h << 'EOF'
          #import <UIKit/UIKit.h>
          @interface XZXMainViewController : UIViewController
          @property (nonatomic, strong) UITextView *textView;
          @end
          EOF

      - name: Write XZXMainViewController.m
        run: |
          cat > XZX/UI/XZXMainViewController.m << 'EOF'
          #import "XZXMainViewController.h"
          #include "Core/LuaExecutor.h"

          @implementation XZXMainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithWhite:0.1 alpha:0.95];
              self.view.layer.cornerRadius = 12;

              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              closeBtn.frame = CGRectMake(self.view.bounds.size.width - 50, 10, 40, 40);
              [closeBtn setTitle:@"X" forState:UIControlStateNormal];
              [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [closeBtn addTarget:self action:@selector(close) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:closeBtn];

              _textView = [[UITextView alloc] initWithFrame:CGRectMake(10, 60, self.view.bounds.size.width - 20, self.view.bounds.size.height - 120)];
              _textView.backgroundColor = [UIColor blackColor];
              _textView.textColor = [UIColor greenColor];
              _textView.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
              _textView.text = @"-- XZX Executor\nprint('Hello World!')";
              [self.view addSubview:_textView];

              UIButton *execBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              execBtn.frame = CGRectMake(10, self.view.bounds.size.height - 50, 80, 40);
              [execBtn setTitle:@"Execute" forState:UIControlStateNormal];
              execBtn.backgroundColor = [UIColor greenColor];
              [execBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [execBtn addTarget:self action:@selector(execute) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:execBtn];

              UIButton *clearBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              clearBtn.frame = CGRectMake(100, self.view.bounds.size.height - 50, 80, 40);
              [clearBtn setTitle:@"Clear" forState:UIControlStateNormal];
              clearBtn.backgroundColor = [UIColor redColor];
              [clearBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [clearBtn addTarget:self action:@selector(clear) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:clearBtn];
          }

          - (void)close { self.view.window.hidden = YES; }
          - (void)execute { if (_textView.text.length > 0) ExecuteScript(_textView.text.UTF8String); }
          - (void)clear { _textView.text = @""; }

          @end
          EOF

      - name: Write xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)startEngine;
          - (void)showOverlay;
          - (void)hideOverlay;
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @property (nonatomic, assign) BOOL isInitialized;
          @end
          #endif
          EOF

      - name: Write xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'HEREDOC'
          #import "xzx_core.h"
          #import "Core/LuaExecutor.h"
          #import "XZXMainViewController.h"
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static XZXCore *sharedCore = nil;
          static const NSTimeInterval kStartupDelay = 5.0;
          static const NSTimeInterval kPollInterval = 1.0;
          static const NSInteger kDebounce = 2;

          @interface XZXCore ()
          @property (nonatomic, assign) NSInteger positiveCount;
          @property (nonatomic, assign) NSInteger negativeCount;
          @property (nonatomic, assign) BOOL inGame;
          @end

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ sharedCore = [[self alloc] init]; });
              return sharedCore;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _overlayWindow = nil;
                  _isInitialized = NO;
                  _inGame = NO;
                  _positiveCount = 0;
                  _negativeCount = 0;
              }
              return self;
          }

          - (void)startEngine {
              if (_isInitialized) return;
              _isInitialized = YES;
              InitLua();
              NSLog(@"[XZX] Lua initialized. Starting detection in %.0fs.", kStartupDelay);
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(kStartupDelay * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{ [self schedulePoll]; });
          }

          - (void)schedulePoll {
              [self pollOnce];
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(kPollInterval * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{ [self schedulePoll]; });
          }

          - (void)pollOnce {
              BOOL isInGameNow = [self isPlayerInGame];
              if (isInGameNow) { _positiveCount++; _negativeCount = 0; }
              else             { _negativeCount++; _positiveCount = 0; }

              if (!_inGame && _positiveCount >= kDebounce) {
                  _inGame = YES;
                  _positiveCount = 0;
                  _negativeCount = 0;
                  NSLog(@"[XZX] In-game detected — showing overlay");
                  [self showOverlay];
              } else if (_inGame && _negativeCount >= kDebounce) {
                  _inGame = NO;
                  _positiveCount = 0;
                  _negativeCount = 0;
                  NSLog(@"[XZX] Left game — hiding overlay");
                  [self hideOverlay];
              }
          }

          - (BOOL)isPlayerInGame {
              @try {
                  Class dataModelClass = NSClassFromString(@"RobloxDataModel");
                  if (!dataModelClass) dataModelClass = NSClassFromString(@"RBXDataModel");
                  if (!dataModelClass) return NO;

                  SEL sharedSel = NSSelectorFromString(@"sharedDataModel");
                  if (![dataModelClass respondsToSelector:sharedSel]) return NO;
                  id dataModel = ((id(*)(id, SEL))objc_msgSend)((id)dataModelClass, sharedSel);
                  if (!dataModel) return NO;

                  SEL placeIdSel = NSSelectorFromString(@"placeId");
                  if (![dataModel respondsToSelector:placeIdSel]) return NO;
                  id placeId = ((id(*)(id, SEL))objc_msgSend)(dataModel, placeIdSel);
                  return (placeId && [placeId intValue] != 0);
              } @catch (NSException *e) {
                  return NO;
              }
          }

          - (void)showOverlay {
              if (_overlayWindow && !_overlayWindow.hidden) return;
              UIWindowScene *scene = nil;
              for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]]) { scene = (UIWindowScene *)s; break; }
              }
              if (!scene) return;
              XZXMainViewController *vc = [[XZXMainViewController alloc] init];
              _overlayWindow = [[UIWindow alloc] initWithWindowScene:scene];
              _overlayWindow.windowLevel = UIWindowLevelAlert + 1;
              _overlayWindow.backgroundColor = [UIColor clearColor];
              _overlayWindow.rootViewController = vc;
              _overlayWindow.hidden = NO;
              [_overlayWindow makeKeyAndVisible];
              NSLog(@"[XZX] Overlay shown");
          }

          - (void)hideOverlay { if (_overlayWindow) _overlayWindow.hidden = YES; }

          @end
          HEREDOC

      - name: Write xzx_hooks.h
        run: |
          cat > injector/dylib/xzx_hooks.h << 'EOF'
          #ifndef XZX_HOOKS_H
          #define XZX_HOOKS_H
          void hook_roblox_functions(void);
          void unhook_roblox_functions(void);
          #endif
          EOF

      - name: Write xzx_hooks.m
        run: |
          cat > injector/dylib/xzx_hooks.m << 'EOF'
          #import "xzx_hooks.h"
          void hook_roblox_functions(void) {}
          void unhook_roblox_functions(void) {}
          EOF

      - name: Write entry.m
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "xzx_core.h"
          __attribute__((constructor))
          static void entry() {
              dispatch_async(dispatch_get_main_queue(), ^{ [[XZXCore shared] startEngine]; });
          }
          EOF

      - name: Write stub files
        run: |
          for stub in xzx_injection_randomizer xzx_obfuscator xzx_antidetection xzx_ban_protection xzx_hook_manager xzx_physics_bypass xzx_memory_obfuscator xzx_security xzx_functions xzx_editor xzx_scriptblox xzx_uibridge; do
            cat > "injector/dylib/${stub}.h" << HEOF
          #import <Foundation/Foundation.h>
          @interface XZX${stub#xzx_} : NSObject
          + (instancetype)shared;
          @end
          HEOF
            cat > "injector/dylib/${stub}.m" << MEOF
          #import "${stub}.h"
          @implementation XZX${stub#xzx_}
          + (instancetype)shared { static id i; static dispatch_once_t t; dispatch_once(&t,^{ i=[[self alloc] init];}); return i; }
          @end
          MEOF
          done

      - name: Compile Objective-C files
        run: |
          mkdir -p build
          FILES="injector/dylib/entry.m injector/dylib/xzx_core.m injector/dylib/xzx_hooks.m XZX/UI/XZXMainViewController.m"
          for stub in injector/dylib/xzx_*.m; do
            if [ "$stub" != "injector/dylib/xzx_core.m" ] && [ "$stub" != "injector/dylib/xzx_hooks.m" ]; then
              FILES="$FILES $stub"
            fi
          done
          for file in $FILES; do
            [ -f "$file" ] || continue
            xcrun -sdk iphoneos clang -c \
              -fobjc-arc \
              -I./injector/dylib -I./injector/dylib/Core -I./XZX/UI -I${{ env.LUA_INCLUDE_DIR }} \
              -o "build/$(basename "$file" .m).o" "$file" -target arm64-apple-ios15.0 || exit 1
            echo "✓ $file"
          done

      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            [ -f "$file" ] || continue
            xcrun -sdk iphoneos clang++ -c -std=c++17 -fobjc-arc \
              -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
              -o "build/$(basename "$file" .mm).o" "$file" -target arm64-apple-ios15.0 || exit 1
            echo "✓ $file"
          done

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework WebKit -framework QuartzCore -framework Metal \
            -L${{ env.LUA_LIB_DIR }} -Wl,-force_load,${{ env.LUA_LIB_DIR }}/liblua.a \
            -undefined dynamic_lookup \
            -o build/executor.dylib build/*.o -lc++ -target arm64-apple-ios15.0
          echo "✅ Dylib linked"

      - name: Extract and patch IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib --all-yes @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          plutil -convert xml1 extracted/Payload/Roblox.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X" extracted/Payload/Roblox.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X" extracted/Payload/Roblox.app/Info.plist
          plutil -convert binary1 extracted/Payload/Roblox.app/Info.plist

      - name: Create IPA
        run: cd extracted && zip -qr ../XZX.ipa Payload/ && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
