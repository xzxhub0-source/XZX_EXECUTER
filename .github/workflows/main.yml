      - name: Compile Objective-C files
        run: |
          mkdir -p build
          echo "Compiling Objective-C files..."
          
          for file in injector/dylib/*.m; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .m)
              echo "Compiling $file..."
              xcrun -sdk iphoneos clang \
                -c \
                -I./injector/dylib \
                -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/${filename}.o" \
                "$file" \
                -target arm64-apple-ios15.0
              if [ $? -ne 0 ]; then
                echo "❌ Failed to compile $file"
                exit 1
              fi
            fi
          done
          echo "✅ Objective-C compilation complete"
      
      - name: Compile C++ files
        run: |
          echo "Compiling C++ files..."
          
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mm)
              echo "Compiling $file..."
              xcrun -sdk iphoneos clang++ \
                -c \
                -std=c++11 \
                -I./injector/dylib \
                -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/${filename}.o" \
                "$file" \
                -target arm64-apple-ios15.0
              if [ $? -ne 0 ]; then
                echo "❌ Failed to compile $file"
                exit 1
              fi
            fi
          done
          echo "✅ C++ compilation complete"
      
      - name: Compile Swift files with correct include paths
        run: |
          echo "Compiling Swift files..."
          
          # Create a directory for Swift objects
          mkdir -p build/swift
          
          # Add current directory to include paths
          SWIFT_FLAGS="-I. -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }}"
          
          # Compile each Swift file individually with proper include paths
          for file in XZX/Services/*.swift XZX/UI/*.swift XZX/MainViewController.swift; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .swift)
              echo "Compiling $file..."
              xcrun -sdk iphoneos swiftc \
                -c \
                -module-name XZX \
                -import-objc-header XZX/XZX-Bridging-Header.h \
                $SWIFT_FLAGS \
                -target arm64-apple-ios15.0 \
                -o "build/swift/${filename}.o" \
                "$file"
              if [ $? -ne 0 ]; then
                echo "❌ Failed to compile $file"
                exit 1
              fi
            fi
          done
          
          # Combine all Swift object files into a library
          if [ -n "$(ls build/swift/*.o 2>/dev/null)" ]; then
            ar rcs build/XZXSwift.a build/swift/*.o
            echo "✅ Swift compilation complete"
          else
            echo "❌ No Swift object files created"
            exit 1
          fi
      
      - name: List object files
        run: |
          echo "Object files created:"
          ls -la build/
          ls -la build/swift/ 2>/dev/null || echo "No swift objects"
      
      - name: Link all object files
        run: |
          echo "Linking all object files..."
          
          # Collect all .o files from build directory
          OBJECTS=$(find build -name "*.o" -type f ! -path "build/swift/*" | tr '\n' ' ')
          
          # Add Swift archive if it exists
          if [ -f "build/XZXSwift.a" ]; then
            OBJECTS="$OBJECTS build/XZXSwift.a"
          fi
          
          if [ -z "$OBJECTS" ]; then
            echo "❌ No object files found to link"
            exit 1
          fi
          
          echo "Linking objects: $OBJECTS"
          
          xcrun -sdk iphoneos clang++ \
            -shared \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework WebKit \
            -undefined dynamic_lookup \
            -o build/executor.dylib \
            $OBJECTS \
            -lstdc++ \
            -target arm64-apple-ios15.0
          
          if [ ! -f "build/executor.dylib" ]; then
            echo "❌ Linking failed"
            ls -la build/
            exit 1
          fi
          
          echo "✅ Dylib compiled successfully"
          file build/executor.dylib
      
      # ========== IPA MODIFICATION STEPS ==========
      
      - name: Extract IPA
        run: |
          echo "📦 Extracting Roblox.ipa..."
          mkdir -p Payload
          unzip -q Roblox.ipa -d extracted/
          
          if [ ! -d "extracted/Payload/Roblox.app" ]; then
            echo "❌ Failed to extract IPA"
            exit 1
          fi
          
          echo "✅ IPA extracted successfully"
          ls -la extracted/Payload/
      
      - name: Copy dylib to app bundle
        run: |
          echo "📋 Copying executor.dylib to app bundle..."
          cp build/executor.dylib extracted/Payload/Roblox.app/
          echo "✅ Dylib copied"
      
      - name: Remove existing code signatures
        run: |
          echo "🔓 Removing code signatures..."
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          rm -f extracted/Payload/Roblox.app/CodeResources
          echo "✅ Signatures removed"
      
      - name: Inject dylib into Roblox binary
        run: |
          echo "💉 Injecting dylib into Roblox binary..."
          ./tools/insert_dylib @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched \
            --all-yes
          
          if [ ! -f "extracted/Payload/Roblox.app/Roblox_patched" ]; then
            echo "❌ Dylib injection failed"
            exit 1
          fi
          
          mv extracted/Payload/Roblox.app/Roblox_patched \
             extracted/Payload/Roblox.app/Roblox
          
          echo "✅ Dylib injection complete"
      
      - name: Change app name to XZX
        run: |
          echo "📝 Changing app name to XZX..."
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName XZX" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string XZX" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName XZX" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string XZX" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          echo "✅ App name changed to XZX"
      
      - name: Repackage IPA
        run: |
          echo "📦 Repackaging IPA..."
          cd extracted
          zip -qr ../XZX.ipa Payload/
          cd ..
          
          if [ ! -f "XZX.ipa" ]; then
            echo "❌ Failed to create IPA"
            exit 1
          fi
          
          echo "✅ IPA created: XZX.ipa"
          ls -la XZX.ipa
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
      
      - name: Debug - List all files
        run: |
          echo "📁 Final files:"
          ls -la
          echo "🔍 Searching for IPA:"
          find . -name "*.ipa" -type f
