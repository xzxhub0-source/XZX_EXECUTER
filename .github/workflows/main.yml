name: Build SERFIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download IPA
        run: |
          pipx run gdown https://drive.google.com/uc?id=16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW -O Roblox.ipa

      - name: Build insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Build Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -target arm64-apple-ios15.0 -I src -o "src/$filename.o" "$file"
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Compile Objective-C
        run: |
          mkdir -p build
          cd injector/dylib
          for f in SRFXCore.m SRFXHooks.m SRFXScriptBlox.m srfx_editor.m srfx_obfuscator.m srfx_security.m srfx_uibridge.m entry.m; do
            if [ -f "$f" ]; then
              xcrun -sdk iphoneos clang -c -fobjc-arc -I. -I./Core -I../../SERFIX/UI -I$LUA_INCLUDE -o ../../build/$(basename "$f" .m).o "$f" -target arm64-apple-ios15.0
            fi
          done
          cd ../..
          cd SERFIX/UI
          for f in SRFXMainViewController.m; do
            if [ -f "$f" ]; then
              xcrun -sdk iphoneos clang -c -fobjc-arc -I../../injector/dylib -I../../injector/dylib/Core -I. -I$LUA_INCLUDE -o ../../build/$(basename "$f" .m).o "$f" -target arm64-apple-ios15.0
            fi
          done
          cd ../..

      - name: Compile C++
        run: |
          cd injector/dylib/Core
          for f in SRFXLua.mm; do
            if [ -f "$f" ]; then
              xcrun -sdk iphoneos clang++ -c -std=c++17 -fobjc-arc -I.. -I. -I$LUA_INCLUDE -o ../../../build/$(basename "$f" .mm).o "$f" -target arm64-apple-ios15.0
            fi
          done
          cd ../../..

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared -framework UIKit -framework Foundation -framework CoreGraphics -framework WebKit -L$LUA_LIB -llua -undefined dynamic_lookup -o build/serfix.dylib build/*.o -lc++ -target arm64-apple-ios15.0

      - name: Patch IPA
        run: |
          mkdir -p extracted
          unzip -q Roblox.ipa -d extracted/
          APP=$(find extracted/Payload -name "*.app" | head -1)
          cp build/serfix.dylib "$APP/"
          rm -rf "$APP/_CodeSignature"
          ./tools/insert_dylib --all-yes @executable_path/serfix.dylib "$APP/Roblox" "$APP/Roblox_patched"
          mv "$APP/Roblox_patched" "$APP/Roblox"
          plutil -convert xml1 "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SERFIX" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SERFIX" "$APP/Info.plist"
          plutil -convert binary1 "$APP/Info.plist"

      - name: Package IPA
        run: |
          cd extracted && zip -qr ../SERFIX.ipa Payload/ && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SERFIX
          path: SERFIX.ipa
