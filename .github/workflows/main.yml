          - (void)buildEditorTab {
              self.lineNumbers = [[UITextView alloc] init];
              self.lineNumbers.backgroundColor    = SRFX_SURFACE;
              self.lineNumbers.textColor          = [SRFX_MUTED colorWithAlphaComponent:0.6];
