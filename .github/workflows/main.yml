name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="12rjbAAh6s1FVTAxXoVcqgZwC7j2JySH0"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
          if [ ! -f "Roblox.ipa" ]; then
            echo "❌ Download failed"
            exit 1
          fi
          echo "✅ Download successful!"
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ insert_dylib binary not found"
            exit 1
          fi
          mkdir -p ../tools
          cp "$BINARY_PATH" ../tools/insert_dylib
          chmod +x ../tools/insert_dylib
          cd ..
          echo "✅ insert_dylib compiled"
      
      - name: Create Xcode project
        run: |
          # Create project structure
          mkdir -p XZXProject/XZX
          mkdir -p XZXProject/injector/dylib/Core
          
          # Copy all files to Xcode project directory
          cp -r XZX/* XZXProject/XZX/ 2>/dev/null || true
          cp -r injector/dylib/* XZXProject/injector/dylib/ 2>/dev/null || true
          
          # Create Info.plist
          cat > XZXProject/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>XZX</string>
              <key>CFBundleExecutable</key>
              <string>XZX</string>
              <key>CFBundleIdentifier</key>
              <string>com.xzx.executor</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>XZX</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # Create bridging header in the right place
          cp XZX/XZX-Bridging-Header.h XZXProject/XZX/
          
          # Create a simple Xcode project using xcodegen (automatically installed)
          brew install xcodegen
          
          cat > XZXProject/project.yml << 'EOF'
          name: XZX
          options:
            bundleIdPrefix: com.xzx
            deploymentTarget:
              iOS: 15.0
          targets:
            XZX:
              type: application
              platform: iOS
              sources:
                - XZX
                - injector/dylib
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  SWIFT_OBJC_BRIDGING_HEADER: XZX/XZX-Bridging-Header.h
                  OTHER_LDFLAGS: -lstdc++
                  ENABLE_BITCODE: NO
              info:
                path: Info.plist
          EOF
          
          cd XZXProject
          xcodegen generate
          echo "✅ Xcode project created"
      
      - name: Build the app
        run: |
          cd XZXProject
          xcodebuild -project XZX.xcodeproj -scheme XZX -configuration Release -sdk iphoneos -arch arm64 build CODE_SIGNING_ALLOWED=NO
          echo "✅ App built successfully"
          ls -la build/Release-iphoneos/
      
      - name: Create IPA from .app
        run: |
          mkdir -p Payload
          cp -r XZXProject/build/Release-iphoneos/XZX.app Payload/
          zip -r XZX.ipa Payload/
          echo "✅ IPA created: XZX.ipa"
          ls -la XZX.ipa
      
      - name: Extract and modify Roblox IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          if [ ! -d "extracted/Payload/Roblox.app" ]; then
            echo "❌ Failed to extract IPA"
            exit 1
          fi
          
          # Copy the XZX dylib to Roblox app
          cp XZXProject/build/Release-iphoneos/XZX.app/XZX extracted/Payload/Roblox.app/executor.dylib
          
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          
          ./tools/insert_dylib @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched --all-yes
          
          if [ ! -f "extracted/Payload/Roblox.app/Roblox_patched" ]; then
            echo "❌ Dylib injection failed"
            exit 1
          fi
          
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          echo "✅ Roblox modification complete"
      
      - name: Change app name to XZX
        run: |
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName XZX" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string XZX" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName XZX" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string XZX" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          echo "✅ App name changed"
      
      - name: Repackage IPA
        run: |
          cd extracted
          zip -qr ../XZX-Roblox.ipa Payload/
          cd ..
          echo "✅ Final IPA created: XZX-Roblox.ipa"
          ls -la XZX-Roblox.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Roblox-Executor
          path: XZX-Roblox.ipa
          if-no-files-found: error
          retention-days: 90
