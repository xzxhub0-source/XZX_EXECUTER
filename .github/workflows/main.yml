name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download and install Lua headers
        run: |
          mkdir -p $HOME/lua-ios/include
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cp lua-5.4.6/src/lua.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/luaconf.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lauxlib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lualib.h $HOME/lua-ios/include/
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="12Aklt_7NQ6S6CEKtewn7k5ia8YJuJm9N"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          mkdir -p ../tools
          cp /Users/runner/Library/Developer/Xcode/DerivedData/insert_dylib-*/Build/Products/Release/insert_dylib ../tools/
          chmod +x ../tools/insert_dylib
          cd ..
      
      - name: Create directory structure
        run: |
          mkdir -p XZX/Services
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core
      
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
      
      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include "LuaExecutor.h"

          static lua_State *L = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) [output appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [output appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  else if (lua_istable(L, i)) [output appendString:@"table"];
                  else if (lua_isfunction(L, i)) [output appendString:@"function"];
                  else [output appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  [output appendFormat:@"%s", lua_tostring(L, i)];
              }
              NSLog(@"[XZX WARN] %@", output);
              return 0;
          }

          static int xzx_error(lua_State *L) {
              const char *msg = luaL_optstring(L, 1, "error");
              luaL_where(L, 1);
              lua_pushvalue(L, -1);
              lua_pushfstring(L, "%s: %s", lua_tostring(L, -1), msg);
              return lua_error(L);
          }

          static int xzx_getgenv(lua_State *L) {
              lua_pushglobaltable(L);
              return 1;
          }

          static int xzx_getreg(lua_State *L) {
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              return 1;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_getexecutorname(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_checkcaller(lua_State *L) {
              lua_pushboolean(L, 1);
              return 1;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  lua_remove(L, -2);
                  return 2;
              }
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  return 1;
              }
              lua_pushnil(L);
              return 1;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) { lua_pushnil(L); return 1; }
              const char *input = luaL_checkstring(L, 1);
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_delay(lua_State *L) {
              double seconds = luaL_checknumber(L, 1);
              if (!lua_isfunction(L, 2)) luaL_error(L, "expected function");
              lua_pushvalue(L, 2);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(seconds * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          static int xzx_spawn(lua_State *L) {
              if (!lua_isfunction(L, 1)) luaL_error(L, "expected function");
              lua_pushvalue(L, 1);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "warn", xzx_warn);
                      lua_register(L, "error", xzx_error);
                      lua_register(L, "getgenv", xzx_getgenv);
                      lua_register(L, "getreg", xzx_getreg);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_getexecutorname);
                      lua_register(L, "checkcaller", xzx_checkcaller);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "HttpGet", xzx_httpget);
                      lua_register(L, "game_HttpGet", xzx_httpget);
                      lua_register(L, "base64encode", xzx_base64_encode);
                      lua_register(L, "base64decode", xzx_base64_decode);
                      lua_register(L, "base64codes", xzx_base64codes);
                      lua_register(L, "delay", xzx_delay);
                      lua_register(L, "spawn", xzx_spawn);
                      
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      
                      NSLog(@"[XZX] Lua initialized");
                  }
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (L && script && strlen(script) > 0) {
                  int status = luaL_dostring(L, script);
                  if (status != 0) {
                      const char *error = lua_tostring(L, -1);
                      NSLog(@"[XZX] Error: %s", error);
                      lua_pop(L, 1);
                  }
              }
          }
          EOF
      
      - name: Create bridging header
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include "injector/dylib/Core/LuaExecutor.h"
          #endif
          EOF
      
      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)onGameJoined;
          - (void)onGameLeft;
          @property (nonatomic, assign) BOOL isInGame;
          @property (nonatomic, strong) UIWindow *editorWindow;
          @end
          #endif
          EOF
      
      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'EOF'
          #import "xzx_core.h"
          #import "Core/LuaExecutor.h"
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static XZXCore *sharedCoreInstance = nil;

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedCoreInstance = [[self alloc] init];
              });
              return sharedCoreInstance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _isInGame = NO;
                  _editorWindow = nil;
              }
              return self;
          }

          + (void)load {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), 
                             dispatch_get_main_queue(), ^{
                  [[XZXCore shared] initialize];
              });
          }

          - (void)initialize {
              @try {
                  InitLua();
                  [self startGameStateMonitoring];
              } @catch (NSException *exception) {
                  NSLog(@"[XZX] Init exception: %@", exception);
              }
          }

          - (void)startGameStateMonitoring {
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_BACKGROUND, 0), ^{
                  while (YES) {
                      [NSThread sleepForTimeInterval:1.0];
                  }
              });
          }

          - (void)onGameJoined {
              if (self.isInGame) return;
              self.isInGame = YES;
              
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (!self.editorWindow) {
                      UIViewController *vc = [[NSClassFromString(@"MainViewController") alloc] init];
                      if (vc) {
                          self.editorWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                          self.editorWindow.windowLevel = UIWindowLevelAlert + 1;
                          self.editorWindow.rootViewController = vc;
                          self.editorWindow.backgroundColor = [UIColor clearColor];
                          self.editorWindow.hidden = NO;
                          [self.editorWindow makeKeyAndVisible];
                      }
                  } else {
                      self.editorWindow.hidden = NO;
                  }
              });
          }

          - (void)onGameLeft {
              self.isInGame = NO;
              dispatch_async(dispatch_get_main_queue(), ^{
                  self.editorWindow.hidden = YES;
              });
          }

          @end
          EOF
      
      - name: Create Swift files
        run: |
          cat > XZX/Services/ScriptBloxAPI.swift << 'EOF'
          import Foundation
          import UIKit
          public struct ScriptItem: Decodable {
              public let title: String; public let script: String; public let game: String?; public let views: Int?; public let likes: Int?; public let thumbnail: String?
          }
          public class ScriptBloxAPI {
              public static let shared = ScriptBloxAPI()
              private init() {}
              public func search(query: String, completion: @escaping ([ScriptItem]) -> Void) {
                  let urlString = "https://scriptblox.com/api/script/search?q=\(query)&mode=free"
                  guard let url = URL(string: urlString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "") else { completion([]); return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { DispatchQueue.main.async { completion([]) }; return }
                      do {
                          if let json = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let result = json["result"] as? [String: Any],
                             let scriptsData = result["scripts"] as? [[String: Any]] {
                              var scripts: [ScriptItem] = []
                              for item in scriptsData {
                                  if let title = item["title"] as? String,
                                     let script = item["script"] as? String {
                                      let game = item["game"] as? String
                                      let views = item["views"] as? Int
                                      let likes = item["likes"] as? Int
                                      let thumbnail = item["image"] as? String
                                      scripts.append(ScriptItem(title: title, script: script, game: game, views: views, likes: likes, thumbnail: thumbnail))
                                  }
                              }
                              DispatchQueue.main.async { completion(scripts) }
                          } else {
                              DispatchQueue.main.async { completion([]) }
                          }
                      } catch {
                          DispatchQueue.main.async { completion([]) }
                      }
                  }.resume()
              }
              public func loadThumbnail(url: String, completion: @escaping (UIImage?) -> Void) {
                  guard let imageUrl = URL(string: url) else { completion(nil); return }
                  URLSession.shared.dataTask(with: imageUrl) { data, _, _ in
                      if let data = data, let image = UIImage(data: data) {
                          DispatchQueue.main.async { completion(image) }
                      } else {
                          DispatchQueue.main.async { completion(nil) }
                      }
                  }.resume()
              }
          }
          EOF
          
          cat > XZX/Services/TabManager.swift << 'EOF'
          import Foundation
          public struct ScriptTab: Codable {
              public var id = UUID(); public var name: String; public var content: String; public var isSaved: Bool = false
              public init(name: String, content: String) { self.name = name; self.content = content }
          }
          public class TabManager: ObservableObject {
              public static let shared = TabManager()
              @Published public var tabs: [ScriptTab] = []
              @Published public var selectedTabIndex: Int = 0
              @Published public var savedScripts: [ScriptTab] = []
              private let userDefaults = UserDefaults.standard
              private init() {
                  if let data = userDefaults.data(forKey: "xzx_tabs"), let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) { tabs = decoded }
                  if let data = userDefaults.data(forKey: "xzx_saved"), let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) { savedScripts = decoded }
                  if tabs.isEmpty { tabs.append(ScriptTab(name: "Untitled 1", content: "-- XZX Executor\nprint('Hello World!')")) }
              }
              public func addTab() { tabs.append(ScriptTab(name: "Untitled \(tabs.count + 1)", content: "")); selectedTabIndex = tabs.count - 1; saveTabs() }
              public func removeTab(at index: Int) { guard tabs.count > 1 else { return }; tabs.remove(at: index); if selectedTabIndex >= tabs.count { selectedTabIndex = tabs.count - 1 }; saveTabs() }
              public func saveTabs() { if let encoded = try? JSONEncoder().encode(tabs) { userDefaults.set(encoded, forKey: "xzx_tabs") } }
              public func saveSaved() { if let encoded = try? JSONEncoder().encode(savedScripts) { userDefaults.set(encoded, forKey: "xzx_saved") } }
          }
          EOF
          
          cat > XZX/UI/NeonWindow.swift << 'EOF'
          import UIKit
          public class NeonWindow: UIView {
              private let gradientLayer = CAGradientLayer()
              public override init(frame: CGRect) { super.init(frame: frame); setup() }
              required init?(coder: NSCoder) { super.init(coder: coder); setup() }
              private func setup() {
                  backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.95)
                  layer.cornerRadius = 18; layer.masksToBounds = true
                  gradientLayer.frame = bounds
                  gradientLayer.colors = [UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor,
                                         UIColor(red: 0.45, green: 0.25, blue: 0.8, alpha: 1).cgColor,
                                         UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor]
                  gradientLayer.locations = [0, 0.5, 1]
                  gradientLayer.startPoint = CGPoint(x: 0, y: 0); gradientLayer.endPoint = CGPoint(x: 1, y: 1)
                  layer.addSublayer(gradientLayer)
              }
              public override func layoutSubviews() { super.layoutSubviews(); gradientLayer.frame = bounds }
          }
          EOF
          
          cat > XZX/UI/SidebarView.swift << 'EOF'
          import UIKit
          public class SidebarView: UIView {
              public var buttons: [UIButton] = []; public var onTabSelected: ((Int) -> Void)?
              private let items = [("📝", "Editor"), ("🌐", "Hub"), ("📌", "Tabs"), ("💾", "Saved"), ("⚙️", "Settings")]
              public override init(frame: CGRect) { super.init(frame: frame); build() }
              required init?(coder: NSCoder) { super.init(coder: coder); build() }
              private func build() {
                  backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9); layer.cornerRadius = 12
                  for i in 0..<items.count {
                      let btn = UIButton(type: .system)
                      btn.setTitle("\(items[i].0) \(items[i].1)", for: .normal)
                      btn.setTitleColor(.white, for: .normal); btn.titleLabel?.font = .systemFont(ofSize: 14, weight: .medium)
                      btn.backgroundColor = UIColor(red: 0.16, green: 0.14, blue: 0.22, alpha: 1); btn.layer.cornerRadius = 10
                      btn.tag = i; btn.frame = CGRect(x: 10, y: 20 + (i * 55), width: 160, height: 45)
                      btn.addTarget(self, action: #selector(buttonTapped(_:)), for: .touchUpInside)
                      addSubview(btn); buttons.append(btn)
                  }
              }
              @objc private func buttonTapped(_ sender: UIButton) {
                  buttons.forEach { $0.backgroundColor = UIColor(red: 0.16, green: 0.14, blue: 0.22, alpha: 1) }
                  sender.backgroundColor = UIColor(red: 0.25, green: 0.2, blue: 0.35, alpha: 1)
                  onTabSelected?(sender.tag)
              }
          }
          EOF
          
          cat > XZX/UI/EditorView.swift << 'EOF'
          import UIKit
          public class EditorView: UIView {
              public let textView = UITextView()
              public override init(frame: CGRect) { super.init(frame: frame); build() }
              required init?(coder: NSCoder) { super.init(coder: coder); build() }
              private func build() {
                  backgroundColor = UIColor(red: 0.05, green: 0.05, blue: 0.08, alpha: 1); layer.cornerRadius = 12
                  textView.frame = bounds; textView.font = UIFont(name: "Menlo", size: 14)
                  textView.textColor = .white; textView.backgroundColor = .clear
                  textView.text = "-- XZX Executor\nprint('Hello World!')"; addSubview(textView)
              }
          }
          EOF
          
          cat > XZX/UI/HubView.swift << 'EOF'
          import UIKit
          public class HubView: UIView, UISearchBarDelegate, UICollectionViewDataSource {
              private let collectionView: UICollectionView; private let searchBar = UISearchBar(); private var scripts: [ScriptItem] = []
              public override init(frame: CGRect) {
                  let layout = UICollectionViewFlowLayout()
                  layout.itemSize = CGSize(width: 280, height: 120); layout.scrollDirection = .horizontal
                  collectionView = UICollectionView(frame: .zero, collectionViewLayout: layout)
                  super.init(frame: frame); build()
              }
              required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }
              private func build() {
                  backgroundColor = .clear
                  searchBar.frame = CGRect(x: 10, y: 10, width: bounds.width - 20, height: 50)
                  searchBar.placeholder = "Search ScriptBlox..."; searchBar.delegate = self
                  addSubview(searchBar)
                  collectionView.frame = CGRect(x: 0, y: 70, width: bounds.width, height: bounds.height - 70)
                  collectionView.backgroundColor = .clear
                  collectionView.register(ScriptCardCell.self, forCellWithReuseIdentifier: "cell")
                  collectionView.dataSource = self; addSubview(collectionView)
              }
              public func searchBarSearchButtonClicked(_ searchBar: UISearchBar) {
                  searchBar.resignFirstResponder(); guard let query = searchBar.text, !query.isEmpty else { return }
                  ScriptBloxAPI.shared.search(query: query) { [weak self] scripts in
                      self?.scripts = scripts
                      self?.collectionView.reloadData()
                  }
              }
              public func collectionView(_ collectionView: UICollectionView, numberOfItemsInSection section: Int) -> Int { return scripts.count }
              public func collectionView(_ collectionView: UICollectionView, cellForItemAt indexPath: IndexPath) -> UICollectionViewCell {
                  let cell = collectionView.dequeueReusableCell(withReuseIdentifier: "cell", for: indexPath) as! ScriptCardCell
                  let script = scripts[indexPath.item]
                  cell.titleLabel.text = script.title
                  cell.gameLabel.text = script.game ?? "Unknown Game"
                  if let thumbUrl = script.thumbnail {
                      ScriptBloxAPI.shared.loadThumbnail(url: thumbUrl) { image in
                          cell.thumbnailView.image = image
                      }
                  }
                  return cell
              }
          }
          public class ScriptCardCell: UICollectionViewCell {
              public let titleLabel = UILabel(); public let gameLabel = UILabel(); public let thumbnailView = UIImageView()
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9); layer.cornerRadius = 12
                  thumbnailView.frame = CGRect(x: 8, y: 8, width: 50, height: 50)
                  thumbnailView.backgroundColor = UIColor(red: 0.2, green: 0.2, blue: 0.25, alpha: 1)
                  thumbnailView.layer.cornerRadius = 8; contentView.addSubview(thumbnailView)
                  titleLabel.frame = CGRect(x: 66, y: 8, width: frame.width - 74, height: 20)
                  titleLabel.font = .systemFont(ofSize: 14, weight: .bold); titleLabel.textColor = .white
                  contentView.addSubview(titleLabel)
                  gameLabel.frame = CGRect(x: 66, y: 28, width: frame.width - 74, height: 16)
                  gameLabel.font = .systemFont(ofSize: 12); gameLabel.textColor = .lightGray
                  contentView.addSubview(gameLabel)
              }
              required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }
          }
          EOF
          
          cat > XZX/MainViewController.swift << 'EOF'
          import UIKit
          public class MainViewController: UIViewController {
              private let neonWindow = NeonWindow(); private let sidebar = SidebarView(); private let editor = EditorView()
              private let executeButton = UIButton(); private let clearButton = UIButton()
              public override func viewDidLoad() {
                  super.viewDidLoad(); view.backgroundColor = .clear; InitLua()
                  neonWindow.frame = CGRect(x: 40, y: 80, width: 400, height: 500); view.addSubview(neonWindow)
                  sidebar.frame = CGRect(x: 0, y: 0, width: 180, height: 500)
                  sidebar.onTabSelected = { [weak self] index in self?.switchToTab(index) }
                  neonWindow.addSubview(sidebar)
                  editor.frame = CGRect(x: 190, y: 20, width: 190, height: 420); editor.tag = 0
                  neonWindow.addSubview(editor)
                  executeButton.frame = CGRect(x: 190, y: 450, width: 90, height: 40)
                  executeButton.setTitle("Execute", for: .normal)
                  executeButton.backgroundColor = UIColor(red: 0.2, green: 0.8, blue: 0.3, alpha: 1)
                  executeButton.layer.cornerRadius = 8
                  executeButton.addTarget(self, action: #selector(executeScript), for: .touchUpInside)
                  neonWindow.addSubview(executeButton)
                  clearButton.frame = CGRect(x: 290, y: 450, width: 90, height: 40)
                  clearButton.setTitle("Clear", for: .normal)
                  clearButton.backgroundColor = UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  clearButton.layer.cornerRadius = 8
                  clearButton.addTarget(self, action: #selector(clearScript), for: .touchUpInside)
                  neonWindow.addSubview(clearButton)
              }
              private func switchToTab(_ index: Int) { }
              @objc private func executeScript() { ExecuteScript(editor.textView.text ?? "") }
              @objc private func clearScript() { editor.textView.text = "" }
          }
          EOF
      
      - name: Clean build directory
        run: |
          rm -rf build
          mkdir -p build
      
      - name: Compile Objective-C files
        run: |
          for file in injector/dylib/*.m; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang -c -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} -o "build/$(basename "$file" .m).o" "$file" -target arm64-apple-ios15.0
            fi
          done
      
      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang++ -c -std=c++11 -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} -o "build/$(basename "$file" .mm).o" "$file" -target arm64-apple-ios15.0
            fi
          done
      
      - name: Compile Swift files
        run: |
          SWIFT_FILES=$(find XZX -name "*.swift" -type f | tr '\n' ' ')
          xcrun -sdk iphoneos swiftc -c -module-name XZX -import-objc-header XZX/XZX-Bridging-Header.h -I . -I ./injector/dylib -I ./injector/dylib/Core -I ${{ env.LUA_INCLUDE_DIR }} -target arm64-apple-ios15.0 -o build/XZXSwift.o $SWIFT_FILES
      
      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared -framework UIKit -framework Foundation -framework CoreGraphics -o build/executor.dylib build/*.o -lstdc++ -target arm64-apple-ios15.0
      
      - name: Extract IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib @executable_path/executor.dylib extracted/Payload/Roblox.app/Roblox extracted/Payload/Roblox.app/Roblox_patched --all-yes
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName XZX" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string XZX" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          cd extracted; zip -qr ../XZX.ipa Payload/; cd ..
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          retention-days: 90
