name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Download and compile Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -o "src/$filename.o" "src/$filename.c" -target arm64-apple-ios15.0 -I src
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create directory structure
        run: |
          mkdir -p XZX
          mkdir -p injector/dylib/Core

      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h

          struct lua_State;

          #ifdef __cplusplus
          extern "C" {
          #endif

          void InitLua(void);
          void ExecuteScript(const char *script);
          void RegisterFunction(const char *name, int (*func)(struct lua_State*));

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          extern "C" {
            #include <lua.h>
            #include <lauxlib.h>
            #include <lualib.h>
          }
          #include "LuaExecutor.h"

          static lua_State *L = nil;
          static NSMutableDictionary *registeredFunctions = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) [output appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [output appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  else if (lua_istable(L, i)) [output appendString:@"table"];
                  else if (lua_isfunction(L, i)) [output appendString:@"function"];
                  else [output appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  return 2;
              }
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              __block int statusCode = 0;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15" forHTTPHeaderField:@"User-Agent"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                      if ([response isKindOfClass:[NSHTTPURLResponse class]]) {
                          statusCode = (int)((NSHTTPURLResponse *)response).statusCode;
                      }
                  }
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 30 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  lua_pushinteger(L, statusCode);
                  return 2;
              }
              lua_pushnil(L);
              lua_pushstring(L, "Request failed");
              return 2;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) { lua_pushnil(L); return 1; }
              const char *input = luaL_checkstring(L, 1);
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIWindowScene *windowScene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  UIViewController *rootVC = windowScene.keyWindow.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              return 0;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_wait(lua_State *L) {
              double seconds = luaL_optnumber(L, 1, 0);
              usleep(seconds * 1000000);
              return 0;
          }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      luaL_openlibs(L);
                      registeredFunctions = [NSMutableDictionary dictionary];
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "HttpGet", xzx_httpget);
                      lua_register(L, "game_HttpGet", xzx_httpget);
                      lua_register(L, "base64encode", xzx_base64_encode);
                      lua_register(L, "base64decode", xzx_base64_decode);
                      lua_register(L, "base64codes", xzx_base64codes);
                      lua_register(L, "messagebox", xzx_messagebox);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_identifyexecutor);
                      lua_register(L, "wait", xzx_wait);
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      NSLog(@"[XZX] Lua initialized");
                  }
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (L && script && strlen(script) > 0) {
                  int status = luaL_loadstring(L, script);
                  if (status == 0) {
                      lua_pcall(L, 0, 0, 0);
                  } else {
                      const char *error = lua_tostring(L, -1);
                      NSLog(@"[XZX] Lua Error: %s", error);
                      lua_pop(L, 1);
                  }
              }
          }

          void RegisterFunction(const char *name, int (*func)(lua_State*)) {
              if (!L) InitLua();
              lua_register(L, name, func);
              [registeredFunctions setObject:[NSString stringWithUTF8String:name] forKey:[NSString stringWithUTF8String:name]];
          }
          EOF

      - name: Create ScriptEngine.mm
        run: |
          cat > injector/dylib/Core/ScriptEngine.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          extern "C" {
            #include <lua.h>
            #include <lauxlib.h>
            #include <lualib.h>
          }
          #include "LuaExecutor.h"

          static NSMutableDictionary *scriptCache = nil;
          static NSMutableArray *scriptHistory = nil;
          static NSString *SCRIPT_CACHE_KEY = @"XZXScriptCache";
          static NSString *SCRIPT_HISTORY_KEY = @"XZXScriptHistory";

          @interface ScriptEngine : NSObject
          + (instancetype)shared;
          - (void)cacheScript:(NSString *)script withId:(NSString *)scriptId;
          - (NSString *)getCachedScript:(NSString *)scriptId;
          - (NSArray *)getScriptHistory;
          - (void)clearCache;
          @end

          @implementation ScriptEngine

          + (instancetype)shared {
              static ScriptEngine *instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  instance = [[self alloc] init];
              });
              return instance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  scriptCache = [NSMutableDictionary dictionary];
                  scriptHistory = [NSMutableArray array];
                  NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                  NSDictionary *savedCache = [defaults dictionaryForKey:SCRIPT_CACHE_KEY];
                  if (savedCache) {
                      [scriptCache addEntriesFromDictionary:savedCache];
                  }
                  NSArray *savedHistory = [defaults arrayForKey:SCRIPT_HISTORY_KEY];
                  if (savedHistory) {
                      [scriptHistory addObjectsFromArray:savedHistory];
                  }
              }
              return self;
          }

          - (void)cacheScript:(NSString *)script withId:(NSString *)scriptId {
              if (script && scriptId) {
                  scriptCache[scriptId] = script;
                  [scriptHistory addObject:@{@"id": scriptId, @"timestamp": [NSDate date]}];
                  if (scriptHistory.count > 50) {
                      [scriptHistory removeObjectsInRange:NSMakeRange(0, scriptHistory.count - 50)];
                  }
                  NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                  [defaults setObject:scriptCache forKey:SCRIPT_CACHE_KEY];
                  [defaults setObject:scriptHistory forKey:SCRIPT_HISTORY_KEY];
                  [defaults synchronize];
              }
          }

          - (NSString *)getCachedScript:(NSString *)scriptId {
              return scriptCache[scriptId];
          }

          - (NSArray *)getScriptHistory {
              return [scriptHistory copy];
          }

          - (void)clearCache {
              [scriptCache removeAllObjects];
              [scriptHistory removeAllObjects];
              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              [defaults removeObjectForKey:SCRIPT_CACHE_KEY];
              [defaults removeObjectForKey:SCRIPT_HISTORY_KEY];
              [defaults synchronize];
          }

          @end
          EOF

      - name: Create bridging header
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include "injector/dylib/Core/LuaExecutor.h"
          #endif
          EOF

      - name: Create MainViewController.swift
        run: |
          cat > XZX/MainViewController.swift << 'EOF'
          import UIKit

          @objc(XZXMainViewController)
          public class MainViewController: UIViewController, UITextViewDelegate, UISearchBarDelegate {
              private let textView = UITextView()
              private let executeButton = UIButton()
              private let clearButton = UIButton()
              private let saveButton = UIButton()
              private let closeButton = UIButton()
              private let scriptHubButton = UIButton()
              private let searchBar = UISearchBar()
              private var scriptHubView: UIView?

              public override func viewDidLoad() {
                  super.viewDidLoad()
                  setupUI()
                  setupNotifications()
                  loadSavedScripts()
                  InitLua()
              }

              private func setupUI() {
                  view.backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.95)
                  view.layer.cornerRadius = 18
                  view.layer.masksToBounds = true

                  let titleLabel = UILabel()
                  titleLabel.frame = CGRect(x: 20, y: 20, width: 200, height: 30)
                  titleLabel.text = "XZX"
                  titleLabel.textColor = .white
                  titleLabel.font = .systemFont(ofSize: 20, weight: .bold)
                  view.addSubview(titleLabel)

                  scriptHubButton.frame = CGRect(x: view.bounds.width - 100, y: 20, width: 80, height: 30)
                  scriptHubButton.setTitle("Script Hub", for: .normal)
                  scriptHubButton.backgroundColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.8)
                  scriptHubButton.layer.cornerRadius = 8
                  scriptHubButton.titleLabel?.font = .systemFont(ofSize: 12, weight: .bold)
                  scriptHubButton.addTarget(self, action: #selector(toggleScriptHub), for: .touchUpInside)
                  view.addSubview(scriptHubButton)

                  searchBar.frame = CGRect(x: 20, y: 60, width: view.bounds.width - 40, height: 40)
                  searchBar.placeholder = "Search scripts..."
                  searchBar.searchBarStyle = .minimal
                  searchBar.barStyle = .black
                  searchBar.tintColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1)
                  searchBar.delegate = self
                  searchBar.isHidden = true
                  view.addSubview(searchBar)

                  textView.frame = CGRect(x: 20, y: 60, width: view.bounds.width - 40, height: view.bounds.height - 160)
                  textView.backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9)
                  textView.textColor = .white
                  textView.font = UIFont(name: "Menlo", size: 14)
                  textView.layer.cornerRadius = 8
                  textView.text = "-- XZX Executor\nprint('Hello World!')"
                  textView.autocorrectionType = .no
                  textView.autocapitalizationType = .none
                  textView.delegate = self
                  view.addSubview(textView)

                  executeButton.frame = CGRect(x: 20, y: view.bounds.height - 80, width: 80, height: 50)
                  executeButton.setTitle("Execute", for: .normal)
                  executeButton.backgroundColor = UIColor(red: 0.2, green: 0.8, blue: 0.3, alpha: 1)
                  executeButton.layer.cornerRadius = 8
                  executeButton.addTarget(self, action: #selector(executeScript), for: .touchUpInside)
                  view.addSubview(executeButton)

                  clearButton.frame = CGRect(x: 110, y: view.bounds.height - 80, width: 80, height: 50)
                  clearButton.setTitle("Clear", for: .normal)
                  clearButton.backgroundColor = UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  clearButton.layer.cornerRadius = 8
                  clearButton.addTarget(self, action: #selector(clearScript), for: .touchUpInside)
                  view.addSubview(clearButton)

                  saveButton.frame = CGRect(x: 200, y: view.bounds.height - 80, width: 80, height: 50)
                  saveButton.setTitle("Save", for: .normal)
                  saveButton.backgroundColor = UIColor(red: 0.3, green: 0.3, blue: 0.8, alpha: 1)
                  saveButton.layer.cornerRadius = 8
                  saveButton.addTarget(self, action: #selector(saveScript), for: .touchUpInside)
                  view.addSubview(saveButton)

                  closeButton.frame = CGRect(x: view.bounds.width - 60, y: 20, width: 40, height: 40)
                  closeButton.setTitle("✕", for: .normal)
                  closeButton.setTitleColor(.white, for: .normal)
                  closeButton.titleLabel?.font = .systemFont(ofSize: 24)
                  closeButton.addTarget(self, action: #selector(close), for: .touchUpInside)
                  view.addSubview(closeButton)
              }

              private func setupNotifications() {
                  NotificationCenter.default.addObserver(self, selector: #selector(handleScriptLoad), name: NSNotification.Name("LoadScript"), object: nil)
              }

              private func loadSavedScripts() {
                  let saved = UserDefaults.standard.string(forKey: "XZXSavedScript")
                  if let savedScript = saved {
                      textView.text = savedScript
                  }
              }

              @objc private func toggleScriptHub() {
                  if scriptHubView == nil {
                      showScriptHub()
                      searchBar.isHidden = false
                      textView.frame = CGRect(x: 20, y: 110, width: view.bounds.width - 40, height: view.bounds.height - 210)
                  } else {
                      hideScriptHub()
                      searchBar.isHidden = true
                      textView.frame = CGRect(x: 20, y: 60, width: view.bounds.width - 40, height: view.bounds.height - 160)
                  }
              }

              private func showScriptHub() {
                  scriptHubView = UIView(frame: CGRect(x: 20, y: 110, width: view.bounds.width - 40, height: view.bounds.height - 210))
                  scriptHubView?.backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9)
                  scriptHubView?.layer.cornerRadius = 8
                  view.addSubview(scriptHubView!)

                  let activityIndicator = UIActivityIndicatorView(style: .large)
                  activityIndicator.center = CGPoint(x: (scriptHubView?.bounds.width ?? 200) / 2, y: (scriptHubView?.bounds.height ?? 400) / 2)
                  activityIndicator.startAnimating()
                  scriptHubView?.addSubview(activityIndicator)

                  loadScripts(query: "blox")
              }

              private func hideScriptHub() {
                  scriptHubView?.removeFromSuperview()
                  scriptHubView = nil
              }

              private func loadScripts(query: String) {
                  let urlString = "https://scriptblox.com/api/script/search?q=\(query)&mode=free"
                  guard let url = URL(string: urlString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "") else { return }

                  URLSession.shared.dataTask(with: url) { [weak self] data, _, _ in
                      guard let data = data else { return }
                      do {
                          let json = try JSONSerialization.jsonObject(with: data) as? [String: Any]
                          let result = json?["result"] as? [String: Any]
                          let scripts = result?["scripts"] as? [[String: Any]] ?? []
                          DispatchQueue.main.async {
                              self?.displayScripts(scripts)
                          }
                      } catch {
                          print("Error loading scripts: \(error)")
                      }
                  }.resume()
              }

              private func displayScripts(_ scripts: [[String: Any]]) {
                  scriptHubView?.subviews.forEach { $0.removeFromSuperview() }

                  let scrollView = UIScrollView(frame: scriptHubView?.bounds ?? CGRect.zero)
                  scriptHubView?.addSubview(scrollView)

                  var yOffset: CGFloat = 10
                  for (index, script) in scripts.enumerated() {
                      let title = script["title"] as? String ?? "Untitled"
                      let scriptContent = script["script"] as? String ?? ""
                      let game = script["game"] as? String ?? "Unknown Game"

                      let card = UIView(frame: CGRect(x: 10, y: yOffset, width: scrollView.bounds.width - 20, height: 80))
                      card.backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.9)
                      card.layer.cornerRadius = 8
                      card.tag = index

                      let titleLabel = UILabel(frame: CGRect(x: 10, y: 5, width: card.bounds.width - 80, height: 25))
                      titleLabel.text = title
                      titleLabel.textColor = .white
                      titleLabel.font = .systemFont(ofSize: 14, weight: .bold)
                      card.addSubview(titleLabel)

                      let gameLabel = UILabel(frame: CGRect(x: 10, y: 30, width: card.bounds.width - 80, height: 20))
                      gameLabel.text = game
                      gameLabel.textColor = .lightGray
                      gameLabel.font = .systemFont(ofSize: 12)
                      card.addSubview(gameLabel)

                      let loadBtn = UIButton(frame: CGRect(x: card.bounds.width - 70, y: 25, width: 60, height: 30))
                      loadBtn.setTitle("Load", for: .normal)
                      loadBtn.backgroundColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.8)
                      loadBtn.layer.cornerRadius = 6
                      loadBtn.titleLabel?.font = .systemFont(ofSize: 12, weight: .bold)
                      loadBtn.tag = index
                      loadBtn.addTarget(self, action: #selector(loadScriptFromHub(_:)), for: .touchUpInside)
                      objc_setAssociatedObject(loadBtn, "scriptContent", scriptContent, .OBJC_ASSOCIATION_RETAIN_NONATOMIC)
                      card.addSubview(loadBtn)

                      scrollView.addSubview(card)
                      yOffset += 90
                  }

                  scrollView.contentSize = CGSize(width: scrollView.bounds.width, height: yOffset + 20)
              }

              @objc private func loadScriptFromHub(_ sender: UIButton) {
                  let scriptContent = objc_getAssociatedObject(sender, "scriptContent") as? String ?? ""
                  textView.text = scriptContent
                  toggleScriptHub()
              }

              @objc func executeScript() {
                  let script = textView.text ?? ""
                  guard !script.isEmpty else { return }
                  script.withCString { ptr in
                      ExecuteScript(ptr)
                  }
              }

              @objc func clearScript() {
                  textView.text = ""
              }

              @objc func saveScript() {
                  UserDefaults.standard.set(textView.text, forKey: "XZXSavedScript")
                  UserDefaults.standard.synchronize()

                  let alert = UIAlertController(title: "Saved", message: "Script saved successfully", preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "OK", style: .default))
                  present(alert, animated: true)
              }

              @objc func close() {
                  view.isHidden = true
              }

              @objc private func handleScriptLoad(_ notification: Notification) {
                  if let script = notification.object as? String {
                      textView.text = script
                  }
              }

              // MARK: - UISearchBarDelegate
              @objc public func searchBarSearchButtonClicked(_ searchBar: UISearchBar) {
                  searchBar.resignFirstResponder()
                  guard let query = searchBar.text, !query.isEmpty else { return }
                  loadScripts(query: query)
              }

              // MARK: - UITextViewDelegate
              @objc public func textViewDidChange(_ textView: UITextView) {
                  UserDefaults.standard.set(textView.text, forKey: "XZXSavedScript")
              }
          }
          EOF

      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)showOverlay;
          - (void)hideOverlay;
          - (BOOL)isOverlayVisible;
          - (void)startGameMonitoring;
          - (BOOL)isInGame;
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @property (nonatomic, assign) BOOL isInitialized;
          @property (nonatomic, assign) BOOL inGame;
          @end

          #endif
          EOF

      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'EOF'
          #import "xzx_core.h"
          #import "Core/LuaExecutor.h"
          #import "xzx_renderer_hook.h"
          #import "xzx_task_hook.h"
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static XZXCore *sharedCore = nil;
          static dispatch_queue_t monitorQueue = nil;
          static BOOL gameDetectionActive = NO;
          static BOOL uiCreated = NO;
          static BOOL gameLoadedSignalReceived = NO;
          static NSString *signalFilePath = nil;

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  sharedCore = [[self alloc] init];
              });
              return sharedCore;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _overlayWindow = nil;
                  _isInitialized = NO;
                  _inGame = NO;
                  monitorQueue = dispatch_queue_create("com.xzx.monitor", DISPATCH_QUEUE_SERIAL);
                  
                  @try {
                      NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                      NSString *docPath = [paths firstObject];
                      if (docPath) {
                          signalFilePath = [docPath stringByAppendingPathComponent:@"xzx_signal.txt"];
                      } else {
                          signalFilePath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"xzx_signal.txt"];
                      }
                  } @catch (NSException *e) {
                      signalFilePath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"xzx_signal.txt"];
                  }
              }
              return self;
          }

          - (void)initialize {
              if (_isInitialized) return;
              _isInitialized = YES;

              dispatch_async(dispatch_get_main_queue(), ^{
                  @try {
                      InitLua();
                      NSLog(@"[XZX] Lua initialized");
                  } @catch (NSException *e) {
                      NSLog(@"[XZX] Lua init failed: %@", e);
                  }
                  
                  @try {
                      install_renderer_hook();
                      install_task_hook();
                      NSLog(@"[XZX] Renderer and task hooks installed");
                  } @catch (NSException *e) {
                      NSLog(@"[XZX] Hook installation failed: %@", e);
                  }
                  
                  @try {
                      [[NSFileManager defaultManager] removeItemAtPath:signalFilePath error:nil];
                  } @catch (NSException *e) {}
                  
                  [self injectGameLoadedSignal];
                  [self startSignalMonitoring];
                  [self startGameMonitoring];
                  NSLog(@"[XZX] Core initialized, waiting for game join signal...");
              });
          }

          - (void)injectGameLoadedSignal {
              @try {
                  NSString *escapedPath = [signalFilePath stringByReplacingOccurrencesOfString:@"\\" withString:@"\\\\"];
                  escapedPath = [escapedPath stringByReplacingOccurrencesOfString:@"'" withString:@"\\'"];
                  
                  NSString *bootstrapScript = [NSString stringWithFormat:
                      @"local Players = game:GetService('Players')\n"
                      @"local RunService = game:GetService('RunService')\n"
                      @"local signalPath = '%@'\n"
                      @"local function writeSignal()\n"
                      @"    local file = io.open(signalPath, 'w')\n"
                      @"    if file then\n"
                      @"        file:write('LOADED')\n"
                      @"        file:close()\n"
                      @"    end\n"
                      @"end\n"
                      @"local function checkGameLoaded()\n"
                      @"    local player = Players.LocalPlayer\n"
                      @"    if player and player.Character and player.Character:FindFirstChild('Humanoid') then\n"
                      @"        writeSignal()\n"
                      @"        return true\n"
                      @"    end\n"
                      @"    return false\n"
                      @"end\n"
                      @"local function waitForGame()\n"
                      @"    while not checkGameLoaded() do\n"
                      @"        RunService.Heartbeat:Wait()\n"
                      @"    end\n"
                      @"end\n"
                      @"coroutine.wrap(waitForGame)()\n", escapedPath];
                  
                  Class luaStateClass = NSClassFromString(@"RobloxLuaState");
                  if (luaStateClass) {
                      SEL getCurrentSel = NSSelectorFromString(@"currentState");
                      if ([luaStateClass respondsToSelector:getCurrentSel]) {
                          id luaState = ((id(*)(id, SEL))objc_msgSend)((id)luaStateClass, getCurrentSel);
                          if (luaState) {
                              SEL loadStringSel = NSSelectorFromString(@"loadString:");
                              SEL pcallSel = NSSelectorFromString(@"pcall:args:results:msgh:");
                              
                              if ([luaState respondsToSelector:loadStringSel] && [luaState respondsToSelector:pcallSel]) {
                                  int loadResult = ((int(*)(id, SEL, id))objc_msgSend)(luaState, loadStringSel, bootstrapScript);
                                  if (loadResult == 0) {
                                      ((void(*)(id, SEL, int, id, int, int))objc_msgSend)(luaState, pcallSel, 0, nil, 0, 0);
                                      NSLog(@"[XZX] Game loaded signal script injected");
                                  }
                              }
                          }
                      }
                  }
              } @catch (NSException *e) {
                  NSLog(@"[XZX] Failed to inject script: %@", e);
              }
          }

          - (void)startSignalMonitoring {
              dispatch_async(monitorQueue, ^{
                  while (YES) {
                      @autoreleasepool {
                          @try {
                              if (!gameLoadedSignalReceived && [[NSFileManager defaultManager] fileExistsAtPath:signalFilePath]) {
                                  NSString *content = [NSString stringWithContentsOfFile:signalFilePath encoding:NSUTF8StringEncoding error:nil];
                                  if (content && [content containsString:@"LOADED"]) {
                                      gameLoadedSignalReceived = YES;
                                      NSLog(@"[XZX] Game loaded signal detected via file");
                                      dispatch_async(dispatch_get_main_queue(), ^{
                                          [self onGameLoaded];
                                      });
                                  }
                              }
                          } @catch (NSException *e) {
                              // Ignore file read errors
                          }
                      }
                      [NSThread sleepForTimeInterval:0.5];
                  }
              });
          }

          - (void)onGameLoaded {
              @try {
                  if (!uiCreated) {
                      [self createOverlay];
                  } else {
                      [self showOverlay];
                  }
                  NSLog(@"[XZX] Game loaded - UI shown");
              } @catch (NSException *e) {
                  NSLog(@"[XZX] Failed to show UI: %@", e);
              }
          }

          - (void)startGameMonitoring {
              if (gameDetectionActive) return;
              gameDetectionActive = YES;

              dispatch_async(monitorQueue, ^{
                  [NSThread sleepForTimeInterval:3.0];

                  while (YES) {
                      @autoreleasepool {
                          BOOL currentlyInGame = NO;
                          @try {
                              currentlyInGame = [self isGameEngineActive];
                          } @catch (NSException *e) {
                              // Ignore detection errors
                          }

                          if (currentlyInGame && !self.inGame) {
                              self.inGame = YES;
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  [self injectGameLoadedSignal];
                              });
                          } else if (!currentlyInGame && self.inGame) {
                              self.inGame = NO;
                              gameLoadedSignalReceived = NO;
                              @try {
                                  [[NSFileManager defaultManager] removeItemAtPath:signalFilePath error:nil];
                              } @catch (NSException *e) {}
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  [self hideOverlay];
                                  NSLog(@"[XZX] Left game - UI hidden");
                              });
                          }
                      }
                      [NSThread sleepForTimeInterval:1.0];
                  }
              });
          }

          - (BOOL)isGameEngineActive {
              @try {
                  Class coreGuiClass = NSClassFromString(@"CoreGui");
                  if (coreGuiClass) {
                      SEL getCoreGuiSel = NSSelectorFromString(@"coreGui");
                      if ([coreGuiClass respondsToSelector:getCoreGuiSel]) {
                          id coreGui = ((id(*)(id, SEL))objc_msgSend)((id)coreGuiClass, getCoreGuiSel);
                          if (coreGui) {
                              SEL findFirstChildSel = NSSelectorFromString(@"FindFirstChild:");
                              if ([coreGui respondsToSelector:findFirstChildSel]) {
                                  id playerList = ((id(*)(id, SEL, id))objc_msgSend)(coreGui, findFirstChildSel, @"PlayerList");
                                  if (playerList) {
                                      return YES;
                                  }
                              }
                          }
                      }
                  }

                  Class dataModelClass = NSClassFromString(@"RobloxDataModel");
                  if (dataModelClass) {
                      SEL sharedSel = NSSelectorFromString(@"sharedDataModel");
                      if ([dataModelClass respondsToSelector:sharedSel]) {
                          id dataModel = ((id(*)(id, SEL))objc_msgSend)((id)dataModelClass, sharedSel);
                          if (dataModel) {
                              SEL placeIdSel = NSSelectorFromString(@"placeId");
                              if ([dataModel respondsToSelector:placeIdSel]) {
                                  id placeId = ((id(*)(id, SEL))objc_msgSend)(dataModel, placeIdSel);
                                  if (placeId && [placeId intValue] != 0) {
                                      return YES;
                                  }
                              }
                          }
                      }
                  }
              } @catch (NSException *e) {
                  // Ignore
              }
              return NO;
          }

          - (void)createOverlay {
              if (uiCreated) return;
              uiCreated = YES;

              dispatch_async(dispatch_get_main_queue(), ^{
                  @try {
                      if ([UIApplication sharedApplication] == nil) return;

                      UIWindowScene *scene = (UIWindowScene*)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                      if (!scene) {
                          uiCreated = NO;
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 0.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                              [self createOverlay];
                          });
                          return;
                      }

                      UIViewController *vc = nil;
                      NSArray *classNames = @[@"XZXMainViewController", @"XZX.MainViewController", @"MainViewController"];
                      for (NSString *className in classNames) {
                          vc = [[NSClassFromString(className) alloc] init];
                          if (vc) break;
                      }
                      if (!vc) {
                          NSLog(@"[XZX] Could not create MainViewController");
                          return;
                      }

                      self.overlayWindow = [[UIWindow alloc] initWithWindowScene:scene];
                      self.overlayWindow.windowLevel = UIWindowLevelAlert + 1;
                      self.overlayWindow.rootViewController = vc;
                      self.overlayWindow.backgroundColor = [UIColor clearColor];
                      self.overlayWindow.hidden = NO;
                      [self.overlayWindow makeKeyAndVisible];
                      NSLog(@"[XZX] Overlay created");
                  } @catch (NSException *e) {
                      NSLog(@"[XZX] Failed to create overlay: %@", e);
                      uiCreated = NO;
                  }
              });
          }

          - (void)showOverlay {
              if (!uiCreated) {
                  [self createOverlay];
              } else if (self.overlayWindow && self.overlayWindow.hidden) {
                  @try {
                      self.overlayWindow.hidden = NO;
                      [self.overlayWindow makeKeyAndVisible];
                  } @catch (NSException *e) {
                      NSLog(@"[XZX] Failed to show overlay: %@", e);
                  }
              }
          }

          - (void)hideOverlay {
              dispatch_async(dispatch_get_main_queue(), ^{
                  @try {
                      if (self.overlayWindow && !self.overlayWindow.hidden) {
                          self.overlayWindow.hidden = YES;
                      }
                  } @catch (NSException *e) {
                      // Ignore
                  }
              });
          }

          - (BOOL)isOverlayVisible {
              return self.overlayWindow && !self.overlayWindow.hidden;
          }

          - (BOOL)isInGame {
              return _inGame;
          }

          @end
          EOF

      - name: Create xzx_renderer_hook.h
        run: |
          cat > injector/dylib/xzx_renderer_hook.h << 'EOF'
          #ifndef XZX_RENDERER_HOOK_H
          #define XZX_RENDERER_HOOK_H

          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          void install_renderer_hook(void);
          void unhook_renderer(void);
          void xzx_on_render_frame(void);

          @interface XZXRendererHook : NSObject
          + (instancetype)shared;
          - (void)setupRenderCallback;
          @end

          #endif
          EOF

      - name: Create xzx_renderer_hook.m
        run: |
          cat > injector/dylib/xzx_renderer_hook.m << 'EOF'
          #import "xzx_renderer_hook.h"
          #import "xzx_core.h"
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <QuartzCore/QuartzCore.h>

          static BOOL rendererHooked = NO;

          @interface XZXRendererHook ()
          @property (nonatomic, strong) CADisplayLink *displayLink;
          @end

          @implementation XZXRendererHook

          + (instancetype)shared {
              static XZXRendererHook *instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  instance = [[self alloc] init];
              });
              return instance;
          }

          - (void)setupRenderCallback {
              if (rendererHooked) return;
              rendererHooked = YES;
              
              @try {
                  self.displayLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(renderCallback)];
                  [self.displayLink addToRunLoop:[NSRunLoop mainRunLoop] forMode:NSRunLoopCommonModes];
              } @catch (NSException *e) {
                  NSLog(@"[XZX] Failed to create display link: %@", e);
              }
              
              @try {
                  Class metalViewClass = NSClassFromString(@"MTKView");
                  if (metalViewClass) {
                      SEL drawSel = NSSelectorFromString(@"drawRect:");
                      Method originalMethod = class_getInstanceMethod(metalViewClass, drawSel);
                      if (originalMethod) {
                          IMP originalImp = method_getImplementation(originalMethod);
                          IMP swizzledImp = imp_implementationWithBlock(^(id self, CGRect rect) {
                              xzx_on_render_frame();
                              ((void(*)(id, SEL, CGRect))originalImp)(self, drawSel, rect);
                          });
                          method_setImplementation(originalMethod, swizzledImp);
                      }
                  }
              } @catch (NSException *e) {
                  NSLog(@"[XZX] Failed to hook metal view: %@", e);
              }
          }

          - (void)renderCallback {
              xzx_on_render_frame();
          }

          @end

          void install_renderer_hook(void) {
              [[XZXRendererHook shared] setupRenderCallback];
          }

          void unhook_renderer(void) {
              rendererHooked = NO;
          }

          void xzx_on_render_frame(void) {}
          EOF

