name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download and install Lua headers from official source
        run: |
          mkdir -p $HOME/lua-ios/include
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          if [ ! -f lua-5.4.6.tar.gz ]; then
            echo "❌ Failed to download Lua source"
            exit 1
          fi
          tar -xzf lua-5.4.6.tar.gz
          cp lua-5.4.6/src/lua.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/luaconf.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lauxlib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lualib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lua.hpp $HOME/lua-ios/include/
          if [ ! -f $HOME/lua-ios/include/lua.h ]; then
            echo "❌ Lua headers not copied correctly"
            exit 1
          fi
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "✅ Lua headers installed successfully"
      
      - name: Compile Lua source files (excluding problematic modules)
        run: |
          mkdir -p build
          cd lua-5.4.6/src
          # Compile only safe Lua core files (skip loslib.c and loadlib.c which use unsupported functions)
          for file in lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c lstrlib.c ltablib.c lutf8lib.c linit.c; do
            if [ -f "$file" ]; then
              echo "Compiling $file..."
              xcrun -sdk iphoneos clang -c -I. -o "../../build/lua_${file%.c}.o" "$file" -target arm64-apple-ios15.0
            fi
          done
          cd ../..
          echo "✅ Lua compilation complete"
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="12Aklt_7NQ6S6CEKtewn7k5ia8YJuJm9N"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
          if [ ! -f "Roblox.ipa" ]; then
            echo "❌ Download failed"
            exit 1
          fi
          echo "✅ Download successful! Size: $(ls -la Roblox.ipa | awk '{print $5}') bytes"
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ insert_dylib binary not found"
            exit 1
          fi
          mkdir -p ../tools
          cp "$BINARY_PATH" ../tools/insert_dylib
          chmod +x ../tools/insert_dylib
          cd ..
          echo "✅ insert_dylib compiled and installed"
      
      - name: Create directory structure
        run: |
          mkdir -p XZX/Services
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core
      
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
      
      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include <vector>
          #include <string>
          #include <map>
          #include <mutex>
          #include <thread>
          #include "LuaExecutor.h"
          #import "xzx_antidetection.h"
          #import "xzx_ban_protection.h"
          #import "xzx_injection_randomizer.h"
          #import "xzx_hook_manager.h"

          static lua_State *L = nil;
          static std::mutex lua_mutex;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) {
                      [output appendFormat:@"%s", lua_tostring(L, i)];
                  } else if (lua_isnumber(L, i)) {
                      [output appendFormat:@"%g", lua_tonumber(L, i)];
                  } else if (lua_isboolean(L, i)) {
                      [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  } else if (lua_istable(L, i)) {
                      [output appendString:@"table"];
                  } else if (lua_isfunction(L, i)) {
                      [output appendString:@"function"];
                  } else {
                      [output appendString:@"nil"];
                  }
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString stringWithString:@"⚠️ "];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  [output appendFormat:@"%s", lua_tostring(L, i)];
              }
              NSLog(@"[XZX WARN] %@", output);
              return 0;
          }

          static int xzx_error(lua_State *L) {
              const char *msg = luaL_optstring(L, 1, "error");
              luaL_where(L, 1);
              lua_pushvalue(L, -1);
              lua_pushfstring(L, "%s: %s", lua_tostring(L, -1), msg);
              return lua_error(L);
          }

          static int xzx_type(lua_State *L) {
              if (lua_gettop(L) < 1) {
                  lua_pushstring(L, "nil");
                  return 1;
              }
              lua_pushstring(L, lua_typename(L, lua_type(L, 1)));
              return 1;
          }

          static int xzx_typeof(lua_State *L) {
              return xzx_type(L);
          }

          static int xzx_getgenv(lua_State *L) {
              lua_pushglobaltable(L);
              return 1;
          }

          static int xzx_getrenv(lua_State *L) {
              lua_pushglobaltable(L);
              return 1;
          }

          static int xzx_getreg(lua_State *L) {
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              return 1;
          }

          static int xzx_getgc(lua_State *L) {
              lua_newtable(L);
              int table_idx = lua_gettop(L);
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              lua_pushnil(L);
              while (lua_next(L, -2) != 0) {
                  lua_pushvalue(L, -2);
                  int type = lua_type(L, -2);
                  if (type == LUA_TFUNCTION || type == LUA_TTABLE || type == LUA_TUSERDATA || type == LUA_TTHREAD) {
                      lua_pushinteger(L, (int)lua_rawlen(L, table_idx) + 1);
                      lua_pushvalue(L, -3);
                      lua_settable(L, table_idx);
                  }
                  lua_pop(L, 2);
              }
              lua_pop(L, 1);
              return 1;
          }

          static int xzx_newcclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  luaL_error(L, "expected function");
              }
              lua_pushvalue(L, 1);
              lua_pushcclosure(L, [](lua_State *L) -> int {
                  lua_pushvalue(L, lua_upvalueindex(1));
                  int nargs = lua_gettop(L) - 1;
                  lua_insert(L, 1);
                  lua_pcall(L, nargs, LUA_MULTRET, 0);
                  return lua_gettop(L);
              }, 1);
              return 1;
          }

          static int xzx_iscclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              lua_pushboolean(L, lua_iscfunction(L, 1));
              return 1;
          }

          static int xzx_islclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              lua_pushboolean(L, !lua_iscfunction(L, 1));
              return 1;
          }

          static int xzx_isexecutorclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              lua_Debug ar;
              lua_getinfo(L, ">S", &ar);
              if (ar.source && strstr(ar.source, "=xzx")) {
                  lua_pushboolean(L, 1);
                  return 1;
              }
              lua_pushboolean(L, 0);
              return 1;
          }

          static int xzx_hookfunction(lua_State *L) {
              if (!lua_isfunction(L, 1) || !lua_isfunction(L, 2)) {
                  luaL_error(L, "expected two functions");
              }
              lua_pushvalue(L, 2);
              return 1;
          }

          static int xzx_clonefunction(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  luaL_error(L, "expected function");
              }
              lua_pushvalue(L, 1);
              return 1;
          }

          static int xzx_getrawmetatable(lua_State *L) {
              if (!lua_getmetatable(L, 1)) {
                  lua_pushnil(L);
              }
              return 1;
          }

          static int xzx_setrawmetatable(lua_State *L) {
              if (lua_istable(L, 1) && (lua_istable(L, 2) || lua_isnil(L, 2))) {
                  lua_pushvalue(L, 2);
                  lua_setmetatable(L, 1);
              }
              lua_settop(L, 1);
              return 1;
          }

          static int xzx_getnamecallmethod(lua_State *L) {
              const char *method = lua_namecallatom(L, nullptr);
              lua_pushstring(L, method ? method : "");
              return 1;
          }

          static int xzx_setnamecallmethod(lua_State *L) {
              return 0;
          }

          static int xzx_setclipboard(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [UIPasteboard generalPasteboard].string = [NSString stringWithUTF8String:text];
              });
              return 0;
          }

          static int xzx_getclipboard(lua_State *L) {
              NSString *text = [UIPasteboard generalPasteboard].string;
              lua_pushstring(L, text ? [text UTF8String] : "");
              return 1;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_getexecutorname(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_checkcaller(lua_State *L) {
              lua_pushboolean(L, 1);
              return 1;
          }

          static int xzx_getthreadidentity(lua_State *L) {
              lua_pushinteger(L, 8);
              return 1;
          }

          static int xzx_setthreadidentity(lua_State *L) {
              return 0;
          }

          static int xzx_getthreadcontext(lua_State *L) {
              lua_pushinteger(L, 8);
              return 1;
          }

          static int xzx_setthreadcontext(lua_State *L) {
              return 0;
          }

          static int xzx_getfpscap(lua_State *L) {
              lua_pushinteger(L, 60);
              return 1;
          }

          static int xzx_setfpscap(lua_State *L) {
              return 0;
          }

          static int xzx_isrbxactive(lua_State *L) {
              lua_pushboolean(L, 1);
              return 1;
          }

          static int xzx_gethui(lua_State *L) {
              lua_newtable(L);
              return 1;
          }

          static int xzx_getinstances(lua_State *L) {
              lua_newtable(L);
              return 1;
          }

          static int xzx_getnilinstances(lua_State *L) {
              lua_newtable(L);
              return 1;
          }

          static int xzx_getscripts(lua_State *L) {
              lua_newtable(L);
              return 1;
          }

          static int xzx_getloadedmodules(lua_State *L) {
              lua_newtable(L);
              return 1;
          }

          static int xzx_getcallingscript(lua_State *L) {
              lua_pushnil(L);
              return 1;
          }

          static int xzx_getscriptbytecode(lua_State *L) {
              lua_pushnil(L);
              return 1;
          }

          static int xzx_getscriptclosure(lua_State *L) {
              lua_pushnil(L);
              return 1;
          }

          static int xzx_getscriptfunction(lua_State *L) {
              lua_pushnil(L);
              return 1;
          }

          static int xzx_fireclickdetector(lua_State *L) {
              return 0;
          }

          static int xzx_firetouchinterest(lua_State *L) {
              return 0;
          }

          static int xzx_fireproximityprompt(lua_State *L) {
              return 0;
          }

          static int xzx_gethiddenproperty(lua_State *L) {
              lua_pushnil(L);
              return 1;
          }

          static int xzx_sethiddenproperty(lua_State *L) {
              return 0;
          }

          static int xzx_compareinstances(lua_State *L) {
              if (!lua_isuserdata(L, 1) || !lua_isuserdata(L, 2)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              void *a = lua_touserdata(L, 1);
              void *b = lua_touserdata(L, 2);
              lua_pushboolean(L, a == b);
              return 1;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  lua_remove(L, -2);
                  return 2;
              }
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              __block int status_code = 0;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.0 Mobile/15E148 Safari/604.1" forHTTPHeaderField:@"User-Agent"];
              [request setTimeoutInterval:30];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                      if ([response isKindOfClass:[NSHTTPURLResponse class]]) {
                          status_code = (int)((NSHTTPURLResponse *)response).statusCode;
                      }
                  }
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 30 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  lua_pushinteger(L, status_code);
                  return 2;
              }
              lua_pushnil(L);
              lua_pushstring(L, "Request failed");
              return 2;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) {
                  lua_pushnil(L);
                  return 1;
              }
              const char *input = luaL_checkstring(L, 1);
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIWindowScene *windowScene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  UIViewController *rootVC = windowScene.windows.firstObject.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              return 0;
          }

          static int xzx_delay(lua_State *L) {
              double seconds = luaL_checknumber(L, 1);
              if (!lua_isfunction(L, 2)) {
                  luaL_error(L, "expected function");
              }
              lua_pushvalue(L, 2);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(seconds * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          static int xzx_spawn(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  luaL_error(L, "expected function");
              }
              lua_pushvalue(L, 1);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          static int xzx_task_spawn(lua_State *L) {
              return xzx_spawn(L);
          }

          static int xzx_task_delay(lua_State *L) {
              return xzx_delay(L);
          }

          static int xzx_task_wait(lua_State *L) {
              double seconds = luaL_optnumber(L, 1, 0);
              usleep(seconds * 1000000);
              return 0;
          }

          static int xzx_task_defer(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  luaL_error(L, "expected function");
              }
              lua_pushvalue(L, 1);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_async(dispatch_get_main_queue(), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          static int xzx_crypt_encrypt(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              const char *key = luaL_optstring(L, 2, "xzx");
              NSMutableString *result = [NSMutableString string];
              size_t data_len = strlen(data);
              size_t key_len = strlen(key);
              for (size_t i = 0; i < data_len; i++) {
                  char c = data[i] ^ key[i % key_len];
                  [result appendFormat:@"%c", c];
              }
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_crypt_decrypt(lua_State *L) {
              return xzx_crypt_encrypt(L);
          }

          static int xzx_crypt_hash(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              const char *algorithm = luaL_optstring(L, 2, "sha256");
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              unsigned char hash[32];
              size_t hash_len = 32;
              if (strcmp(algorithm, "sha256") == 0) {
                  CC_SHA256(nsdata.bytes, (CC_LONG)nsdata.length, hash);
              } else if (strcmp(algorithm, "sha1") == 0) {
                  CC_SHA1(nsdata.bytes, (CC_LONG)nsdata.length, hash);
                  hash_len = 20;
              } else if (strcmp(algorithm, "md5") == 0) {
                  CC_MD5(nsdata.bytes, (CC_LONG)nsdata.length, hash);
                  hash_len = 16;
              }
              NSMutableString *result = [NSMutableString string];
              for (size_t i = 0; i < hash_len; i++) {
                  [result appendFormat:@"%02x", hash[i]];
              }
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_compress(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              uLong source_len = strlen(data);
              uLong dest_len = compressBound(source_len);
              Bytef *dest = (Bytef*)malloc(dest_len);
              if (compress(dest, &dest_len, (const Bytef*)data, source_len) != Z_OK) {
                  free(dest);
                  lua_pushnil(L);
                  return 1;
              }
              lua_pushlstring(L, (const char*)dest, dest_len);
              free(dest);
              return 1;
          }

          static int xzx_decompress(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              size_t source_len = lua_objlen(L, 1);
              uLong dest_len = source_len * 4;
              Bytef *dest = (Bytef*)malloc(dest_len);
              if (uncompress(dest, &dest_len, (const Bytef*)data, source_len) != Z_OK) {
                  free(dest);
                  lua_pushnil(L);
                  return 1;
              }
              lua_pushlstring(L, (const char*)dest, dest_len);
              free(dest);
              return 1;
          }

          static int xzx_request(lua_State *L) {
              if (!lua_istable(L, 1)) {
                  luaL_error(L, "expected table");
              }
              lua_getfield(L, 1, "Url");
              const char *url = lua_tostring(L, -1);
              if (strcmp(url, "") == 0) {
                  lua_pushnil(L);
                  return 1;
              }
              return xzx_httpget(L);
          }

          static int xzx_readfile(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              NSError *error = nil;
              NSString *content = [NSString stringWithContentsOfFile:filePath encoding:NSUTF8StringEncoding error:&error];
              if (error) {
                  lua_pushnil(L);
                  lua_pushstring(L, [[error localizedDescription] UTF8String]);
                  return 2;
              }
              lua_pushstring(L, [content UTF8String]);
              return 1;
          }

          static int xzx_writefile(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              const char *data = luaL_checkstring(L, 2);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              NSError *error = nil;
              [[NSString stringWithUTF8String:data] writeToFile:filePath atomically:YES encoding:NSUTF8StringEncoding error:&error];
              lua_pushboolean(L, error == nil);
              return 1;
          }

          static int xzx_appendfile(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              const char *data = luaL_checkstring(L, 2);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              NSFileHandle *file = [NSFileHandle fileHandleForWritingAtPath:filePath];
              if (file) {
                  [file seekToEndOfFile];
                  [file writeData:[[NSString stringWithUTF8String:data] dataUsingEncoding:NSUTF8StringEncoding]];
                  [file closeFile];
                  lua_pushboolean(L, 1);
              } else {
                  lua_pushboolean(L, 0);
              }
              return 1;
          }

          static int xzx_listfiles(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              NSString *dirPath = [NSString stringWithUTF8String:path];
              if (![dirPath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  dirPath = [docPath stringByAppendingPathComponent:dirPath];
              }
              NSError *error = nil;
              NSArray *files = [[NSFileManager defaultManager] contentsOfDirectoryAtPath:dirPath error:&error];
              if (error) {
                  lua_pushnil(L);
                  lua_pushstring(L, [[error localizedDescription] UTF8String]);
                  return 2;
              }
              lua_newtable(L);
              for (int i = 0; i < files.count; i++) {
                  lua_pushinteger(L, i + 1);
                  lua_pushstring(L, [files[i] UTF8String]);
                  lua_settable(L, -3);
              }
              return 1;
          }

          static int xzx_isfile(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              BOOL isDir = NO;
              BOOL exists = [[NSFileManager defaultManager] fileExistsAtPath:filePath isDirectory:&isDir];
              lua_pushboolean(L, exists && !isDir);
              return 1;
          }

          static int xzx_isfolder(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              BOOL isDir = NO;
              BOOL exists = [[NSFileManager defaultManager] fileExistsAtPath:filePath isDirectory:&isDir];
              lua_pushboolean(L, exists && isDir);
              return 1;
          }

          static int xzx_makefolder(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              NSError *error = nil;
              [[NSFileManager defaultManager] createDirectoryAtPath:filePath withIntermediateDirectories:YES attributes:nil error:&error];
              lua_pushboolean(L, error == nil);
              return 1;
          }

          static int xzx_delfile(lua_State *L) {
              const char *path = luaL_checkstring(L, 1);
              NSString *filePath = [NSString stringWithUTF8String:path];
              if (![filePath isAbsolutePath]) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *docPath = paths.firstObject;
                  filePath = [docPath stringByAppendingPathComponent:filePath];
              }
              NSError *error = nil;
              [[NSFileManager defaultManager] removeItemAtPath:filePath error:&error];
              lua_pushboolean(L, error == nil);
              return 1;
          }

          static int xzx_debug_getregistry(lua_State *L) {
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              return 1;
          }

          static int xzx_debug_getupvalue(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushnil(L);
                  return 1;
              }
              int index = luaL_checkinteger(L, 2);
              const char *name = lua_getupvalue(L, 1, index);
              if (name) {
                  lua_pushstring(L, name);
                  lua_insert(L, -2);
                  return 2;
              }
              lua_pushnil(L);
              return 1;
          }

          static int xzx_debug_setupvalue(lua_State *L) {
              if (!lua_isfunction(L, 1)) return 0;
              int index = luaL_checkinteger(L, 2);
              lua_pushvalue(L, 3);
              const char *name = lua_setupvalue(L, 1, index);
              lua_pushstring(L, name ? name : "");
              return 1;
          }

          static int xzx_debug_getinfo(lua_State *L) {
              lua_newtable(L);
              return 1;
          }

          static int xzx_debug_traceback(lua_State *L) {
              luaL_traceback(L, L, nullptr, 0);
              return 1;
          }

