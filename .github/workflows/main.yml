name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Download and compile Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -o "src/$filename.o" "src/$filename.c" -target arm64-apple-ios15.0 -I src
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create directory structure
        run: |
          mkdir -p XZX
          mkdir -p injector/dylib/Core

      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          extern "C" {
            #include <lua.h>
            #include <lauxlib.h>
            #include <lualib.h>
          }
          static lua_State *L = nil;
          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) [output appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [output appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  else if (lua_istable(L, i)) [output appendString:@"table"];
                  else if (lua_isfunction(L, i)) [output appendString:@"function"];
                  else [output appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }
          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  return 2;
              }
              return 1;
          }
          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  return 1;
              }
              lua_pushnil(L);
              return 1;
          }
          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }
          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }
          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) { lua_pushnil(L); return 1; }
              const char *input = luaL_checkstring(L, 1);
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }
          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIWindowScene *windowScene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  UIViewController *rootVC = windowScene.keyWindow.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              return 0;
          }
          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }
          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      luaL_openlibs(L);
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "HttpGet", xzx_httpget);
                      lua_register(L, "game_HttpGet", xzx_httpget);
                      lua_register(L, "base64encode", xzx_base64_encode);
                      lua_register(L, "base64decode", xzx_base64_decode);
                      lua_register(L, "base64codes", xzx_base64codes);
                      lua_register(L, "messagebox", xzx_messagebox);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_identifyexecutor);
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      NSLog(@"[XZX] Lua initialized");
                  }
              }
          }
          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (L && script && strlen(script) > 0) {
                  int status = luaL_loadstring(L, script);
                  if (status == 0) {
                      lua_pcall(L, 0, 0, 0);
                  } else {
                      const char *error = lua_tostring(L, -1);
                      NSLog(@"[XZX] Lua Error: %s", error);
                      lua_pop(L, 1);
                  }
              }
          }
          EOF

      - name: Create bridging header
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include "injector/dylib/Core/LuaExecutor.h"
          #endif
          EOF

      - name: Create MainViewController.swift
        run: |
          cat > XZX/MainViewController.swift << 'EOF'
          import UIKit
          @objc(XZXMainViewController)
          public class XZXMainViewController: UIViewController {
              private let textView = UITextView()
              private let executeButton = UIButton()
              private let clearButton = UIButton()
              private let closeButton = UIButton()
              public override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.95)
                  view.layer.cornerRadius = 18
                  view.layer.masksToBounds = true
                  let titleLabel = UILabel()
                  titleLabel.frame = CGRect(x: 20, y: 20, width: 200, height: 30)
                  titleLabel.text = "XZX"
                  titleLabel.textColor = .white
                  titleLabel.font = .systemFont(ofSize: 20, weight: .bold)
                  view.addSubview(titleLabel)
                  textView.frame = CGRect(x: 20, y: 60, width: view.bounds.width - 40, height: view.bounds.height - 160)
                  textView.backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9)
                  textView.textColor = .white
                  textView.font = UIFont(name: "Menlo", size: 14)
                  textView.layer.cornerRadius = 8
                  textView.text = "-- XZX Executor\nprint('Hello World!')"
                  textView.autocorrectionType = .no
                  textView.autocapitalizationType = .none
                  view.addSubview(textView)
                  executeButton.frame = CGRect(x: 20, y: view.bounds.height - 80, width: 120, height: 50)
                  executeButton.setTitle("Execute", for: .normal)
                  executeButton.backgroundColor = UIColor(red: 0.2, green: 0.8, blue: 0.3, alpha: 1)
                  executeButton.layer.cornerRadius = 8
                  executeButton.addTarget(self, action: #selector(executeScript), for: .touchUpInside)
                  view.addSubview(executeButton)
                  clearButton.frame = CGRect(x: 160, y: view.bounds.height - 80, width: 120, height: 50)
                  clearButton.setTitle("Clear", for: .normal)
                  clearButton.backgroundColor = UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  clearButton.layer.cornerRadius = 8
                  clearButton.addTarget(self, action: #selector(clearScript), for: .touchUpInside)
                  view.addSubview(clearButton)
                  closeButton.frame = CGRect(x: view.bounds.width - 60, y: 20, width: 40, height: 40)
                  closeButton.setTitle("✕", for: .normal)
                  closeButton.setTitleColor(.white, for: .normal)
                  closeButton.titleLabel?.font = .systemFont(ofSize: 24)
                  closeButton.addTarget(self, action: #selector(close), for: .touchUpInside)
                  view.addSubview(closeButton)
              }
              @objc func executeScript() {
                  let script = textView.text ?? ""
                  guard !script.isEmpty else { return }
                  script.withCString { ptr in ExecuteScript(ptr) }
              }
              @objc func clearScript() { textView.text = "" }
              @objc func close() { view.isHidden = true }
          }
          EOF

      - name: Create xzx_obfuscator.h
        run: |
          cat > injector/dylib/xzx_obfuscator.h << 'EOF'
          #ifndef XZX_OBFUSCATOR_H
          #define XZX_OBFUSCATOR_H
          #import <Foundation/Foundation.h>
          NSString* xzx_obfuscate(const char* input, size_t len);
          Class xzx_getClass(const char* encryptedName);
          SEL xzx_getSelector(const char* encryptedName);
          @interface XZXObfuscator : NSObject
          + (instancetype)shared;
          @end
          #endif
          EOF

      - name: Create xzx_obfuscator.m
        run: |
          cat > injector/dylib/xzx_obfuscator.m << 'EOF'
          #import "xzx_obfuscator.h"
          #import <objc/runtime.h>
          static XZXObfuscator *sharedInstance = nil;
          @implementation XZXObfuscator
          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ sharedInstance = [[self alloc] init]; });
              return sharedInstance;
          }
          @end
          NSString* xzx_obfuscate(const char* input, size_t len) {
              NSMutableString *result = [NSMutableString string];
              int key = 0xAA;
              for (size_t i = 0; i < len; i++) {
                  char c = input[i] ^ key;
                  [result appendFormat:@"%c", c];
                  key = (key * 31) & 0xFF;
              }
              return result;
          }
          Class xzx_getClass(const char* encryptedName) {
              NSString *decrypted = xzx_obfuscate(encryptedName, strlen(encryptedName));
              return NSClassFromString(decrypted);
          }
          SEL xzx_getSelector(const char* encryptedName) {
              NSString *decrypted = xzx_obfuscate(encryptedName, strlen(encryptedName));
              return NSSelectorFromString(decrypted);
          }
          EOF

      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)onGameJoined;
          - (void)onGameLeft;
          @property (nonatomic, assign) BOOL inGame;
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @end
          void XZXNotifyGameJoined(void);
          void XZXNotifyGameLeft(void);
          #endif
          EOF

      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'EOF'
          #import "xzx_core.h"
          #import "xzx_obfuscator.h"
          #import "xzx_ui_manager.h"
          #import "Core/LuaExecutor.h"
          #import <objc/runtime.h>
          #import <objc/message.h>
          static XZXCore *sharedCore = nil;
          static BOOL coreReady = NO;
          static dispatch_queue_t monitorQueue = nil;
          @implementation XZXCore
          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ sharedCore = [[self alloc] init]; });
              return sharedCore;
          }
          - (instancetype)init {
              self = [super init];
              if (self) {
                  _inGame = NO;
                  _overlayWindow = nil;
                  monitorQueue = dispatch_queue_create("com.xzx.monitor", DISPATCH_QUEUE_SERIAL);
              }
              return self;
          }
          - (void)initialize {
              if (coreReady) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      if ([UIApplication sharedApplication] == nil) return;
                      InitLua();
                      [[XZXUIManager shared] initialize];
                      [self startMonitoring];
                      coreReady = YES;
                      NSLog(@"[XZX] Core ready");
                  });
              });
          }
          - (void)startMonitoring {
              dispatch_async(monitorQueue, ^{
                  while (YES) {
                      @autoreleasepool {
                          BOOL active = [self checkGameActive];
                          if (active && !self.inGame) {
                              self.inGame = YES;
                              dispatch_async(dispatch_get_main_queue(), ^{ [self onGameJoined]; });
                          } else if (!active && self.inGame) {
                              self.inGame = NO;
                              dispatch_async(dispatch_get_main_queue(), ^{ [self onGameLeft]; });
                          }
                      }
                      [NSThread sleepForTimeInterval:1.5];
                  }
              });
          }
          - (BOOL)checkGameActive {
              @try {
                  if ([UIApplication sharedApplication] == nil) return NO;
                  const char* className = "\x8e\xf5\x9a\xc5\x86\xd1\x8c\xc3\x9c\xd8\x88\xc2\x91\xd7";
                  const char* methodName = "\x93\xd1\x80\xce\x9d\xdb\x86\xc2\x9c\xc8\x95\xcf\x83\xcf";
                  Class cls = xzx_getClass(className);
                  if (cls) {
                      SEL sel = xzx_getSelector(methodName);
                      if ([cls respondsToSelector:sel]) {
                          id dm = ((id(*)(id, SEL))objc_msgSend)((id)cls, sel);
                          if (dm) {
                              const char* placeSelName = "\x95\xd0\x8f\xc7\x96\xd6";
                              SEL placeSel = xzx_getSelector(placeSelName);
                              if ([dm respondsToSelector:placeSel]) {
                                  id pid = ((id(*)(id, SEL))objc_msgSend)(dm, placeSel);
                                  return pid != nil;
                              }
                          }
                      }
                  }
              } @catch (NSException *e) {}
              return NO;
          }
          - (void)onGameJoined { [[XZXUIManager shared] showOverlay]; }
          - (void)onGameLeft { [[XZXUIManager shared] hideOverlay]; }
          void XZXNotifyGameJoined(void) { [[XZXCore shared] onGameJoined]; }
          void XZXNotifyGameLeft(void) { [[XZXCore shared] onGameLeft]; }
          @end
          EOF

      - name: Create xzx_ui_manager.h
        run: |
          cat > injector/dylib/xzx_ui_manager.h << 'EOF'
          #ifndef XZX_UI_MANAGER_H
          #define XZX_UI_MANAGER_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface XZXUIManager : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)showOverlay;
          - (void)hideOverlay;
          @end
          #endif
          EOF

      - name: Create xzx_ui_manager.m
        run: |
          cat > injector/dylib/xzx_ui_manager.m << 'EOF'
          #import "xzx_ui_manager.h"
          #import "xzx_obfuscator.h"
          static XZXUIManager *sharedManager = nil;
          static UIWindow *overlayWindow = nil;
          static BOOL windowReady = NO;
          @implementation XZXUIManager
          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ sharedManager = [[self alloc] init]; });
              return sharedManager;
          }
          - (void)initialize {
              if (windowReady) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      if ([UIApplication sharedApplication] == nil) return;
                      UIWindowScene *scene = (UIWindowScene*)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                      if (scene) {
                          const char* vcName = "\x92\xfa\x87\xc0\x94\xed\x81\xca\x97\xef\x86\xc9\x9b\xe8\x85\xc2\x9e\xec\x82\xcf\x9f\xeb\x8d\xcb\x91\xf1\x93\xcd\x99\xf0\x8c\xc8\x96\xe6\x89\xc9\x9a\xe4";
                          Class vcClass = xzx_getClass(vcName);
                          UIViewController *vc = [[vcClass alloc] init];
                          if (vc) {
                              overlayWindow = [[UIWindow alloc] initWithWindowScene:scene];
                              overlayWindow.windowLevel = UIWindowLevelAlert + 1;
                              overlayWindow.rootViewController = vc;
                              overlayWindow.backgroundColor = [UIColor clearColor];
                              overlayWindow.hidden = YES;
                              windowReady = YES;
                              NSLog(@"[XZX] UI Manager ready");
                          }
                      }
                  });
              });
          }
          - (void)showOverlay {
              if (!windowReady) { [self initialize]; return; }
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (overlayWindow && overlayWindow.hidden) {
                      overlayWindow.hidden = NO;
                      [overlayWindow makeKeyAndVisible];
                  }
              });
          }
          - (void)hideOverlay {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (overlayWindow) overlayWindow.hidden = YES;
              });
          }
          @end
          EOF

      - name: Create entry.m
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import "xzx_core.h"
          __attribute__((constructor))
          static void entry() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      if ([UIApplication sharedApplication] != nil) {
                          [[XZXCore shared] initialize];
                      }
                  });
              });
          }
          EOF

      - name: Create placeholder files (NO DUPLICATES)
        run: |
          cat > injector/dylib/xzx_hooks.h << 'EOF'
          #ifndef XZX_HOOKS_H
          #define XZX_HOOKS_H
          #include <stdbool.h>
          bool xzx_is_in_game(void);
          #endif
          EOF
          cat > injector/dylib/xzx_hooks.m << 'EOF'
          #include "xzx_hooks.h"
          bool xzx_is_in_game(void) { return false; }
          EOF
          cat > injector/dylib/xzx_antidetection.h << 'EOF'
          #ifndef XZX_ANTIDETECTION_H
          #define XZX_ANTIDETECTION_H
          #import <Foundation/Foundation.h>
          @interface XZXAntiDetection : NSObject
          + (instancetype)shared;
          @end
          #endif
          EOF
          cat > injector/dylib/xzx_antidetection.m << 'EOF'
          #import "xzx_antidetection.h"
          @implementation XZXAntiDetection
          + (instancetype)shared { static id i; static dispatch_once_t t; dispatch_once(&t, ^{ i = [self new]; }); return i; }
          @end
          EOF
          cat > injector/dylib/xzx_ban_protection.h << 'EOF'
          #ifndef XZX_BAN_PROTECTION_H
          #define XZX_BAN_PROTECTION_H
          #import <Foundation/Foundation.h>
          @interface XZXBanProtection : NSObject
          + (instancetype)shared;
          @end
          #endif
          EOF
          cat > injector/dylib/xzx_ban_protection.m << 'EOF'
          #import "xzx_ban_protection.h"
          @implementation XZXBanProtection
          + (instancetype)shared { static id i; static dispatch_once_t t; dispatch_once(&t, ^{ i = [self new]; }); return i; }
          @end
          EOF
          cat > injector/dylib/xzx_hook_manager.h << 'EOF'
          #ifndef XZX_HOOK_MANAGER_H
          #define XZX_HOOK_MANAGER_H
          #import <Foundation/Foundation.h>
          @interface XZXHookManager : NSObject
          + (instancetype)shared;
          @end
          #endif
          EOF
          cat > injector/dylib/xzx_hook_manager.m << 'EOF'
          #import "xzx_hook_manager.h"
          @implementation XZXHookManager
          + (instancetype)shared { static id i; static dispatch_once_t t; dispatch_once(&t, ^{ i = [self new]; }); return i; }
          @end
          EOF

      - name: Compile Objective-C files (explicit list)
        run: |
          mkdir -p build
          FILES="
            injector/dylib/entry.m
            injector/dylib/xzx_core.m
            injector/dylib/xzx_ui_manager.m
            injector/dylib/xzx_obfuscator.m
            injector/dylib/xzx_hooks.m
            injector/dylib/xzx_antidetection.m
            injector/dylib/xzx_ban_protection.m
            injector/dylib/xzx_hook_manager.m
          "
          for file in $FILES; do
            if [ -f "$file" ]; then
              echo "Compiling ObjC: $file"
              xcrun -sdk iphoneos clang -c \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/$(basename "$file" .m).o" "$file" -target arm64-apple-ios15.0
            fi
          done

      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang++ -c -std=c++11 \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/$(basename "$file" .mm).o" "$file" -target arm64-apple-ios15.0
            fi
          done

      - name: Compile Swift file
        run: |
          xcrun -sdk iphoneos swiftc -c \
            -module-name XZX \
            -import-objc-header XZX/XZX-Bridging-Header.h \
            -I . -I ./injector/dylib -I ./injector/dylib/Core -I ${{ env.LUA_INCLUDE_DIR }} \
            -target arm64-apple-ios15.0 \
            -o build/XZXSwift.o \
            XZX/MainViewController.swift

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework WebKit \
            -L${{ env.LUA_LIB_DIR }} -Wl,-force_load,${{ env.LUA_LIB_DIR }}/liblua.a \
            -Xlinker -rpath -Xlinker /usr/lib/swift -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -undefined dynamic_lookup \
            -o build/executor.dylib build/*.o -lc++ -target arm64-apple-ios15.0
          echo "✅ Dylib compiled:"
          file build/executor.dylib

      - name: Extract and modify IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib --all-yes @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          cd extracted && zip -qr ../XZX.ipa Payload/ && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
