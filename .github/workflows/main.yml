          public class ScriptBloxAPI {
              public static let shared = ScriptBloxAPI()
              private init() {}
              public func search(query: String, completion: @escaping ([ScriptItem]) -> Void) {
                  let urlString = "https://scriptblox.com/api/script/search?q=\(query)&mode=free"
                  guard let url = URL(string: urlString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "") else { completion([]); return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { DispatchQueue.main.async { completion([]) }; return }
                      do {
                          let decoded = try JSONDecoder().decode([String: [String: [ScriptItem]]].self, from: data)
                          let scripts = decoded["result"]?["scripts"] ?? []
                          DispatchQueue.main.async { completion(scripts) }
                      } catch { DispatchQueue.main.async { completion([]) } }
                  }.resume()
              }
              public func loadThumbnail(url: String, completion: @escaping (UIImage?) -> Void) {
                  guard let imageUrl = URL(string: url) else { completion(nil); return }
                  URLSession.shared.dataTask(with: imageUrl) { data, _, _ in
                      if let data = data, let image = UIImage(data: data) { DispatchQueue.main.async { completion(image) } }
                      else { DispatchQueue.main.async { completion(nil) } }
                  }.resume()
              }
          }
