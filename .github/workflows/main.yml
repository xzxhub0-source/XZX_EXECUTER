          - (NSString*)decrypt:(NSString*)encrypted;
          - (NSString*)encrypt:(NSString*)plain;
          @end
          #endif
          EOF

      - name: Create xzx_obfuscator.m
        run: |
          cat > injector/dylib/xzx_obfuscator.m << 'EOF'
          #import "xzx_obfuscator.h"
          @implementation XZXObfuscator
          + (instancetype)shared {
              static XZXObfuscator *instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ instance = [[self alloc] init]; });
              return instance;
          }
          - (NSString*)decrypt:(NSString*)e {
              NSMutableString *d = [NSMutableString string];
              for (int i = 0; i < (int)e.length; i++) {
                  unichar c = [e characterAtIndex:i] ^ 0xAA;
                  [d appendFormat:@"%C", c];
              }
              return d;
          }
          - (NSString*)encrypt:(NSString*)p {
              NSMutableString *r = [NSMutableString string];
              for (int i = 0; i < (int)p.length; i++) {
                  unichar c = [p characterAtIndex:i] ^ 0xAA;
                  [r appendFormat:@"%C", c];
              }
              return r;
          }
          @end
          NSString* xzx_obfuscate(const char* input) {
              NSMutableString *result = [NSMutableString string];
              int key = 0xAA;
              for (size_t i = 0; i < strlen(input); i++) {
                  char c = input[i] ^ key;
                  [result appendFormat:@"%c", c];
                  key = (key * 31) & 0xFF;
              }
              return result;
          }
          EOF

