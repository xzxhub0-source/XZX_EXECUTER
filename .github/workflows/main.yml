name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Download and compile Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -o "src/$filename.o" "src/$filename.c" -target arm64-apple-ios15.0 -I src
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create directory structure
        run: |
          mkdir -p XZX
          mkdir -p injector/dylib/Core

      # ========== 1. Lua Executor (same as before) ==========
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          extern "C" {
            #include <lua.h>
            #include <lauxlib.h>
            #include <lualib.h>
          }

          static lua_State *L = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) [output appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [output appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  else if (lua_istable(L, i)) [output appendString:@"table"];
                  else if (lua_isfunction(L, i)) [output appendString:@"function"];
                  else [output appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  return 2;
              }
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  return 1;
              }
              lua_pushnil(L);
              return 1;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) { lua_pushnil(L); return 1; }
              const char *input = luaL_checkstring(L, 1);
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIWindowScene *windowScene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  UIViewController *rootVC = windowScene.keyWindow.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              return 0;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      luaL_openlibs(L);
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "HttpGet", xzx_httpget);
                      lua_register(L, "game_HttpGet", xzx_httpget);
                      lua_register(L, "base64encode", xzx_base64_encode);
                      lua_register(L, "base64decode", xzx_base64_decode);
                      lua_register(L, "base64codes", xzx_base64codes);
                      lua_register(L, "messagebox", xzx_messagebox);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_identifyexecutor);
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      NSLog(@"[XZX] Lua initialized");
                  }
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (L && script && strlen(script) > 0) {
                  int status = luaL_loadstring(L, script);
                  if (status == 0) {
                      lua_pcall(L, 0, 0, 0);
                  } else {
                      const char *error = lua_tostring(L, -1);
                      NSLog(@"[XZX] Lua Error: %s", error);
                      lua_pop(L, 1);
                  }
              }
          }
          EOF

      # ========== 2. Bridging header ==========
      - name: Create bridging header
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include "injector/dylib/Core/LuaExecutor.h"
          #endif
          EOF

      # ========== 3. No UIViewController – we inject Lua directly ==========
      # MainViewController.swift is not needed. We will create the GUI via Lua.

      # ========== 4. Core logic: find Roblox Lua state and inject GUI script ==========
      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>

          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          @end
          #endif
          EOF

      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'EOF'
          #import "xzx_core.h"
          #import "Core/LuaExecutor.h"
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static XZXCore *sharedCore = nil;
          static BOOL isInitialized = NO;

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ sharedCore = [[self alloc] init]; });
              return sharedCore;
          }

          - (void)initialize {
              if (isInitialized) return;
              isInitialized = YES;

              // Wait for Roblox to fully load before trying to get its Lua state
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self performSelectorInBackground:@selector(findAndInject) withObject:nil];
              });
          }

          - (void)findAndInject {
              // Poll until we find Roblox's Lua state
              while (YES) {
                  @autoreleasepool {
                      lua_State *rbxL = [self getRobloxLuaState];
                      if (rbxL) {
                          [self injectGUIScript:rbxL];
                          break;
                      }
                      [NSThread sleepForTimeInterval:1.0];
                  }
              }
          }

          - (lua_State*)getRobloxLuaState {
              // Use the known Roblox class hierarchy to get the Lua state.
              // This is safe because we only call it after Roblox has started.
              Class dataModelClass = NSClassFromString(@"RobloxDataModel");
              if (!dataModelClass) return NULL;

              SEL sharedSel = NSSelectorFromString(@"sharedDataModel");
              if (![dataModelClass respondsToSelector:sharedSel]) return NULL;

              id dataModel = ((id(*)(id, SEL))objc_msgSend)(dataModelClass, sharedSel);
              if (!dataModel) return NULL;

              // Get ScriptContext (offset may change, but we search dynamically)
              Ivar scriptContextIvar = class_getInstanceVariable([dataModel class], "_scriptContext");
              if (!scriptContextIvar) return NULL;

              id scriptContext = object_getIvar(dataModel, scriptContextIvar);
              if (!scriptContext) return NULL;

              // Get the Lua state from ScriptContext
              Ivar luaStateIvar = class_getInstanceVariable([scriptContext class], "_luaState");
              if (!luaStateIvar) return NULL;

              return (__bridge lua_State*)object_getIvar(scriptContext, luaStateIvar);
          }

          - (void)injectGUIScript:(lua_State*)rbxL {
              // Lua script that creates a draggable ScreenGui in CoreGui
              const char *guiScript =
                  "local gui = Instance.new('ScreenGui')\n"
                  "gui.Name = 'XZX_Executor'\n"
                  "gui.Parent = game:GetService('CoreGui')\n"
                  "gui.ResetOnSpawn = false\n\n"
                  "local frame = Instance.new('Frame')\n"
                  "frame.Size = UDim2.new(0, 400, 0, 500)\n"
                  "frame.Position = UDim2.new(0.5, -200, 0.5, -250)\n"
                  "frame.BackgroundColor3 = Color3.fromRGB(20, 20, 30)\n"
                  "frame.BorderSizePixel = 0\n"
                  "frame.Parent = gui\n\n"
                  "local title = Instance.new('TextLabel')\n"
                  "title.Size = UDim2.new(1, 0, 0, 40)\n"
                  "title.BackgroundColor3 = Color3.fromRGB(30, 30, 40)\n"
                  "title.Text = 'XZX Executor'\n"
                  "title.TextColor3 = Color3.fromRGB(255, 255, 255)\n"
                  "title.Font = Enum.Font.GothamBold\n"
                  "title.TextSize = 20\n"
                  "title.Parent = frame\n\n"
                  "local scriptBox = Instance.new('TextBox')\n"
                  "scriptBox.Size = UDim2.new(1, -20, 1, -90)\n"
                  "scriptBox.Position = UDim2.new(0, 10, 0, 50)\n"
                  "scriptBox.BackgroundColor3 = Color3.fromRGB(40, 40, 50)\n"
                  "scriptBox.TextColor3 = Color3.fromRGB(255, 255, 255)\n"
                  "scriptBox.PlaceholderText = '-- Enter your script here'\n"
                  "scriptBox.TextXAlignment = Enum.TextXAlignment.Left\n"
                  "scriptBox.TextYAlignment = Enum.TextYAlignment.Top\n"
                  "scriptBox.MultiLine = true\n"
                  "scriptBox.ClearTextOnFocus = false\n"
                  "scriptBox.Font = Enum.Font.Code\n"
                  "scriptBox.TextSize = 14\n"
                  "scriptBox.Parent = frame\n\n"
                  "local execute = Instance.new('TextButton')\n"
                  "execute.Size = UDim2.new(0.5, -5, 0, 30)\n"
                  "execute.Position = UDim2.new(0, 10, 1, -40)\n"
                  "execute.BackgroundColor3 = Color3.fromRGB(0, 255, 0)\n"
                  "execute.Text = 'Execute'\n"
                  "execute.TextColor3 = Color3.fromRGB(0, 0, 0)\n"
                  "execute.Font = Enum.Font.GothamBold\n"
                  "execute.TextSize = 16\n"
                  "execute.Parent = frame\n\n"
                  "local clear = Instance.new('TextButton')\n"
                  "clear.Size = UDim2.new(0.5, -5, 0, 30)\n"
                  "clear.Position = UDim2.new(0.5, 5, 1, -40)\n"
                  "clear.BackgroundColor3 = Color3.fromRGB(255, 0, 0)\n"
                  "clear.Text = 'Clear'\n"
                  "clear.TextColor3 = Color3.fromRGB(255, 255, 255)\n"
                  "clear.Font = Enum.Font.GothamBold\n"
                  "clear.TextSize = 16\n"
                  "clear.Parent = frame\n\n"
                  "local drag = Instance.new('ImageButton')\n"
                  "drag.Size = UDim2.new(1, 0, 0, 40)\n"
                  "drag.BackgroundTransparency = 1\n"
                  "drag.Parent = gui\n\n"
                  "local dragging = false\n"
                  "local dragStart = nil\n"
                  "local framePos = nil\n\n"
                  "drag.MouseButton1Down:Connect(function()\n"
                  "    dragging = true\n"
                  "    dragStart = game:GetService('UserInputService'):GetMouseLocation()\n"
                  "    framePos = frame.Position\n"
                  "end)\n\n"
                  "game:GetService('UserInputService').InputChanged:Connect(function(input)\n"
                  "    if dragging and input.UserInputType == Enum.UserInputType.MouseMovement then\n"
                  "        local delta = game:GetService('UserInputService'):GetMouseLocation() - dragStart\n"
                  "        frame.Position = UDim2.new(\n"
                  "            framePos.X.Scale,\n"
                  "            framePos.X.Offset + delta.X,\n"
                  "            framePos.Y.Scale,\n"
                  "            framePos.Y.Offset + delta.Y\n"
                  "        )\n"
                  "    end\n"
                  "end)\n\n"
                  "game:GetService('UserInputService').InputEnded:Connect(function(input)\n"
                  "    if input.UserInputType == Enum.UserInputType.MouseButton1 then\n"
                  "        dragging = false\n"
                  "    end\n"
                  "end)\n\n"
                  "execute.MouseButton1Click:Connect(function()\n"
                  "    local script = scriptBox.Text\n"
                  "    if script and #script > 0 then\n"
                  "        local f, err = loadstring(script)\n"
                  "        if f then\n"
                  "            pcall(f)\n"
                  "        else\n"
                  "            warn('XZX Error: ' .. tostring(err))\n"
                  "        end\n"
                  "    end\n"
                  "end)\n\n"
                  "clear.MouseButton1Click:Connect(function()\n"
                  "    scriptBox.Text = ''\n"
                  "end)\n";

              if (rbxL) {
                  int status = luaL_loadstring(rbxL, guiScript);
                  if (status == 0) {
                      lua_pcall(rbxL, 0, 0, 0);
                      NSLog(@"[XZX] GUI injected successfully");
                  } else {
                      const char *error = lua_tostring(rbxL, -1);
                      NSLog(@"[XZX] Failed to inject GUI: %s", error);
                      lua_pop(rbxL, 1);
                  }
              }
          }

          @end
          EOF

      - name: Create entry.m
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "xzx_core.h"

          __attribute__((constructor))
          static void entry() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[XZXCore shared] initialize];
              });
          }
          EOF

