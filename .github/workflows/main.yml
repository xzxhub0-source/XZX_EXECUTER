          #import "xzx_task_hook.h"
          #import "xzx_core.h"
          #import <objc/runtime.h>
          #import <objc/message.h>

          static BOOL taskHooked = NO;

          @implementation XZXTaskHook

          + (instancetype)shared {
              static XZXTaskHook *instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  instance = [[self alloc] init];
              });
              return instance;
          }

          - (void)setupTaskCallback {
              if (taskHooked) return;
              taskHooked = YES;
              
              @try {
                  Class runLoopClass = NSClassFromString(@"NSRunLoop");
                  if (runLoopClass) {
                      SEL runSel = NSSelectorFromString(@"runMode:beforeDate:");
                      Method originalMethod = class_getInstanceMethod(runLoopClass, runSel);
                      if (originalMethod) {
                          IMP originalImp = method_getImplementation(originalMethod);
                          IMP swizzledImp = imp_implementationWithBlock(^BOOL(id self, NSRunLoopMode mode, NSDate *date) {
                              BOOL result = ((BOOL(*)(id, SEL, NSRunLoopMode, NSDate*))originalImp)(self, runSel, mode, date);
                              if ([[XZXCore shared] isInGame]) {
                                  xzx_on_task_run();
                              }
                              return result;
                          });
                          method_setImplementation(originalMethod, swizzledImp);
                      }
                  }
              } @catch (NSException *e) {
                  NSLog(@"[XZX] Failed to hook run loop: %@", e);
              }
          }

          @end

          void install_task_hook(void) {
              [[XZXTaskHook shared] setupTaskCallback];
          }

          void unhook_task(void) {
              taskHooked = NO;
          }

          void xzx_on_task_run(void) {}
          EOF

