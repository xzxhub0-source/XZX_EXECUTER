name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download Roblox IPA
        run: |
          FILE_ID="16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa

      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Download and compile Lua for iOS
        run: |
          mkdir -p $HOME/lua-ios
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for file in src/*.c; do
            filename=$(basename "$file" .c)
            if [ "$filename" != "lua" ] && [ "$filename" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -o "src/$filename.o" "src/$filename.c" -target arm64-apple-ios15.0 -I src
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB_DIR=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Create directory structure
        run: |
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core

      # ----- LuaExecutor (unchanged) -----
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          struct lua_State;
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          void RegisterFunction(const char *name, int (*func)(struct lua_State*));
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          extern "C" {
            #include <lua.h>
            #include <lauxlib.h>
            #include <lualib.h>
          }
          #include "LuaExecutor.h"

          static lua_State *L = nil;
          static NSMutableDictionary *registeredFunctions = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) [output appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [output appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  else if (lua_istable(L, i)) [output appendString:@"table"];
                  else if (lua_isfunction(L, i)) [output appendString:@"function"];
                  else [output appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  return 2;
              }
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              __block int statusCode = 0;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15" forHTTPHeaderField:@"User-Agent"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                      if ([response isKindOfClass:[NSHTTPURLResponse class]]) {
                          statusCode = (int)((NSHTTPURLResponse *)response).statusCode;
                      }
                  }
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 30 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  lua_pushinteger(L, statusCode);
                  return 2;
              }
              lua_pushnil(L);
              lua_pushstring(L, "Request failed");
              return 2;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIWindowScene *windowScene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  UIViewController *rootVC = windowScene.keyWindow.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              return 0;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_wait(lua_State *L) {
              double seconds = luaL_optnumber(L, 1, 0);
              usleep(seconds * 1000000);
              return 0;
          }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      luaL_openlibs(L);
                      registeredFunctions = [NSMutableDictionary dictionary];
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "HttpGet", xzx_httpget);
                      lua_register(L, "game_HttpGet", xzx_httpget);
                      lua_register(L, "base64encode", xzx_base64_encode);
                      lua_register(L, "base64decode", xzx_base64_decode);
                      lua_register(L, "messagebox", xzx_messagebox);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_identifyexecutor);
                      lua_register(L, "wait", xzx_wait);
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      NSLog(@"[XZX] Lua initialized");
                  }
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              if (L && script && strlen(script) > 0) {
                  int status = luaL_loadstring(L, script);
                  if (status == 0) {
                      lua_pcall(L, 0, 0, 0);
                  } else {
                      const char *error = lua_tostring(L, -1);
                      NSLog(@"[XZX] Lua Error: %s", error);
                      lua_pop(L, 1);
                  }
              }
          }

          void RegisterFunction(const char *name, int (*func)(lua_State*)) {
              if (!L) InitLua();
              lua_register(L, name, func);
              [registeredFunctions setObject:[NSString stringWithUTF8String:name] forKey:[NSString stringWithUTF8String:name]];
          }
          EOF

      # ----- Objective-C UI (XZXMainViewController) -----
      - name: Create XZXMainViewController.h
        run: |
          cat > XZX/UI/XZXMainViewController.h << 'EOF'
          #import <UIKit/UIKit.h>

          @interface XZXMainViewController : UIViewController
          @property (nonatomic, strong) UIView      *panel;
          @property (nonatomic, strong) UITextView  *textView;
          @property (nonatomic, strong) UIView      *editorView;
          @property (nonatomic, strong) UIView      *hubView;
          @property (nonatomic, strong) UIView      *savedView;
          @property (nonatomic, strong) UIView      *tabLine;
          @property (nonatomic, strong) UIButton    *toggleBtn;
          @property (nonatomic, strong) NSMutableArray *tabButtons;
          @property (nonatomic, assign) BOOL        panelVisible;
          @end
          EOF

      - name: Create XZXMainViewController.m
        run: |
          cat > XZX/UI/XZXMainViewController.m << 'EOF'
          #import "XZXMainViewController.h"

          @implementation XZXMainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];

              UIButton *toggleBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              toggleBtn.frame = CGRectMake(20, 80, 52, 52);
              toggleBtn.backgroundColor = [UIColor colorWithRed:0.45 green:0.20 blue:0.85 alpha:0.95];
              toggleBtn.layer.cornerRadius = 26;
              toggleBtn.layer.shadowColor  = [UIColor colorWithRed:0.65 green:0.35 blue:1 alpha:1].CGColor;
              toggleBtn.layer.shadowOpacity = 0.8;
              toggleBtn.layer.shadowRadius  = 10;
              toggleBtn.layer.shadowOffset  = CGSizeZero;
              [toggleBtn setTitle:@"⚡" forState:UIControlStateNormal];
              toggleBtn.titleLabel.font = [UIFont systemFontOfSize:24];
              [toggleBtn addTarget:self action:@selector(togglePanel) forControlEvents:UIControlEventTouchUpInside];
              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(dragBtn:)];
              [toggleBtn addGestureRecognizer:pan];
              [self.view addSubview:toggleBtn];
              _toggleBtn = toggleBtn;

              [self buildPanel];
              _panelVisible = NO;
              _panel.hidden = YES;
          }

          - (void)buildPanel {
              CGRect screen = UIScreen.mainScreen.bounds;
              CGFloat pw = MIN(screen.size.width - 40, 440);
              CGFloat ph = MIN(screen.size.height - 120, 520);
              CGFloat px = (screen.size.width  - pw) / 2;
              CGFloat py = (screen.size.height - ph) / 2;

              _panel = [[UIView alloc] initWithFrame:CGRectMake(px, py, pw, ph)];
              _panel.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.11 alpha:0.97];
              _panel.layer.cornerRadius = 18;
              _panel.layer.borderWidth  = 1.2;
              _panel.layer.borderColor  = [UIColor colorWithRed:0.55 green:0.25 blue:0.95 alpha:0.7].CGColor;
              _panel.layer.shadowColor  = [UIColor colorWithRed:0.65 green:0.35 blue:1 alpha:1].CGColor;
              _panel.layer.shadowOpacity = 0.6;
              _panel.layer.shadowRadius  = 20;
              _panel.layer.shadowOffset  = CGSizeZero;
              [self.view addSubview:_panel];

              UIView *titleBar = [[UIView alloc] initWithFrame:CGRectMake(0, 0, pw, 44)];
              titleBar.backgroundColor = [UIColor colorWithRed:0.45 green:0.20 blue:0.85 alpha:1];
              titleBar.layer.cornerRadius = 18;
              titleBar.layer.maskedCorners = kCALayerMinXMinYCorner | kCALayerMaxXMinYCorner;
              [_panel addSubview:titleBar];

              UILabel *titleLbl = [[UILabel alloc] initWithFrame:CGRectMake(16, 0, pw - 60, 44)];
              titleLbl.text = @"⚡ XZX Executor";
              titleLbl.textColor = UIColor.whiteColor;
              titleLbl.font = [UIFont boldSystemFontOfSize:15];
              [titleBar addSubview:titleLbl];

              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              closeBtn.frame = CGRectMake(pw - 44, 0, 44, 44);
              [closeBtn setTitle:@"✕" forState:UIControlStateNormal];
              [closeBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              closeBtn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [closeBtn addTarget:self action:@selector(togglePanel) forControlEvents:UIControlEventTouchUpInside];
              [titleBar addSubview:closeBtn];

              UIPanGestureRecognizer *panPanel = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(dragPanel:)];
              [titleBar addGestureRecognizer:panPanel];

              NSArray *tabs = @[@"Editor", @"Hub", @"Saved"];
              _tabButtons = [NSMutableArray array];
              CGFloat tw = pw / tabs.count;
              for (int i = 0; i < tabs.count; i++) {
                  UIButton *tab = [UIButton buttonWithType:UIButtonTypeSystem];
                  tab.frame = CGRectMake(i * tw, 44, tw, 38);
                  [tab setTitle:tabs[i] forState:UIControlStateNormal];
                  [tab setTitleColor:(i == 0 ? UIColor.whiteColor : [UIColor colorWithWhite:1 alpha:0.4]) forState:UIControlStateNormal];
                  tab.titleLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
                  tab.tag = i;
                  [tab addTarget:self action:@selector(switchTab:) forControlEvents:UIControlEventTouchUpInside];
                  [_panel addSubview:tab];
                  [_tabButtons addObject:tab];
              }

              _tabLine = [[UIView alloc] initWithFrame:CGRectMake(0, 82, tw, 2)];
              _tabLine.backgroundColor = [UIColor colorWithRed:0.65 green:0.35 blue:1 alpha:1];
              [_panel addSubview:_tabLine];

              CGRect content = CGRectMake(0, 84, pw, ph - 84);

              _editorView = [[UIView alloc] initWithFrame:content];
              _editorView.hidden = NO;
              [_panel addSubview:_editorView];

              _textView = [[UITextView alloc] initWithFrame:CGRectMake(10, 8, pw - 20, ph - 84 - 54)];
              _textView.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.10 alpha:1];
              _textView.textColor = [UIColor colorWithRed:0.75 green:0.95 blue:0.75 alpha:1];
              _textView.font = [UIFont fontWithName:@"Menlo" size:13] ?: [UIFont monospacedSystemFontOfSize:13 weight:UIFontWeightRegular];
              _textView.text = @"-- XZX Executor\nprint(\"Hello from XZX!\")";
              _textView.layer.cornerRadius = 8;
              _textView.keyboardType = UIKeyboardTypeDefault;
              _textView.autocorrectionType = UITextAutocorrectionTypeNo;
              _textView.autocapitalizationType = UITextAutocapitalizationTypeNone;
              [_editorView addSubview:_textView];

              CGFloat btnY = ph - 84 - 42;
              UIButton *execBtn = [self makeButton:@"▶  Execute" color:[UIColor colorWithRed:0.2 green:0.7 blue:0.3 alpha:1]];
              execBtn.frame = CGRectMake(10, btnY, (pw - 30) / 2, 36);
              [execBtn addTarget:self action:@selector(executeScript) forControlEvents:UIControlEventTouchUpInside];
              [_editorView addSubview:execBtn];

              UIButton *clearBtn = [self makeButton:@"🗑  Clear" color:[UIColor colorWithRed:0.5 green:0.1 blue:0.1 alpha:1]];
              clearBtn.frame = CGRectMake(20 + (pw - 30) / 2, btnY, (pw - 30) / 2, 36);
              [clearBtn addTarget:self action:@selector(clearScript) forControlEvents:UIControlEventTouchUpInside];
              [_editorView addSubview:clearBtn];

              _hubView = [[UIView alloc] initWithFrame:content];
              _hubView.hidden = YES;
              [_panel addSubview:_hubView];
              UILabel *hubPlaceholder = [[UILabel alloc] initWithFrame:_hubView.bounds];
              hubPlaceholder.text = @"Script Hub";
              hubPlaceholder.textColor = [UIColor colorWithWhite:1 alpha:0.3];
              hubPlaceholder.textAlignment = NSTextAlignmentCenter;
              hubPlaceholder.font = [UIFont systemFontOfSize:16];
              [_hubView addSubview:hubPlaceholder];

              _savedView = [[UIView alloc] initWithFrame:content];
              _savedView.hidden = YES;
              [_panel addSubview:_savedView];
              UILabel *savedPlaceholder = [[UILabel alloc] initWithFrame:_savedView.bounds];
              savedPlaceholder.text = @"No saved scripts";
              savedPlaceholder.textColor = [UIColor colorWithWhite:1 alpha:0.3];
              savedPlaceholder.textAlignment = NSTextAlignmentCenter;
              savedPlaceholder.font = [UIFont systemFontOfSize:16];
              [_savedView addSubview:savedPlaceholder];

              [[NSNotificationCenter defaultCenter] addObserver:self
                                                       selector:@selector(loadScript:)
                                                           name:@"LoadScript"
                                                         object:nil];
          }

          - (UIButton *)makeButton:(NSString *)title color:(UIColor *)color {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
              btn.backgroundColor = color;
              [btn setTitle:title forState:UIControlStateNormal];
              [btn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              btn.layer.cornerRadius = 8;
              return btn;
          }

          - (void)togglePanel {
              _panelVisible = !_panelVisible;
              [UIView animateWithDuration:0.22 animations:^{
                  _panel.hidden  = !_panelVisible;
                  _panel.alpha   = _panelVisible ? 1 : 0;
                  _panel.transform = _panelVisible ? CGAffineTransformIdentity
                                                   : CGAffineTransformMakeScale(0.92, 0.92);
              }];
          }

          - (void)switchTab:(UIButton *)sender {
              NSInteger idx = sender.tag;
              _editorView.hidden = (idx != 0);
              _hubView.hidden    = (idx != 1);
              _savedView.hidden  = (idx != 2);
              CGFloat tw = _panel.bounds.size.width / _tabButtons.count;
              [UIView animateWithDuration:0.18 animations:^{
                  CGRect f = _tabLine.frame;
                  f.origin.x = idx * tw;
                  _tabLine.frame = f;
              }];
              for (UIButton *btn in _tabButtons) {
                  btn.titleLabel.alpha = (btn.tag == idx) ? 1.0 : 0.4;
                  [btn setTitleColor:(btn.tag == idx ? UIColor.whiteColor : [UIColor colorWithWhite:1 alpha:0.4])
                            forState:UIControlStateNormal];
              }
          }

          - (void)executeScript {
              NSString *script = _textView.text;
              if (script.length == 0) return;
              [[NSNotificationCenter defaultCenter] postNotificationName:@"XZXExecuteScript" object:script];
          }

          - (void)clearScript {
              _textView.text = @"";
          }

          - (void)loadScript:(NSNotification *)note {
              NSString *script = note.object;
              if (script) {
                  _textView.text = script;
                  [self switchTab:_tabButtons[0]];
                  if (!_panelVisible) [self togglePanel];
              }
          }

          - (void)dragBtn:(UIPanGestureRecognizer *)gr {
              CGPoint t = [gr translationInView:self.view];
              _toggleBtn.center = CGPointMake(_toggleBtn.center.x + t.x, _toggleBtn.center.y + t.y);
              [gr setTranslation:CGPointZero inView:self.view];
          }

          - (void)dragPanel:(UIPanGestureRecognizer *)gr {
              CGPoint t = [gr translationInView:self.view];
              _panel.center = CGPointMake(_panel.center.x + t.x, _panel.center.y + t.y);
              [gr setTranslation:CGPointZero inView:self.view];
          }

          - (void)dealloc {
              [[NSNotificationCenter defaultCenter] removeObserver:self];
          }

          @end
          EOF

      # ----- Core detection (WKWebView based) -----
      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)showOverlay;
          - (void)hideOverlay;
          - (BOOL)isOverlayVisible;
          - (BOOL)isInGame;
          @property (nonatomic, assign) BOOL isInitialized;
          @property (nonatomic, assign) BOOL inGame;
          @end

          #endif
          EOF

      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'SWIFTEOF'
          #import "xzx_core.h"
          #import "Core/LuaExecutor.h"
          #import "XZXMainViewController.h"
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <objc/runtime.h>

          static XZXCore *sharedCore = nil;

          @interface XZXCore ()
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @property (nonatomic, strong) NSTimer  *watchdogTimer;
          @end

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ sharedCore = [[self alloc] init]; });
              return sharedCore;
          }

          - (instancetype)init {
              self = [super init];
              if (self) { _overlayWindow = nil; _isInitialized = NO; _inGame = NO; }
              return self;
          }

          - (void)initialize {
              if (_isInitialized) return;
              _isInitialized = YES;
              InitLua();
              NSLog(@"[XZX] Lua initialized");
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(5.0 * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{ [self pollForGameState]; });
          }

          - (void)pollForGameState {
              if (_inGame) return;
              if ([self isMenuVisible]) {
                  NSLog(@"[XZX] Menu visible, waiting...");
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)),
                                 dispatch_get_main_queue(), ^{ [self pollForGameState]; });
              } else {
                  NSLog(@"[XZX] Game detected — showing overlay");
                  _inGame = YES;
                  [self showOverlay];
                  [self startWatchdog];
              }
          }

          - (BOOL)isMenuVisible {
              @try {
                  for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                      if (![scene isKindOfClass:[UIWindowScene class]]) continue;
                      for (UIWindow *window in ((UIWindowScene *)scene).windows) {
                          if (window == _overlayWindow) continue;
                          if ([self viewHasVisibleWebView:window]) return YES;
                      }
                  }
              } @catch (NSException *e) {}
              return NO;
          }

          - (BOOL)viewHasVisibleWebView:(UIView *)view {
              @try {
                  if (view.isHidden || view.alpha < 0.01f) return NO;
                  if ([view isKindOfClass:[WKWebView class]] &&
                      view.bounds.size.width > 50 && view.bounds.size.height > 50) {
                      NSLog(@"[XZX] WKWebView found: %@", NSStringFromCGRect(view.frame));
                      return YES;
                  }
                  NSString *cn = NSStringFromClass([view class]);
                  if (([cn containsString:@"WKWeb"] || [cn containsString:@"WebView"]) &&
                      view.bounds.size.width > 50) {
                      NSLog(@"[XZX] WebView subclass: %@", cn);
                      return YES;
                  }
                  for (UIView *sub in view.subviews) {
                      if ([self viewHasVisibleWebView:sub]) return YES;
                  }
              } @catch (NSException *e) {}
              return NO;
          }

          - (void)startWatchdog {
              [_watchdogTimer invalidate];
              _watchdogTimer = [NSTimer scheduledTimerWithTimeInterval:3.0
                                                                target:self
                                                              selector:@selector(watchdogTick)
                                                              userInfo:nil
                                                               repeats:YES];
          }

          - (void)watchdogTick {
              if ([self isMenuVisible]) {
                  if (_inGame) {
                      NSLog(@"[XZX] Menu reappeared — hiding overlay");
                      _inGame = NO;
                      [self hideOverlay];
                      [_watchdogTimer invalidate];
                      _watchdogTimer = nil;
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)),
                                     dispatch_get_main_queue(), ^{ [self pollForGameState]; });
                  }
                  return;
              }
              if (!_overlayWindow || _overlayWindow.hidden) {
                  NSLog(@"[XZX] Watchdog: rebuilding overlay");
                  _overlayWindow = nil;
                  [self showOverlay];
              }
          }

          - (void)showOverlay {
              if (_overlayWindow && !_overlayWindow.hidden) return;
              UIWindowScene *scene = nil;
              for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]] &&
                      s.activationState == UISceneActivationStateForegroundActive) {
                      scene = (UIWindowScene *)s; break;
                  }
              }
              if (!scene) {
                  for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                      if ([s isKindOfClass:[UIWindowScene class]]) { scene = (UIWindowScene *)s; break; }
                  }
              }
              if (!scene) { NSLog(@"[XZX] No scene"); return; }
              if (_overlayWindow && _overlayWindow.windowScene != scene) _overlayWindow = nil;
              if (!_overlayWindow) {
                  XZXMainViewController *vc = [[XZXMainViewController alloc] init];
                  _overlayWindow = [[UIWindow alloc] initWithWindowScene:scene];
                  _overlayWindow.windowLevel = UIWindowLevelAlert + 1;
                  _overlayWindow.backgroundColor = [UIColor clearColor];
                  _overlayWindow.rootViewController = vc;
              }
              _overlayWindow.hidden = NO;
              [_overlayWindow makeKeyAndVisible];
              NSLog(@"[XZX] Overlay shown");
          }

          - (void)hideOverlay {
              _overlayWindow.hidden = YES;
              NSLog(@"[XZX] Overlay hidden");
          }

          - (BOOL)isOverlayVisible { return _overlayWindow && !_overlayWindow.hidden; }
          - (BOOL)isInGame { return _inGame; }

          @end
          SWIFTEOF

      # ----- Stub files (minimal to satisfy linker) -----
      - name: Create stub files
        run: |
          cat > injector/dylib/xzx_hooks.h << 'EOF'
          #ifndef XZX_HOOKS_H
          #define XZX_HOOKS_H
          #include <stdbool.h>
          void hook_roblox_functions(void);
          void unhook_roblox_functions(void);
          void install_hook(void *target, void *replacement, void **original);
          void notify_game_joined(void);
          bool isPlayerInGame(void);
          #endif
          EOF
          cat > injector/dylib/xzx_hooks.m << 'EOF'
          #import "xzx_hooks.h"
          #import "xzx_core.h"
          #import <mach/mach.h>
          #import <mach-o/dyld.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          static void *original_methods[128];
          static int method_count = 0;
          static BOOL hooks_active = NO;
          void notify_game_joined(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (![[XZXCore shared] isInGame]) [[XZXCore shared] showOverlay];
              });
          }
          void install_hook(void *target, void *replacement, void **original) {}
          void hook_roblox_functions(void) {}
          void unhook_roblox_functions(void) {}
          bool isPlayerInGame(void) { return [[XZXCore shared] isInGame]; }
          EOF
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "xzx_core.h"
          __attribute__((constructor))
          static void entry() {
              dispatch_async(dispatch_get_main_queue(), ^{ [[XZXCore shared] initialize]; });
          }
          EOF
          # Additional stubs for other headers (antidetection, etc.) – empty implementations
          for stub in xzx_injection_randomizer xzx_obfuscator xzx_antidetection xzx_ban_protection xzx_hook_manager xzx_physics_bypass xzx_memory_obfuscator xzx_security xzx_functions; do
            echo "@interface ${stub} : NSObject @end @implementation ${stub} @end" > injector/dylib/${stub}.m
            echo "#import <Foundation/Foundation.h> @interface ${stub} : NSObject @end" > injector/dylib/${stub}.h
          done

      # ----- Compilation -----
      - name: Compile Objective-C files
        run: |
          mkdir -p build
          FILES="injector/dylib/entry.m injector/dylib/xzx_core.m injector/dylib/xzx_hooks.m XZX/UI/XZXMainViewController.m"
          for stub in injector/dylib/xzx_*.m; do
            if [ "$stub" != "injector/dylib/xzx_core.m" ] && [ "$stub" != "injector/dylib/xzx_hooks.m" ] && [ "$stub" != "injector/dylib/xzx_uibridge.m" ]; then
              FILES="$FILES $stub"
            fi
          done
          for file in $FILES; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang -c \
                -I./injector/dylib -I./injector/dylib/Core -I./XZX/UI -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/$(basename "$file" .m).o" "$file" -target arm64-apple-ios15.0
            fi
          done

      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang++ -c -std=c++11 \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/$(basename "$file" .mm).o" "$file" -target arm64-apple-ios15.0
            fi
          done

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework WebKit \
            -framework QuartzCore -framework Metal \
            -L${{ env.LUA_LIB_DIR }} -Wl,-force_load,${{ env.LUA_LIB_DIR }}/liblua.a \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -undefined dynamic_lookup \
            -o build/executor.dylib build/*.o -lc++ -target arm64-apple-ios15.0
          echo "✅ Dylib compiled"

      - name: Extract and modify IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib --all-yes @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          cd extracted && zip -qr ../XZX.ipa Payload/ && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          if-no-files-found: error
          retention-days: 90
