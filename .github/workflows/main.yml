              private func saveTabs() {
                  if let encoded = try? JSONEncoder().encode(tabs) {
                      userDefaults.set(encoded, forKey: tabsKey)
                  }
              }
              private func loadTabs() {
                  if let data = userDefaults.data(forKey: tabsKey),
                     let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) {
                      tabs = decoded
                  }
              }
              private func saveSaved() {
                  if let encoded = try? JSONEncoder().encode(savedScripts) {
                      userDefaults.set(encoded, forKey: savedKey)
                  }
              }
              private func loadSaved() {
                  if let data = userDefaults.data(forKey: savedKey),
                     let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) {
                      savedScripts = decoded
                  }
              }
          }
          EOF
      
      - name: Create NeonWindow.swift
        run: |
          cat > XZX/UI/NeonWindow.swift << 'EOF'
          import UIKit
          public class NeonWindow: UIView {
              private let gradientLayer = CAGradientLayer()
              private var dragStartPoint: CGPoint?
              private var dragStartFrame: CGRect?
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  setup()
                  setupDragging()
              }
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  setup()
                  setupDragging()
              }
              private func setup() {
                  backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.95)
                  layer.cornerRadius = 18
                  layer.masksToBounds = true
                  gradientLayer.frame = bounds
                  gradientLayer.colors = [
                      UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor,
                      UIColor(red: 0.45, green: 0.25, blue: 0.8, alpha: 1).cgColor,
                      UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor
                  ]
                  gradientLayer.locations = [0, 0.5, 1]
                  gradientLayer.startPoint = CGPoint(x: 0, y: 0)
                  gradientLayer.endPoint = CGPoint(x: 1, y: 1)
                  layer.addSublayer(gradientLayer)
                  let animation = CABasicAnimation(keyPath: "locations")
                  animation.fromValue = [0, 0.5, 1]
                  animation.toValue = [0.2, 0.7, 1.2]
                  animation.duration = 3
                  animation.autoreverses = true
                  animation.repeatCount = .infinity
                  gradientLayer.add(animation, forKey: "glowAnimation")
                  layer.shadowColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor
                  layer.shadowOpacity = 0.8
                  layer.shadowRadius = 25
                  layer.shadowOffset = .zero
              }
              private func setupDragging() {
                  let panGesture = UIPanGestureRecognizer(target: self, action: #selector(handleDrag(_:)))
                  addGestureRecognizer(panGesture)
              }
              @objc private func handleDrag(_ gesture: UIPanGestureRecognizer) {
                  switch gesture.state {
                  case .began:
                      dragStartPoint = gesture.location(in: superview)
                      dragStartFrame = frame
                  case .changed:
                      guard let startPoint = dragStartPoint,
                            let startFrame = dragStartFrame else { return }
                      let translation = gesture.location(in: superview)
                      let dx = translation.x - startPoint.x
                      let dy = translation.y - startPoint.y
                      frame = CGRect(
                          x: startFrame.origin.x + dx,
                          y: startFrame.origin.y + dy,
                          width: startFrame.width,
                          height: startFrame.height
                      )
                  default:
                      dragStartPoint = nil
                      dragStartFrame = nil
                  }
              }
              public override func layoutSubviews() {
                  super.layoutSubviews()
                  gradientLayer.frame = bounds
              }
          }
          EOF
      
      - name: Create SidebarView.swift
        run: |
          cat > XZX/UI/SidebarView.swift << 'EOF'
          import UIKit
          public class SidebarView: UIView {
              public var buttons: [UIButton] = []
              public var onTabSelected: ((Int) -> Void)?
              private let items = [
                  ("📝", "Editor"),
                  ("🌐", "Hub"),
                  ("📌", "Tabs"),
                  ("💾", "Saved"),
                  ("⚙️", "Settings")
              ]
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  build()
              }
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  build()
              }
              private func build() {
                  backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9)
                  layer.cornerRadius = 12
                  for i in 0..<items.count {
                      let btn = createButton(title: "\(items[i].0) \(items[i].1)", tag: i)
                      btn.frame = CGRect(x: 10, y: 20 + (i * 55), width: 160, height: 45)
                      addSubview(btn)
                      buttons.append(btn)
                  }
                  animateButton(buttons[0])
              }
              private func createButton(title: String, tag: Int) -> UIButton {
                  let btn = UIButton(type: .system)
                  btn.setTitle(title, for: .normal)
                  btn.setTitleColor(.white, for: .normal)
                  btn.titleLabel?.font = .systemFont(ofSize: 14, weight: .medium)
                  btn.backgroundColor = UIColor(red: 0.16, green: 0.14, blue: 0.22, alpha: 1)
                  btn.layer.cornerRadius = 10
                  btn.tag = tag
                  btn.addTarget(self, action: #selector(buttonTapped(_:)), for: .touchUpInside)
                  btn.layer.shadowColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.5).cgColor
                  btn.layer.shadowOffset = .zero
                  btn.layer.shadowRadius = 5
                  btn.layer.shadowOpacity = 0
                  return btn
              }
              private func animateButton(_ button: UIButton) {
                  let animation = CABasicAnimation(keyPath: "shadowOpacity")
                  animation.fromValue = 0
                  animation.toValue = 0.8
                  animation.duration = 1.5
                  animation.autoreverses = true
                  animation.repeatCount = .infinity
                  button.layer.add(animation, forKey: "buttonGlow")
              }
              @objc private func buttonTapped(_ sender: UIButton) {
                  buttons.forEach { btn in
                      btn.backgroundColor = UIColor(red: 0.16, green: 0.14, blue: 0.22, alpha: 1)
                      btn.layer.removeAnimation(forKey: "buttonGlow")
                      btn.layer.shadowOpacity = 0
                  }
                  sender.backgroundColor = UIColor(red: 0.25, green: 0.2, blue: 0.35, alpha: 1)
                  animateButton(sender)
                  onTabSelected?(sender.tag)
              }
          }
          EOF
      
