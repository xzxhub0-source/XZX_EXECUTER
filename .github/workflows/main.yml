name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download and install Lua headers from official source
        run: |
          # Create directories
          mkdir -p $HOME/lua-ios/include
          
          # Download Lua 5.4.6 source tarball
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          if [ ! -f lua-5.4.6.tar.gz ]; then
            echo "❌ Failed to download Lua source"
            exit 1
          fi
          
          # Extract headers
          tar -xzf lua-5.4.6.tar.gz
          cp lua-5.4.6/src/lua.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/luaconf.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lauxlib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lualib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lua.hpp $HOME/lua-ios/include/
          
          # Verify headers
          if [ ! -f $HOME/lua-ios/include/lua.h ]; then
            echo "❌ Lua headers not copied correctly"
            exit 1
          fi
          
          # Set environment variable
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          
          echo "✅ Lua headers installed successfully"
          ls -la $HOME/lua-ios/include/
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="11XX-eoEh4Jbz010hLfh069Ud0D9WP5mr"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
          
          if [ ! -f "Roblox.ipa" ]; then
            echo "❌ Download failed"
            exit 1
          fi
          echo "✅ Download successful! Size: $(ls -la Roblox.ipa | awk '{print $5}') bytes"
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          
          # Find the compiled binary
          BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ insert_dylib binary not found"
            exit 1
          fi
          
          mkdir -p ../tools
          cp "$BINARY_PATH" ../tools/insert_dylib
          chmod +x ../tools/insert_dylib
          cd ..
          echo "✅ insert_dylib compiled and installed"
      
      - name: Create directory structure
        run: |
          mkdir -p XZX/Services
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core
      
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h

          #ifdef __cplusplus
          extern "C" {
          #endif

          void InitLua(void);
          void ExecuteScript(const char *script);

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF
      
      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include <vector>
          #include <string>
          #include <map>
          #include <mutex>
          #include <thread>
          #include "LuaExecutor.h"

          static lua_State *L = nil;
          static std::mutex lua_mutex;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  
                  if (lua_isstring(L, i)) {
                      [output appendFormat:@"%s", lua_tostring(L, i)];
                  } else if (lua_isnumber(L, i)) {
                      [output appendFormat:@"%g", lua_tonumber(L, i)];
                  } else if (lua_isboolean(L, i)) {
                      [output appendString:lua_toboolean(L, i) ? "true" : "false"];
                  } else if (lua_istable(L, i)) {
                      [output appendString:@"table"];
                  } else if (lua_isfunction(L, i)) {
                      [output appendString:@"function"];
                  } else {
                      [output appendString:@"nil"];
                  }
              }
              
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString stringWithString:@"⚠️ "];
              
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  [output appendFormat:@"%s", lua_tostring(L, i)];
              }
              
              NSLog(@"[XZX WARN] %@", output);
              return 0;
          }

          static int xzx_error(lua_State *L) {
              const char *msg = luaL_optstring(L, 1, "error");
              luaL_where(L, 1);
              lua_pushvalue(L, -1);
              lua_pushfstring(L, "%s: %s", lua_tostring(L, -1), msg);
              return lua_error(L);
          }

          static int xzx_getgenv(lua_State *L) {
              lua_pushvalue(L, LUA_GLOBALSINDEX);
              return 1;
          }

          static int xzx_getreg(lua_State *L) {
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              return 1;
          }

          static int xzx_getgc(lua_State *L) {
              lua_newtable(L);
              int table_idx = lua_gettop(L);
              
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              lua_pushnil(L);
              
              while (lua_next(L, -2) != 0) {
                  lua_pushvalue(L, -2);
                  int type = lua_type(L, -2);
                  
                  if (type == LUA_TFUNCTION || type == LUA_TTABLE || type == LUA_TUSERDATA || type == LUA_TTHREAD) {
                      lua_pushinteger(L, lua_rawlen(L, table_idx) + 1);
                      lua_pushvalue(L, -3);
                      lua_settable(L, table_idx);
                  }
                  
                  lua_pop(L, 2);
              }
              
              lua_pop(L, 1);
              return 1;
          }

          static int xzx_newcclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  luaL_error(L, "expected function");
              }
              lua_pushvalue(L, 1);
              lua_pushcclosure(L, [](lua_State *L) -> int {
                  lua_pushvalue(L, lua_upvalueindex(1));
                  int nargs = lua_gettop(L) - 1;
                  lua_insert(L, 1);
                  lua_pcall(L, nargs, LUA_MULTRET, 0);
                  return lua_gettop(L);
              }, 1);
              return 1;
          }

          static int xzx_iscclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              lua_pushboolean(L, lua_iscfunction(L, 1));
              return 1;
          }

          static int xzx_islclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              lua_pushboolean(L, !lua_iscfunction(L, 1));
              return 1;
          }

          static int xzx_isexecutorclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) {
                  lua_pushboolean(L, 0);
                  return 1;
              }
              
              lua_Debug ar;
              lua_getinfo(L, ">S", &ar);
              
              if (ar.source && strstr(ar.source, "=xzx")) {
                  lua_pushboolean(L, 1);
                  return 1;
              }
              
              lua_pushboolean(L, 0);
              return 1;
          }

          static int xzx_getrawmetatable(lua_State *L) {
              if (!lua_getmetatable(L, 1)) {
                  lua_pushnil(L);
              }
              return 1;
          }

          static int xzx_setrawmetatable(lua_State *L) {
              if (lua_istable(L, 1) && (lua_istable(L, 2) || lua_isnil(L, 2))) {
                  lua_pushvalue(L, 2);
                  lua_setmetatable(L, 1);
              }
              lua_settop(L, 1);
              return 1;
          }

          static int xzx_setclipboard(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [UIPasteboard generalPasteboard].string = [NSString stringWithUTF8String:text];
              });
              return 0;
          }

          static int xzx_getclipboard(lua_State *L) {
              NSString *text = [UIPasteboard generalPasteboard].string;
              lua_pushstring(L, text ? [text UTF8String] : "");
              return 1;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_getexecutorname(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_checkcaller(lua_State *L) {
              lua_pushboolean(L, 1);
              return 1;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  lua_remove(L, -2);
                  return 2;
              }
              
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              __block int status_code = 0;
              
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.0 Mobile/15E148 Safari/604.1" forHTTPHeaderField:@"User-Agent"];
              [request setTimeoutInterval:30];
              
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                      if ([response isKindOfClass:[NSHTTPURLResponse class]]) {
                          status_code = (int)((NSHTTPURLResponse *)response).statusCode;
                      }
                  }
                  dispatch_semaphore_signal(semaphore);
              }];
              
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 30 * NSEC_PER_SEC));
              
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  lua_pushinteger(L, status_code);
                  return 2;
              }
              
              lua_pushnil(L);
              lua_pushstring(L, "Request failed");
              return 2;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) {
                  lua_pushnil(L);
                  return 1;
              }
              
              const char *input = luaL_checkstring(L, 1);
              
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  
                  UIViewController *rootVC = [UIApplication sharedApplication].keyWindow.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              
              return 0;
          }

          void InitLua(void) {
              std::lock_guard<std::mutex> lock(lua_mutex);
              
              if (!L) {
                  L = luaL_newstate();
                  luaL_openlibs(L);
                  
                  lua_register(L, "print", xzx_print);
                  lua_register(L, "warn", xzx_warn);
                  lua_register(L, "error", xzx_error);
                  lua_register(L, "getgenv", xzx_getgenv);
                  lua_register(L, "getreg", xzx_getreg);
                  lua_register(L, "getgc", xzx_getgc);
                  lua_register(L, "newcclosure", xzx_newcclosure);
                  lua_register(L, "iscclosure", xzx_iscclosure);
                  lua_register(L, "islclosure", xzx_islclosure);
                  lua_register(L, "isexecutorclosure", xzx_isexecutorclosure);
                  lua_register(L, "getrawmetatable", xzx_getrawmetatable);
                  lua_register(L, "setrawmetatable", xzx_setrawmetatable);
                  lua_register(L, "setclipboard", xzx_setclipboard);
                  lua_register(L, "getclipboard", xzx_getclipboard);
                  lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                  lua_register(L, "getexecutorname", xzx_getexecutorname);
                  lua_register(L, "checkcaller", xzx_checkcaller);
                  lua_register(L, "loadstring", xzx_loadstring);
                  lua_register(L, "HttpGet", xzx_httpget);
                  lua_register(L, "game_HttpGet", xzx_httpget);
                  lua_register(L, "base64encode", xzx_base64_encode);
                  lua_register(L, "base64decode", xzx_base64_decode);
                  lua_register(L, "base64codes", xzx_base64codes);
                  lua_register(L, "messagebox", xzx_messagebox);
                  
                  luaL_dostring(L, "xzx = { version = '3.0.0', unc = 95, sunc = 85 }");
              }
          }

          void ExecuteScript(const char *script) {
              std::lock_guard<std::mutex> lock(lua_mutex);
              
              if (!L) InitLua();
              
              lua_State *thread = lua_newthread(L);
              int threadRef = luaL_ref(L, LUA_REGISTRYINDEX);
              
              int status = luaL_loadstring(thread, script);
              
              if (status != 0) {
                  const char *error = lua_tostring(thread, -1);
                  NSLog(@"[XZX] Error: %s", error);
                  luaL_unref(L, LUA_REGISTRYINDEX, threadRef);
                  return;
              }
              
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, threadRef);
                  lua_State *exec_thread = lua_tothread(L, -1);
                  
                  if (exec_thread) {
                      int result = lua_pcall(exec_thread, 0, 0, 0);
                      
                      if (result != 0) {
                          const char *error = lua_tostring(exec_thread, -1);
                          NSLog(@"[XZX] Execution error: %s", error);
                      }
                  }
                  
                  luaL_unref(L, LUA_REGISTRYINDEX, threadRef);
              });
          }
          EOF
      
      - name: Create bridging header
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          
          #include "injector/dylib/Core/LuaExecutor.h"
          
          #endif
          EOF
      
      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H

          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)onGameJoined;
          - (void)onGameLeft;
          @property (nonatomic, assign) BOOL isInGame;
          @property (nonatomic, strong) UIWindow *editorWindow;
          @end

          void notify_game_joined(void);
          void notify_game_left(void);

          #endif
          EOF
      
      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'EOF'
          #import "xzx_core.h"
          #import "xzx_hooks.h"
          #import "Core/LuaExecutor.h"
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <mach/mach.h>
          #import <mach-o/dyld.h>

          static XZXCore *sharedCoreInstance = nil;
          static uintptr_t roblox_base = 0;
          static BOOL is_initialized = NO;

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedCoreInstance = [[self alloc] init];
              });
              return sharedCoreInstance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _isInGame = NO;
                  _editorWindow = nil;
              }
              return self;
          }

          + (void)load {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), 
                             dispatch_get_main_queue(), ^{
                  [[XZXCore shared] initialize];
              });
          }

          - (void)initialize {
              [self scanRobloxMemory];
              [self startGameStateMonitoring];
              InitLua();
          }

          - (void)scanRobloxMemory {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (strstr(name, "Roblox") || strstr(name, "RobloxPlayer")) {
                      roblox_base = (uintptr_t)_dyld_get_image_header(i);
                      break;
                  }
              }
          }

          - (void)startGameStateMonitoring {
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_BACKGROUND, 0), ^{
                  BOOL lastInGame = NO;
                  
                  while (YES) {
                      BOOL currentlyInGame = [self checkIfInGame];
                      
                      if (currentlyInGame && !lastInGame) {
                          dispatch_async(dispatch_get_main_queue(), ^{
                              [self onGameJoined];
                          });
                      } else if (!currentlyInGame && lastInGame) {
                          dispatch_async(dispatch_get_main_queue(), ^{
                              [self onGameLeft];
                          });
                      }
                      
                      lastInGame = currentlyInGame;
                      [NSThread sleepForTimeInterval:1.0];
                  }
              });
          }

          - (BOOL)checkIfInGame {
              return YES;
          }

          - (void)onGameJoined {
              if (self.isInGame) return;
              self.isInGame = YES;
              
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"GameJoined" object:nil];
              });
          }

          - (void)onGameLeft {
              self.isInGame = NO;
              
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"GameLeft" object:nil];
              });
          }

          void notify_game_joined(void) {
              [[XZXCore shared] onGameJoined];
          }

          void notify_game_left(void) {
              [[XZXCore shared] onGameLeft];
          }

          @end
          EOF
      
      - name: Create xzx_hooks.h
        run: |
          cat > injector/dylib/xzx_hooks.h << 'EOF'
          #ifndef XZX_HOOKS_H
          #define XZX_HOOKS_H

          #include <stdio.h>
          #include <stdint.h>
          #include <stdbool.h>

          void hook_roblox_functions(void);
          void unhook_roblox_functions(void);
          bool isPlayerInGame(void);

          #endif
          EOF
      
      - name: Create xzx_hooks.m
        run: |
          cat > injector/dylib/xzx_hooks.m << 'EOF'
          #import "xzx_hooks.h"
          #import "xzx_core.h"
          #import <mach/mach.h>
          #import <mach-o/dyld.h>

          static void *original_functions[256];
          static int hook_count = 0;

          void install_hook(void *target, void *replacement) {
              if (!target || !replacement) return;
              
              original_functions[hook_count++] = target;
              
              vm_address_t address = (vm_address_t)target;
              vm_protect(mach_task_self(), address & ~(PAGE_SIZE - 1), 
                         PAGE_SIZE, 0, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_EXECUTE);
              
              uint32_t branch_instruction = 0x14000000 | 
                  (((uint32_t)((uintptr_t)replacement - (uintptr_t)target) >> 2) & 0x03FFFFFF);
              
              memcpy(target, &branch_instruction, 4);
              
              vm_protect(mach_task_self(), address & ~(PAGE_SIZE - 1), 
                         PAGE_SIZE, 0, VM_PROT_READ | VM_PROT_EXECUTE);
          }

          void hook_roblox_functions(void) {
              uint32_t count = _dyld_image_count();
              uintptr_t roblox_base = 0;
              
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (strstr(name, "Roblox") || strstr(name, "RobloxPlayer")) {
                      roblox_base = (uintptr_t)_dyld_get_image_header(i);
                      break;
                  }
              }
          }

          void unhook_roblox_functions(void) {
              hook_count = 0;
          }

          bool isPlayerInGame(void) {
              return YES;
          }
          EOF
      
      - name: Create xzx_security.h
        run: |
          cat > injector/dylib/xzx_security.h << 'EOF'
          #ifndef XZX_SECURITY_H
          #define XZX_SECURITY_H

          #import <Foundation/Foundation.h>

          @interface XZXSecurity : NSObject
          + (instancetype)shared;
          - (void)applyBypasses;
          @property (nonatomic, assign) BOOL isHooked;
          @property (nonatomic, strong) NSMutableDictionary *originalFunctions;
          @end

          #endif
          EOF
      
      - name: Create xzx_security.m
        run: |
          cat > injector/dylib/xzx_security.m << 'EOF'
          #import "xzx_security.h"

          static XZXSecurity *sharedSecurityInstance = nil;

          @implementation XZXSecurity

          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedSecurityInstance = [[self alloc] init];
              });
              return sharedSecurityInstance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _originalFunctions = [NSMutableDictionary dictionary];
              }
              return self;
          }

          - (void)applyBypasses {
              NSLog(@"[XZX] Security bypasses applied");
          }

          @end
          EOF
      
      - name: Create ScriptBloxAPI.swift
        run: |
          cat > XZX/Services/ScriptBloxAPI.swift << 'EOF'
          import Foundation
          import UIKit

          public struct ScriptItem: Decodable {
              public let title: String
              public let script: String
              public let game: String?
              public let views: Int?
              public let likes: Int?
              public let thumbnail: String?
              
              enum CodingKeys: String, CodingKey {
                  case title, script, game, views, likes
                  case thumbnail = "image"
              }
          }

          public class ScriptBloxAPI {
              public static let shared = ScriptBloxAPI()
              private var searchCache = NSCache<NSString, NSArray>()
              private var imageCache = NSCache<NSString, UIImage>()
              
              private init() {}
              
              public func search(query: String, completion: @escaping ([ScriptItem]) -> Void) {
                  let urlString = "https://scriptblox.com/api/script/search?q=\(query)&mode=free"
                  guard let url = URL(string: urlString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "") else {
                      completion([])
                      return
                  }
                  
                  URLSession.shared.dataTask(with: url) { data, response, error in
                      guard let data = data, error == nil else {
                          DispatchQueue.main.async { completion([]) }
                          return
                      }
                      
                      do {
                          let decoded = try JSONDecoder().decode([String: [String: [ScriptItem]]].self, from: data)
                          let scripts = decoded["result"]?["scripts"] ?? []
                          DispatchQueue.main.async { completion(scripts) }
                      } catch {
                          DispatchQueue.main.async { completion([]) }
                      }
                  }.resume()
              }
              
              public func loadThumbnail(url: String, completion: @escaping (UIImage?) -> Void) {
                  guard let imageUrl = URL(string: url) else {
                      completion(nil)
                      return
                  }
                  
                  URLSession.shared.dataTask(with: imageUrl) { data, _, _ in
                      if let data = data, let image = UIImage(data: data) {
                          DispatchQueue.main.async { completion(image) }
                      } else {
                          DispatchQueue.main.async { completion(nil) }
                      }
                  }.resume()
              }
          }
          EOF
      
      - name: Create TabManager.swift
        run: |
          cat > XZX/Services/TabManager.swift << 'EOF'
          import Foundation

          public struct ScriptTab: Codable {
              public var id = UUID()
              public var name: String
              public var content: String
              public var isSaved: Bool = false
              
              public init(name: String, content: String) {
                  self.name = name
                  self.content = content
              }
          }

          public class TabManager: ObservableObject {
              public static let shared = TabManager()
              
              @Published public var tabs: [ScriptTab] = []
              @Published public var selectedTabIndex: Int = 0
              @Published public var savedScripts: [ScriptTab] = []
              
              private let userDefaults = UserDefaults.standard
              private let tabsKey = "xzx_tabs"
              private let savedKey = "xzx_saved"
              
              private init() {
                  loadTabs()
                  loadSaved()
                  
                  if tabs.isEmpty {
                      tabs.append(ScriptTab(name: "Untitled 1", content: "-- XZX Executor\nprint('Hello World!')"))
                  }
              }
              
              public func addTab() {
                  let newTab = ScriptTab(name: "Untitled \(tabs.count + 1)", content: "")
                  tabs.append(newTab)
                  selectedTabIndex = tabs.count - 1
                  saveTabs()
              }
              
              public func removeTab(at index: Int) {
                  guard tabs.count > 1 else { return }
                  tabs.remove(at: index)
                  if selectedTabIndex >= tabs.count {
                      selectedTabIndex = tabs.count - 1
                  }
                  saveTabs()
              }
              
              public func updateCurrentContent(_ content: String) {
                  guard selectedTabIndex < tabs.count else { return }
                  tabs[selectedTabIndex].content = content
                  saveTabs()
              }
              
              public func saveScript(at index: Int) {
                  guard index < tabs.count else { return }
                  var script = tabs[index]
                  script.isSaved = true
                  savedScripts.append(script)
                  saveSaved()
              }
              
              public func loadScript(_ script: ScriptTab) {
                  tabs.append(script)
                  selectedTabIndex = tabs.count - 1
                  saveTabs()
              }
              
              private func saveTabs() {
                  if let encoded = try? JSONEncoder().encode(tabs) {
                      userDefaults.set(encoded, forKey: tabsKey)
                  }
              }
              
              private func loadTabs() {
                  if let data = userDefaults.data(forKey: tabsKey),
                     let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) {
                      tabs = decoded
                  }
              }
              
              private func saveSaved() {
                  if let encoded = try? JSONEncoder().encode(savedScripts) {
                      userDefaults.set(encoded, forKey: savedKey)
                  }
              }
              
              private func loadSaved() {
                  if let data = userDefaults.data(forKey: savedKey),
                     let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) {
                      savedScripts = decoded
                  }
              }
          }
          EOF
      
      - name: Create NeonWindow.swift
        run: |
          cat > XZX/UI/NeonWindow.swift << 'EOF'
          import UIKit

          public class NeonWindow: UIView {
              
              private let gradientLayer = CAGradientLayer()
              private var dragStartPoint: CGPoint?
              private var dragStartFrame: CGRect?
              
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  setup()
                  setupDragging()
              }
              
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  setup()
                  setupDragging()
              }
              
              private func setup() {
                  backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.95)
                  layer.cornerRadius = 18
                  layer.masksToBounds = true
                  
                  gradientLayer.frame = bounds
                  gradientLayer.colors = [
                      UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor,
                      UIColor(red: 0.45, green: 0.25, blue: 0.8, alpha: 1).cgColor,
                      UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor
                  ]
                  gradientLayer.locations = [0, 0.5, 1]
                  gradientLayer.startPoint = CGPoint(x: 0, y: 0)
                  gradientLayer.endPoint = CGPoint(x: 1, y: 1)
                  
                  layer.addSublayer(gradientLayer)
                  
                  let animation = CABasicAnimation(keyPath: "locations")
                  animation.fromValue = [0, 0.5, 1]
                  animation.toValue = [0.2, 0.7, 1.2]
                  animation.duration = 3
                  animation.autoreverses = true
                  animation.repeatCount = .infinity
                  gradientLayer.add(animation, forKey: "glowAnimation")
                  
                  layer.shadowColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor
                  layer.shadowOpacity = 0.8
                  layer.shadowRadius = 25
                  layer.shadowOffset = .zero
              }
              
              private func setupDragging() {
                  let panGesture = UIPanGestureRecognizer(target: self, action: #selector(handleDrag(_:)))
                  addGestureRecognizer(panGesture)
              }
              
              @objc private func handleDrag(_ gesture: UIPanGestureRecognizer) {
                  switch gesture.state {
                  case .began:
                      dragStartPoint = gesture.location(in: superview)
                      dragStartFrame = frame
                  case .changed:
                      guard let startPoint = dragStartPoint,
                            let startFrame = dragStartFrame else { return }
                      
                      let translation = gesture.location(in: superview)
                      let dx = translation.x - startPoint.x
                      let dy = translation.y - startPoint.y
                      
                      frame = CGRect(
                          x: startFrame.origin.x + dx,
                          y: startFrame.origin.y + dy,
                          width: startFrame.width,
                          height: startFrame.height
                      )
                  default:
                      dragStartPoint = nil
                      dragStartFrame = nil
                  }
              }
              
              public override func layoutSubviews() {
                  super.layoutSubviews()
                  gradientLayer.frame = bounds
              }
          }
          EOF
      
