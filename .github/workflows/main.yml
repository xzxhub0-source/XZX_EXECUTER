name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download and install Lua headers
        run: |
          mkdir -p $HOME/lua-ios/include
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cp lua-5.4.6/src/lua.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/luaconf.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lauxlib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lualib.h $HOME/lua-ios/include/
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="12Aklt_7NQ6S6CEKtewn7k5ia8YJuJm9N"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          mkdir -p ../tools
          cp /Users/runner/Library/Developer/Xcode/DerivedData/insert_dylib-*/Build/Products/Release/insert_dylib ../tools/
          chmod +x ../tools/insert_dylib
          cd ..
      
      - name: Create directory structure
        run: |
          mkdir -p XZX/Services
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core
      
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h
          #ifdef __cplusplus
          extern "C" {
          #endif
          void InitLua(void);
          void ExecuteScript(const char *script);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
      
      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <vector>
          #include <string>
          #include <map>
          #include <mutex>
          #include <thread>
          #include "LuaExecutor.h"
          #import "xzx_antidetection.h"
          #import "xzx_ban_protection.h"
          #import "xzx_injection_randomizer.h"
          #import "xzx_hook_manager.h"

          static lua_State *L = nil;
          static std::mutex lua_mutex;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  if (lua_isstring(L, i)) [output appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [output appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [output appendString:(lua_toboolean(L, i) ? @"true" : @"false")];
                  else if (lua_istable(L, i)) [output appendString:@"table"];
                  else if (lua_isfunction(L, i)) [output appendString:@"function"];
                  else [output appendString:@"nil"];
              }
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [output appendString:@" "];
                  [output appendFormat:@"%s", lua_tostring(L, i)];
              }
              NSLog(@"[XZX WARN] %@", output);
              return 0;
          }

          static int xzx_error(lua_State *L) {
              const char *msg = luaL_optstring(L, 1, "error");
              luaL_where(L, 1);
              lua_pushvalue(L, -1);
              lua_pushfstring(L, "%s: %s", lua_tostring(L, -1), msg);
              return lua_error(L);
          }

          static int xzx_getgenv(lua_State *L) {
              lua_pushglobaltable(L);
              return 1;
          }

          static int xzx_getreg(lua_State *L) {
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              return 1;
          }

          static int xzx_getgc(lua_State *L) {
              lua_newtable(L);
              int table_idx = lua_gettop(L);
              lua_pushvalue(L, LUA_REGISTRYINDEX);
              lua_pushnil(L);
              while (lua_next(L, -2) != 0) {
                  lua_pushvalue(L, -2);
                  int type = lua_type(L, -2);
                  if (type == LUA_TFUNCTION || type == LUA_TTABLE || type == LUA_TUSERDATA || type == LUA_TTHREAD) {
                      lua_pushinteger(L, (int)lua_rawlen(L, table_idx) + 1);
                      lua_pushvalue(L, -3);
                      lua_settable(L, table_idx);
                  }
                  lua_pop(L, 2);
              }
              lua_pop(L, 1);
              return 1;
          }

          static int xzx_newcclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) luaL_error(L, "expected function");
              lua_pushvalue(L, 1);
              lua_pushcclosure(L, [](lua_State *L) -> int {
                  lua_pushvalue(L, lua_upvalueindex(1));
                  int nargs = lua_gettop(L) - 1;
                  lua_insert(L, 1);
                  lua_pcall(L, nargs, LUA_MULTRET, 0);
                  return lua_gettop(L);
              }, 1);
              return 1;
          }

          static int xzx_iscclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) { lua_pushboolean(L, 0); return 1; }
              lua_pushboolean(L, lua_iscfunction(L, 1));
              return 1;
          }

          static int xzx_islclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) { lua_pushboolean(L, 0); return 1; }
              lua_pushboolean(L, !lua_iscfunction(L, 1));
              return 1;
          }

          static int xzx_isexecutorclosure(lua_State *L) {
              if (!lua_isfunction(L, 1)) { lua_pushboolean(L, 0); return 1; }
              lua_Debug ar;
              lua_getinfo(L, ">S", &ar);
              if (ar.source && strstr(ar.source, "=xzx")) {
                  lua_pushboolean(L, 1);
                  return 1;
              }
              lua_pushboolean(L, 0);
              return 1;
          }

          static int xzx_hookfunction(lua_State *L) {
              if (!lua_isfunction(L, 1) || !lua_isfunction(L, 2)) luaL_error(L, "expected two functions");
              lua_pushvalue(L, 2);
              return 1;
          }

          static int xzx_clonefunction(lua_State *L) {
              if (!lua_isfunction(L, 1)) luaL_error(L, "expected function");
              lua_pushvalue(L, 1);
              return 1;
          }

          static int xzx_getrawmetatable(lua_State *L) {
              if (!lua_getmetatable(L, 1)) lua_pushnil(L);
              return 1;
          }

          static int xzx_setrawmetatable(lua_State *L) {
              if (lua_istable(L, 1) && (lua_istable(L, 2) || lua_isnil(L, 2))) {
                  lua_pushvalue(L, 2);
                  lua_setmetatable(L, 1);
              }
              lua_settop(L, 1);
              return 1;
          }

          static int xzx_setclipboard(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [UIPasteboard generalPasteboard].string = [NSString stringWithUTF8String:text];
              });
              return 0;
          }

          static int xzx_getclipboard(lua_State *L) {
              NSString *text = [UIPasteboard generalPasteboard].string;
              lua_pushstring(L, text ? [text UTF8String] : "");
              return 1;
          }

          static int xzx_identifyexecutor(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_getexecutorname(lua_State *L) {
              lua_pushstring(L, "XZX");
              return 1;
          }

          static int xzx_checkcaller(lua_State *L) {
              lua_pushboolean(L, 1);
              return 1;
          }

          static int xzx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              const char *chunkname = luaL_optstring(L, 2, "=xzx");
              int status = luaL_loadbuffer(L, code, strlen(code), chunkname);
              if (status != 0) {
                  lua_pushnil(L);
                  lua_pushstring(L, lua_tostring(L, -1));
                  lua_remove(L, -2);
                  return 2;
              }
              return 1;
          }

          static int xzx_httpget(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              [request setValue:@"Mozilla/5.0" forHTTPHeaderField:@"User-Agent"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  dispatch_semaphore_signal(semaphore);
              }];
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC));
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
                  return 1;
              }
              lua_pushnil(L);
              return 1;
          }

          static int xzx_base64_encode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [NSData dataWithBytes:data length:strlen(data)];
              NSString *encoded = [nsdata base64EncodedStringWithOptions:0];
              lua_pushstring(L, [encoded UTF8String]);
              return 1;
          }

          static int xzx_base64_decode(lua_State *L) {
              const char *data = luaL_checkstring(L, 1);
              NSData *nsdata = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:data] options:0];
              NSString *decoded = [[NSString alloc] initWithData:nsdata encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [decoded UTF8String]);
              return 1;
          }

          static int xzx_base64codes(lua_State *L) {
              if (lua_gettop(L) < 1) { lua_pushnil(L); return 1; }
              const char *input = luaL_checkstring(L, 1);
              NSData *data = [NSData dataWithBytes:input length:strlen(input)];
              NSString *encoded = [data base64EncodedStringWithOptions:0];
              NSData *decoded = [[NSData alloc] initWithBase64EncodedString:encoded options:0];
              NSString *result = [[NSString alloc] initWithData:decoded encoding:NSUTF8StringEncoding];
              lua_pushstring(L, [result UTF8String]);
              return 1;
          }

          static int xzx_messagebox(lua_State *L) {
              const char *text = luaL_checkstring(L, 1);
              const char *caption = luaL_optstring(L, 2, "XZX");
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:[NSString stringWithUTF8String:caption]
                                                                                 message:[NSString stringWithUTF8String:text]
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIWindowScene *windowScene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  UIViewController *rootVC = windowScene.windows.firstObject.rootViewController;
                  [rootVC presentViewController:alert animated:YES completion:nil];
              });
              return 0;
          }

          static int xzx_delay(lua_State *L) {
              double seconds = luaL_checknumber(L, 1);
              if (!lua_isfunction(L, 2)) luaL_error(L, "expected function");
              lua_pushvalue(L, 2);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(seconds * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          static int xzx_spawn(lua_State *L) {
              if (!lua_isfunction(L, 1)) luaL_error(L, "expected function");
              lua_pushvalue(L, 1);
              int ref = luaL_ref(L, LUA_REGISTRYINDEX);
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
                  lua_pcall(L, 0, 0, 0);
                  luaL_unref(L, LUA_REGISTRYINDEX, ref);
              });
              return 0;
          }

          void InitLua(void) {
              std::lock_guard<std::mutex> lock(lua_mutex);
              if (!L) {
                  L = luaL_newstate();
                  if (L) {
                      lua_register(L, "print", xzx_print);
                      lua_register(L, "warn", xzx_warn);
                      lua_register(L, "error", xzx_error);
                      lua_register(L, "getgenv", xzx_getgenv);
                      lua_register(L, "getreg", xzx_getreg);
                      lua_register(L, "getgc", xzx_getgc);
                      lua_register(L, "newcclosure", xzx_newcclosure);
                      lua_register(L, "iscclosure", xzx_iscclosure);
                      lua_register(L, "islclosure", xzx_islclosure);
                      lua_register(L, "isexecutorclosure", xzx_isexecutorclosure);
                      lua_register(L, "hookfunction", xzx_hookfunction);
                      lua_register(L, "clonefunction", xzx_clonefunction);
                      lua_register(L, "getrawmetatable", xzx_getrawmetatable);
                      lua_register(L, "setrawmetatable", xzx_setrawmetatable);
                      lua_register(L, "setclipboard", xzx_setclipboard);
                      lua_register(L, "getclipboard", xzx_getclipboard);
                      lua_register(L, "identifyexecutor", xzx_identifyexecutor);
                      lua_register(L, "getexecutorname", xzx_getexecutorname);
                      lua_register(L, "checkcaller", xzx_checkcaller);
                      lua_register(L, "loadstring", xzx_loadstring);
                      lua_register(L, "HttpGet", xzx_httpget);
                      lua_register(L, "game_HttpGet", xzx_httpget);
                      lua_register(L, "base64encode", xzx_base64_encode);
                      lua_register(L, "base64decode", xzx_base64_decode);
                      lua_register(L, "base64codes", xzx_base64codes);
                      lua_register(L, "messagebox", xzx_messagebox);
                      lua_register(L, "delay", xzx_delay);
                      lua_register(L, "spawn", xzx_spawn);
                      
                      lua_newtable(L);
                      lua_pushstring(L, "XZX");
                      lua_setfield(L, -2, "name");
                      lua_pushstring(L, "3.0.0");
                      lua_setfield(L, -2, "version");
                      lua_setglobal(L, "xzx");
                      
                      NSLog(@"[XZX] Lua initialized");
                  }
              }
          }

          void ExecuteScript(const char *script) {
              std::lock_guard<std::mutex> lock(lua_mutex);
              if (!L) InitLua();
              if (L && script && strlen(script) > 0) {
                  @try {
                      lua_State *thread = lua_newthread(L);
                      int threadRef = luaL_ref(L, LUA_REGISTRYINDEX);
                      int status = luaL_loadstring(thread, script);
                      if (status != 0) {
                          luaL_unref(L, LUA_REGISTRYINDEX, threadRef);
                          return;
                      }
                      dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                          lua_rawgeti(L, LUA_REGISTRYINDEX, threadRef);
                          lua_State *exec_thread = lua_tothread(L, -1);
                          if (exec_thread) {
                              lua_pcall(exec_thread, 0, 0, 0);
                          }
                          luaL_unref(L, LUA_REGISTRYINDEX, threadRef);
                      });
                  } @catch (NSException *exception) {}
              }
          }
          EOF
      
      - name: Create bridging header
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include "injector/dylib/Core/LuaExecutor.h"
          #endif
          EOF
      
      - name: Create xzx_core.h
        run: |
          cat > injector/dylib/xzx_core.h << 'EOF'
          #ifndef XZX_CORE_H
          #define XZX_CORE_H
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface XZXCore : NSObject
          + (instancetype)shared;
          - (void)initialize;
          - (void)onGameJoined;
          - (void)onGameLeft;
          @property (nonatomic, assign) BOOL isInGame;
          @property (nonatomic, strong) UIWindow *editorWindow;
          @end
          void notify_game_joined(void);
          void notify_game_left(void);
          #endif
          EOF
      
      - name: Create xzx_core.m
        run: |
          cat > injector/dylib/xzx_core.m << 'EOF'
          #import "xzx_core.h"
          #import "xzx_antidetection.h"
          #import "xzx_ban_protection.h"
          #import "Core/LuaExecutor.h"
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static XZXCore *sharedCoreInstance = nil;

          @implementation XZXCore

          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedCoreInstance = [[self alloc] init];
              });
              return sharedCoreInstance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _isInGame = NO;
                  _editorWindow = nil;
              }
              return self;
          }

          + (void)load {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), 
                             dispatch_get_main_queue(), ^{
                  [[XZXCore shared] initialize];
              });
          }

          - (void)initialize {
              @try {
                  [[XZXAntiDetection shared] initializeProtection];
                  [[XZXBanProtection shared] protectAccount];
                  InitLua();
                  [self startGameStateMonitoring];
              } @catch (NSException *exception) {}
          }

          - (void)startGameStateMonitoring {
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_BACKGROUND, 0), ^{
                  @autoreleasepool {
                      BOOL lastInGame = NO;
                      while (YES) {
                          @try {
                              BOOL currentlyInGame = [self checkIfInGame];
                              if (currentlyInGame && !lastInGame) {
                                  dispatch_async(dispatch_get_main_queue(), ^{
                                      [self onGameJoined];
                                  });
                              } else if (!currentlyInGame && lastInGame) {
                                  dispatch_async(dispatch_get_main_queue(), ^{
                                      [self onGameLeft];
                                  });
                              }
                              lastInGame = currentlyInGame;
                          } @catch (NSException *exception) {}
                          [NSThread sleepForTimeInterval:1.0];
                      }
                  }
              });
          }

          - (BOOL)checkIfInGame {
              @try {
                  Class cls = NSClassFromString(@"RobloxDataModel");
                  if (cls) {
                      SEL sel = NSSelectorFromString(@"sharedDataModel");
                      if ([cls respondsToSelector:sel]) {
                          id dm = ((id(*)(id, SEL))objc_msgSend)(cls, sel);
                          if (dm) {
                              SEL placeSel = NSSelectorFromString(@"placeId");
                              if ([dm respondsToSelector:placeSel]) {
                                  id pid = ((id(*)(id, SEL))objc_msgSend)(dm, placeSel);
                                  return pid != nil;
                              }
                          }
                      }
                  }
              } @catch (NSException *exception) {}
              return NO;
          }

          - (void)onGameJoined {
              if (self.isInGame) return;
              self.isInGame = YES;
              [[XZXAntiDetection shared] randomizeInjectionPattern];
              [[XZXBanProtection shared] simulateHumanBehavior];
          }

          - (void)onGameLeft {
              self.isInGame = NO;
          }

          void notify_game_joined(void) {
              [[XZXCore shared] onGameJoined];
          }

          void notify_game_left(void) {
              [[XZXCore shared] onGameLeft];
          }

          @end
          EOF
      
      - name: Create xzx_antidetection.h
        run: |
          cat > injector/dylib/xzx_antidetection.h << 'EOF'
          #ifndef XZX_ANTIDETECTION_H
          #define XZX_ANTIDETECTION_H
          #import <Foundation/Foundation.h>
          @interface XZXAntiDetection : NSObject
          + (instancetype)shared;
          - (void)initializeProtection;
          - (void)randomizeInjectionPattern;
          - (void)cleanTraces;
          - (BOOL)isUnderInvestigation;
          - (void)emergencyShutdown;
          @property (nonatomic, assign) NSInteger currentStrikes;
          @property (nonatomic, assign) double banProbability;
          @end
          #endif
          EOF
      
      - name: Create xzx_antidetection.m (FIXED VERSION)
        run: |
          cat > injector/dylib/xzx_antidetection.m << 'EOF'
          #import "xzx_antidetection.h"
          #import <mach/mach.h>
          #import <mach-o/dyld.h>
          #import <dlfcn.h>
          #import <sys/sysctl.h>
          #import <unistd.h>

          static XZXAntiDetection *sharedAntiDetectionInstance = nil;

          @implementation XZXAntiDetection

          + (instancetype)shared {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedAntiDetectionInstance = [[self alloc] init];
              });
              return sharedAntiDetectionInstance;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _currentStrikes = 0;
                  _banProbability = 0.0;
              }
              return self;
          }

          - (void)initializeProtection {
              [self hideFromDyld];
              [self setupAntiDebug];
          }

          - (void)hideFromDyld {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (strstr(name, "executor.dylib")) {
                      uintptr_t header = (uintptr_t)_dyld_get_image_header(i);
                      size_t size = 0;
                      const uint8_t *cmd = (const uint8_t *)header + sizeof(struct mach_header_64);
                      for (int j = 0; j < ((struct mach_header_64 *)header)->ncmds; j++) {
                          struct load_command *lc = (struct load_command *)cmd;
                          if (lc->cmd == LC_SEGMENT_64) {
                              struct segment_command_64 *seg = (struct segment_command_64 *)cmd;
                              if (strcmp(seg->segname, "__TEXT") == 0) {
                                  size = seg->vmsize;
                                  break;
                              }
                          }
                          cmd += lc->cmdsize;
                      }
                      if (size > 0) {
                          vm_address_t addr = header;
                          vm_protect(mach_task_self(), addr & ~(PAGE_SIZE - 1), size + PAGE_SIZE, 0,
                                    VM_PROT_READ | VM_PROT_WRITE);
                          memset((void *)header, 0, 0x100);
                          vm_protect(mach_task_self(), addr & ~(PAGE_SIZE - 1), size + PAGE_SIZE, 0,
                                    VM_PROT_READ | VM_PROT_EXECUTE);
                      }
                      break;
                  }
              }
          }

          - (void)setupAntiDebug {
              void *handle = dlopen("/usr/lib/system/libsystem_kernel.dylib", RTLD_NOW);
              if (handle) {
                  void *ptrace = dlsym(handle, "ptrace");
                  if (ptrace) {
                      vm_address_t addr = (vm_address_t)ptrace;
                      vm_protect(mach_task_self(), addr & ~(PAGE_SIZE - 1), PAGE_SIZE, 0,
                                VM_PROT_READ | VM_PROT_WRITE);
                      uint32_t ret = 0x00000020;
                      memcpy(ptrace, &ret, 4);
                      vm_protect(mach_task_self(), addr & ~(PAGE_SIZE - 1), PAGE_SIZE, 0,
                                VM_PROT_READ | VM_PROT_EXECUTE);
                  }
