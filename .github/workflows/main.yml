          import Foundation
          import UIKit
          public struct ScriptItem: Decodable {
              public let title: String; public let script: String; public let game: String?; public let views: Int?; public let likes: Int?; public let thumbnail: String?
              enum CodingKeys: String, CodingKey { case title, script, game, views, likes; case thumbnail = "image" }
