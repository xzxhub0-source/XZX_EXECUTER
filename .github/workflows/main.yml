                          return
                      }
                      do {
                          let decoded = try JSONDecoder().decode([String: [String: [ScriptItem]]].self, from: data)
                          let scripts = decoded["result"]?["scripts"] ?? []
                          DispatchQueue.main.async { completion(scripts) }
                      } catch {
                          DispatchQueue.main.async { completion([]) }
                      }
                  }.resume()
              }
