name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download and install Lua headers from official source
        run: |
          mkdir -p $HOME/lua-ios/include
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          if [ ! -f lua-5.4.6.tar.gz ]; then
            echo "❌ Failed to download Lua source"
            exit 1
          fi
          tar -xzf lua-5.4.6.tar.gz
          cp lua-5.4.6/src/lua.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/luaconf.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lauxlib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lualib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lua.hpp $HOME/lua-ios/include/
          if [ ! -f $HOME/lua-ios/include/lua.h ]; then
            echo "❌ Lua headers not copied correctly"
            exit 1
          fi
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "✅ Lua headers installed successfully"
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="12rjbAAh6s1FVTAxXoVcqgZwC7j2JySH0"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
          if [ ! -f "Roblox.ipa" ]; then
            echo "❌ Download failed"
            exit 1
          fi
          echo "✅ Download successful!"
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ insert_dylib binary not found"
            exit 1
          fi
          mkdir -p ../tools
          cp "$BINARY_PATH" ../tools/insert_dylib
          chmod +x ../tools/insert_dylib
          cd ..
          echo "✅ insert_dylib compiled"
      
      - name: Compile Objective-C files to objects
        run: |
          mkdir -p build
          for file in injector/dylib/*.m; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .m)
              echo "Compiling $file..."
              xcrun -sdk iphoneos clang -c \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/${filename}.o" "$file" -target arm64-apple-ios15.0
              if [ $? -ne 0 ]; then exit 1; fi
            fi
          done
          echo "✅ Objective-C compilation complete"
      
      - name: Compile C++ files to objects
        run: |
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mm)
              echo "Compiling $file..."
              xcrun -sdk iphoneos clang++ -c -std=c++11 \
                -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} \
                -o "build/${filename}.o" "$file" -target arm64-apple-ios15.0
              if [ $? -ne 0 ]; then exit 1; fi
            fi
          done
          echo "✅ C++ compilation complete"
      
      - name: Compile Swift files into a single object file
        run: |
          echo "Compiling Swift files into a single object file..."
          
          # Collect Swift files
          SWIFT_FILES=$(find XZX -name "*.swift" -type f | tr '\n' ' ')
          echo "Swift files: $SWIFT_FILES"
          
          # Compile all Swift files into a single object file using incremental compilation
          xcrun -sdk iphoneos swiftc \
            -c \
            -module-name XZX \
            -import-objc-header XZX/XZX-Bridging-Header.h \
            -I . -I ./injector/dylib -I ./injector/dylib/Core -I ${{ env.LUA_INCLUDE_DIR }} \
            -target arm64-apple-ios15.0 \
            -o build/XZXSwift.o \
            $SWIFT_FILES
          
          if [ $? -ne 0 ]; then
            echo "❌ Swift compilation failed"
            exit 1
          fi
          echo "✅ Swift compilation complete"
          ls -la build/
      
      - name: Link all into final dylib
        run: |
          echo "Linking all object files..."
          
          # Collect all object files
          OBJECTS=$(find build -name "*.o" -type f | tr '\n' ' ')
          if [ -z "$OBJECTS" ]; then
            echo "❌ No object files found"
            exit 1
          fi
          
          echo "Linking objects: $OBJECTS"
          
          xcrun -sdk iphoneos clang++ -shared \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework WebKit \
            -I ./injector/dylib -I ./injector/dylib/Core -I ${{ env.LUA_INCLUDE_DIR }} \
            -undefined dynamic_lookup \
            -o build/executor.dylib \
            $OBJECTS \
            -lstdc++ -target arm64-apple-ios15.0
          
          if [ ! -f "build/executor.dylib" ]; then
            echo "❌ Linking failed"
            exit 1
          fi
          echo "✅ Dylib compiled successfully"
          file build/executor.dylib
      
      - name: Extract and modify IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          if [ ! -d "extracted/Payload/Roblox.app" ]; then
            echo "❌ Failed to extract IPA"
            exit 1
          fi
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib @executable_path/executor.dylib \
            extracted/Payload/Roblox.app/Roblox \
            extracted/Payload/Roblox.app/Roblox_patched --all-yes
          if [ ! -f "extracted/Payload/Roblox.app/Roblox_patched" ]; then
            echo "❌ Dylib injection failed"
            exit 1
          fi
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          echo "✅ Roblox modification complete"
      
      - name: Change app name to XZX
        run: |
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName XZX" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string XZX" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName XZX" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string XZX" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          echo "✅ App name changed"
      
      - name: Repackage IPA
        run: |
          cd extracted
          zip -qr ../XZX.ipa Payload/
          cd ..
          echo "✅ IPA created: XZX.ipa"
          ls -la XZX.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: ${{ github.workspace }}/XZX.ipa
          if-no-files-found: error
          retention-days: 90
