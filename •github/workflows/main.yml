name: Build SERFIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown

      - name: Download IPA
        run: |
          pipx run gdown https://drive.google.com/uc?id=16uaCXW9O3SmjYEPjc1wRhIj-o2NAXqdW -O Roblox.ipa

      - name: Build insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          mkdir -p ../tools
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release CONFIGURATION_BUILD_DIR=$(pwd)/../tools
          chmod +x ../tools/insert_dylib
          cd ..

      - name: Build Lua
        run: |
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          tar -xzf lua-5.4.6.tar.gz
          cd lua-5.4.6
          for f in src/*.c; do
            n=$(basename "$f" .c)
            if [ "$n" != "lua" ] && [ "$n" != "luac" ]; then
              xcrun -sdk iphoneos clang -c -O2 -DLUA_USE_IOS -arch arm64 -target arm64-apple-ios15.0 -I src -o "src/$n.o" "$f"
            fi
          done
          ar rcs $HOME/lua-ios/liblua.a src/*.o
          mkdir -p $HOME/lua-ios/include
          cp src/lua.h src/luaconf.h src/lauxlib.h src/lualib.h $HOME/lua-ios/include/
          cd ..
          echo "LUA_INCLUDE=$HOME/lua-ios/include" >> $GITHUB_ENV
          echo "LUA_LIB=$HOME/lua-ios" >> $GITHUB_ENV

      - name: Make dirs
        run: mkdir -p build SERFIX/UI injector/dylib/Core

      - name: Write Lua header
        run: |
          cat > injector/dylib/Core/SRFXLua.h << 'EOF'
          #ifndef SRFXLua_h
          #define SRFXLua_h
          struct lua_State;
          #ifdef __cplusplus
          extern "C" {
          #endif
          void SRFXLuaInit(void);
          void SRFXLuaExecute(const char *script);
          void SRFXLuaRegister(const char *name, int (*func)(struct lua_State*));
          struct lua_State* SRFXLuaState(void);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Write Lua implementation
        run: |
          cat > injector/dylib/Core/SRFXLua.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include <pthread.h>
          #include "SRFXLua.h"

          static lua_State *L = nil;
          static pthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;

          static int srfx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *s = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [s appendString:@" "];
                  if (lua_isstring(L, i)) [s appendFormat:@"%s", lua_tostring(L, i)];
                  else if (lua_isnumber(L, i)) [s appendFormat:@"%g", lua_tonumber(L, i)];
                  else if (lua_isboolean(L, i)) [s appendString:lua_toboolean(L, i) ? @"true" : @"false"];
                  else if (lua_istable(L, i)) [s appendString:@"table"];
                  else if (lua_isfunction(L, i)) [s appendString:@"function"];
                  else [s appendString:@"nil"];
              }
              NSLog(@"[SERFIX] %@", s);
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] postNotificationName:@"SRFXPrint" object:s];
              });
              return 0;
          }

          static int srfx_warn(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *s = [NSMutableString string];
              for (int i = 1; i <= n; i++) {
                  if (i > 1) [s appendString:@" "];
                  if (lua_isstring(L, i)) [s appendFormat:@"%s", lua_tostring(L, i)];
              }
              NSLog(@"[SERFIX WARN] %@", s);
              return 0;
          }

          static int srfx_getscript(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              __block NSString *res = nil;
              __block BOOL done = NO;
              NSURLRequest *req = [NSURLRequest requestWithURL:[NSURL URLWithString:[NSString stringWithUTF8String:url]]];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:req completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d && !e) res = [[NSString alloc] initWithData:d encoding:NSUTF8StringEncoding];
                  done = YES;
              }];
              [task resume];
              NSDate *timeout = [NSDate dateWithTimeIntervalSinceNow:10.0];
              while (!done && [timeout timeIntervalSinceNow] > 0) {
                  [[NSRunLoop currentRunLoop] runMode:NSDefaultRunLoopMode beforeDate:[NSDate dateWithTimeIntervalSinceNow:0.1]];
              }
              if (res) lua_pushstring(L, [res UTF8String]);
              else lua_pushnil(L);
              return 1;
          }

          static int srfx_loadstring(lua_State *L) {
              const char *code = luaL_checkstring(L, 1);
              int s = luaL_loadstring(L, code);
              if (s != LUA_OK) { lua_pushnil(L); lua_insert(L, -2); return 2; }
              return 1;
          }

          static int srfx_base64_encode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSString *e = [[NSData dataWithBytes:d length:strlen(d)] base64EncodedStringWithOptions:0];
              lua_pushstring(L, [e UTF8String]);
              return 1;
          }

          static int srfx_base64_decode(lua_State *L) {
              const char *d = luaL_checkstring(L, 1);
              NSData *dec = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:d] options:0];
              NSString *s = [[NSString alloc] initWithData:dec encoding:NSUTF8StringEncoding];
              lua_pushstring(L, s ? [s UTF8String] : "");
              return 1;
          }

          static int srfx_identifyexecutor(lua_State *L) { lua_pushstring(L, "SERFIX"); return 1; }
          static int srfx_getexecutorname(lua_State *L) { lua_pushstring(L, "SERFIX"); return 1; }
          static int srfx_checkcaller(lua_State *L) { lua_pushboolean(L, 1); return 1; }
          static int srfx_isrbxactive(lua_State *L) { lua_pushboolean(L, 1); return 1; }
          static int srfx_getthreadidentity(lua_State *L) { lua_pushinteger(L, 8); return 1; }
          static int srfx_setthreadidentity(lua_State *L) { return 0; }
          static int srfx_fireclickdetector(lua_State *L) { return 0; }
          static int srfx_getgenv(lua_State *L) { lua_pushglobaltable(L); return 1; }
          static int srfx_getreg(lua_State *L) { lua_pushvalue(L, LUA_REGISTRYINDEX); return 1; }
          static int srfx_wait(lua_State *L) { double sec = luaL_optnumber(L, 1, 0); usleep(sec * 1000000); return 0; }
          static int srfx_getgc(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getconnections(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_firetouchinterest(lua_State *L) { return 0; }
          static int srfx_getrawmetatable(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_setrawmetatable(lua_State *L) { return 0; }
          static int srfx_make_writeable(lua_State *L) { return 0; }
          static int srfx_islclosure(lua_State *L) { lua_pushboolean(L, 1); return 1; }
          static int srfx_newcclosure(lua_State *L) { lua_pushcfunction(L, srfx_wait); return 1; }
          static int srfx_hookfunction(lua_State *L) { lua_pushvalue(L, 1); return 1; }
          static int srfx_clonefunction(lua_State *L) { lua_pushvalue(L, 1); return 1; }
          static int srfx_getinfo(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getconstants(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getupvalues(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_setupvalue(lua_State *L) { return 0; }
          static int srfx_getupvalue(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getproto(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getstack(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_setstack(lua_State *L) { return 0; }
          static int srfx_getcallingscript(lua_State *L) { lua_pushstring(L, "SERFIX"); return 1; }
          static int srfx_getscripthash(lua_State *L) { lua_pushstring(L, "SERFIX"); return 1; }
          static int srfx_httpget(lua_State *L) { return srfx_getscript(L); }
          static int srfx_httppost(lua_State *L) { lua_pushstring(L, ""); return 1; }
          static int srfx_setclipboard(lua_State *L) { return 0; }
          static int srfx_getclipboard(lua_State *L) { lua_pushstring(L, ""); return 1; }
          static int srfx_messagebox(lua_State *L) { return 0; }
          static int srfx_request(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_isfile(lua_State *L) { lua_pushboolean(L, 0); return 1; }
          static int srfx_isfolder(lua_State *L) { lua_pushboolean(L, 0); return 1; }
          static int srfx_listfiles(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_readfile(lua_State *L) { lua_pushstring(L, ""); return 1; }
          static int srfx_writefile(lua_State *L) { return 0; }
          static int srfx_appendfile(lua_State *L) { return 0; }
          static int srfx_deletefile(lua_State *L) { return 0; }
          static int srfx_makefolder(lua_State *L) { return 0; }
          static int srfx_dofile(lua_State *L) { return 0; }
          static int srfx_loadfile(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getrunningscripts(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getloadedmodules(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getinstances(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getnilinstances(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getscripts(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getchildren(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getdescendants(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_findfirstchild(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_isfolder_ins(lua_State *L) { lua_pushboolean(L, 0); return 1; }
          static int srfx_isscript(lua_State *L) { lua_pushboolean(L, 0); return 1; }
          static int srfx_getproperties(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_getproperty(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_setproperty(lua_State *L) { return 0; }
          static int srfx_gethiddenproperty(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_sethiddenproperty(lua_State *L) { return 0; }
          static int srfx_firesignal(lua_State *L) { return 0; }
          static int srfx_connect(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_disconnect(lua_State *L) { return 0; }
          static int srfx_waitforchild(lua_State *L) { lua_pushnil(L); return 1; }
          static int srfx_getservice(lua_State *L) { lua_newtable(L); return 1; }
          static int srfx_createnotification(lua_State *L) { return 0; }
          static int srfx_webhook(lua_State *L) { return 0; }
          static int srfx_setfpscap(lua_State *L) { return 0; }
          static int srfx_getfps(lua_State *L) { lua_pushinteger(L, 60); return 1; }
          static int srfx_getping(lua_State *L) { lua_pushinteger(L, 30); return 1; }
          static int srfx_gethwid(lua_State *L) { lua_pushstring(L, "SERFIX_HWID"); return 1; }
          static int srfx_getuser(lua_State *L) { lua_pushstring(L, "SERFIX"); return 1; }
          static int srfx_getexecutionpath(lua_State *L) { lua_pushstring(L, "SERFIX"); return 1; }

          void SRFXLuaInit(void) {
              if (L) return;
              L = luaL_newstate();
              if (!L) return;
              luaL_openlibs(L);
              lua_register(L, "print", srfx_print);
              lua_register(L, "warn", srfx_warn);
              lua_register(L, "getscript", srfx_getscript);
              lua_register(L, "loadstring", srfx_loadstring);
              lua_register(L, "base64_encode", srfx_base64_encode);
              lua_register(L, "base64_decode", srfx_base64_decode);
              lua_register(L, "identifyexecutor", srfx_identifyexecutor);
              lua_register(L, "getexecutorname", srfx_getexecutorname);
              lua_register(L, "checkcaller", srfx_checkcaller);
              lua_register(L, "isrbxactive", srfx_isrbxactive);
              lua_register(L, "getthreadidentity", srfx_getthreadidentity);
              lua_register(L, "setthreadidentity", srfx_setthreadidentity);
              lua_register(L, "fireclickdetector", srfx_fireclickdetector);
              lua_register(L, "getgenv", srfx_getgenv);
              lua_register(L, "getreg", srfx_getreg);
              lua_register(L, "wait", srfx_wait);
              lua_register(L, "getgc", srfx_getgc);
              lua_register(L, "getconnections", srfx_getconnections);
              lua_register(L, "firetouchinterest", srfx_firetouchinterest);
              lua_register(L, "getrawmetatable", srfx_getrawmetatable);
              lua_register(L, "setrawmetatable", srfx_setrawmetatable);
              lua_register(L, "make_writeable", srfx_make_writeable);
              lua_register(L, "islclosure", srfx_islclosure);
              lua_register(L, "newcclosure", srfx_newcclosure);
              lua_register(L, "hookfunction", srfx_hookfunction);
              lua_register(L, "clonefunction", srfx_clonefunction);
              lua_register(L, "getinfo", srfx_getinfo);
              lua_register(L, "getconstants", srfx_getconstants);
              lua_register(L, "getupvalues", srfx_getupvalues);
              lua_register(L, "setupvalue", srfx_setupvalue);
              lua_register(L, "getupvalue", srfx_getupvalue);
              lua_register(L, "getproto", srfx_getproto);
              lua_register(L, "getstack", srfx_getstack);
              lua_register(L, "setstack", srfx_setstack);
              lua_register(L, "getcallingscript", srfx_getcallingscript);
              lua_register(L, "getscripthash", srfx_getscripthash);
              lua_register(L, "http_get", srfx_httpget);
              lua_register(L, "http_post", srfx_httppost);
              lua_register(L, "setclipboard", srfx_setclipboard);
              lua_register(L, "getclipboard", srfx_getclipboard);
              lua_register(L, "messagebox", srfx_messagebox);
              lua_register(L, "request", srfx_request);
              lua_register(L, "isfile", srfx_isfile);
              lua_register(L, "isfolder", srfx_isfolder);
              lua_register(L, "listfiles", srfx_listfiles);
              lua_register(L, "readfile", srfx_readfile);
              lua_register(L, "writefile", srfx_writefile);
              lua_register(L, "appendfile", srfx_appendfile);
              lua_register(L, "deletefile", srfx_deletefile);
              lua_register(L, "makefolder", srfx_makefolder);
              lua_register(L, "dofile", srfx_dofile);
              lua_register(L, "loadfile", srfx_loadfile);
              lua_register(L, "getrunningscripts", srfx_getrunningscripts);
              lua_register(L, "getloadedmodules", srfx_getloadedmodules);
              lua_register(L, "getinstances", srfx_getinstances);
              lua_register(L, "getnilinstances", srfx_getnilinstances);
              lua_register(L, "getscripts", srfx_getscripts);
              lua_register(L, "getchildren", srfx_getchildren);
              lua_register(L, "getdescendants", srfx_getdescendants);
              lua_register(L, "findfirstchild", srfx_findfirstchild);
              lua_register(L, "isfolder_ins", srfx_isfolder_ins);
              lua_register(L, "isscript", srfx_isscript);
              lua_register(L, "getproperties", srfx_getproperties);
              lua_register(L, "getproperty", srfx_getproperty);
              lua_register(L, "setproperty", srfx_setproperty);
              lua_register(L, "gethiddenproperty", srfx_gethiddenproperty);
              lua_register(L, "sethiddenproperty", srfx_sethiddenproperty);
              lua_register(L, "firesignal", srfx_firesignal);
              lua_register(L, "connect", srfx_connect);
              lua_register(L, "disconnect", srfx_disconnect);
              lua_register(L, "waitforchild", srfx_waitforchild);
              lua_register(L, "getservice", srfx_getservice);
              lua_register(L, "createnotification", srfx_createnotification);
              lua_register(L, "webhook", srfx_webhook);
              lua_register(L, "setfpscap", srfx_setfpscap);
              lua_register(L, "getfps", srfx_getfps);
              lua_register(L, "getping", srfx_getping);
              lua_register(L, "gethwid", srfx_gethwid);
              lua_register(L, "getuser", srfx_getuser);
              lua_register(L, "getexecutionpath", srfx_getexecutionpath);
              lua_newtable(L);
              lua_pushstring(L, "SERFIX");
              lua_setfield(L, -2, "name");
              lua_pushstring(L, "2.0.0");
              lua_setfield(L, -2, "version");
              lua_setglobal(L, "serfix");
              NSLog(@"[SERFIX] Lua ready");
          }

          void SRFXLuaExecute(const char *script) {
              pthread_mutex_lock(&mutex);
              if (!L) SRFXLuaInit();
              if (script && strlen(script) > 0) {
                  int s = luaL_dostring(L, script);
                  if (s != LUA_OK) {
                      const char *err = lua_tostring(L, -1);
                      NSLog(@"[SERFIX] Lua error: %s", err);
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [[NSNotificationCenter defaultCenter] postNotificationName:@"SRFXError" object:[NSString stringWithUTF8String:err]];
                      });
                      lua_pop(L, 1);
                  }
              }
              pthread_mutex_unlock(&mutex);
          }

          void SRFXLuaRegister(const char *name, int (*func)(lua_State*)) {
              pthread_mutex_lock(&mutex);
              if (L) lua_register(L, name, func);
              pthread_mutex_unlock(&mutex);
          }

          lua_State* SRFXLuaState(void) {
              return L;
          }
          EOF

      - name: Write UI header
        run: |
          cat > SERFIX/UI/SRFXMainViewController.h << 'EOF'
          #import <UIKit/UIKit.h>
          @interface SRFXMainViewController : UIViewController
          @property (nonatomic, strong) UITextView *editor;
          @property (nonatomic, strong) UITableView *scriptList;
          @property (nonatomic, strong) NSMutableArray *scripts;
          @property (nonatomic, strong) UIView *tabBar;
          @property (nonatomic, assign) NSInteger selectedTab;
          @end
          EOF

      - name: Write UI implementation
        run: |
          cat > SERFIX/UI/SRFXMainViewController.m << 'EOF'
          #import "SRFXMainViewController.h"
          #import "SRFXScriptBlox.h"
          #include "Core/SRFXLua.h"

          @interface SRFXMainViewController () <UITableViewDelegate, UITableViewDataSource, UITextViewDelegate>
          @end

          @implementation SRFXMainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.08 alpha:0.98];
              self.view.layer.cornerRadius = 16;
              self.view.layer.borderWidth = 1;
              self.view.layer.borderColor = [UIColor colorWithRed:0.3 green:0.2 blue:0.8 alpha:1.0].CGColor;

              UIView *header = [[UIView alloc] initWithFrame:CGRectMake(0, 0, self.view.bounds.size.width, 50)];
              header.backgroundColor = [UIColor colorWithRed:0.1 green:0.1 blue:0.15 alpha:1.0];
              [self.view addSubview:header];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(15, 10, 200, 30)];
              title.text = @"SERFIX";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:20];
              [header addSubview:title];

              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              closeBtn.frame = CGRectMake(self.view.bounds.size.width - 50, 10, 40, 30);
              [closeBtn setTitle:@"✕" forState:UIControlStateNormal];
              [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              closeBtn.titleLabel.font = [UIFont systemFontOfSize:24];
              [closeBtn addTarget:self action:@selector(hide) forControlEvents:UIControlEventTouchUpInside];
              [header addSubview:closeBtn];

              UIButton *minimizeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              minimizeBtn.frame = CGRectMake(self.view.bounds.size.width - 90, 10, 40, 30);
              [minimizeBtn setTitle:@"−" forState:UIControlStateNormal];
              [minimizeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              minimizeBtn.titleLabel.font = [UIFont systemFontOfSize:30];
              [minimizeBtn addTarget:self action:@selector(minimize) forControlEvents:UIControlEventTouchUpInside];
              [header addSubview:minimizeBtn];

              self.tabBar = [[UIView alloc] initWithFrame:CGRectMake(0, 50, self.view.bounds.size.width, 40)];
              self.tabBar.backgroundColor = [UIColor colorWithRed:0.08 green:0.08 blue:0.12 alpha:1.0];
              [self.view addSubview:self.tabBar];

              NSArray *tabs = @[@"Editor", @"ScriptBlox", @"Console", @"Settings"];
              for (int i = 0; i < tabs.count; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
                  btn.frame = CGRectMake(i * (self.view.bounds.size.width / tabs.count), 0, self.view.bounds.size.width / tabs.count, 40);
                  [btn setTitle:tabs[i] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor lightGrayColor] forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont systemFontOfSize:14];
                  btn.tag = i;
                  [btn addTarget:self action:@selector(tabTapped:) forControlEvents:UIControlEventTouchUpInside];
                  [self.tabBar addSubview:btn];
              }

              self.selectedTab = 0;
              [self updateTabSelection];

              self.editor = [[UITextView alloc] initWithFrame:CGRectMake(8, 98, self.view.bounds.size.width - 16, self.view.bounds.size.height - 180)];
              self.editor.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.1 alpha:1.0];
              self.editor.textColor = [UIColor whiteColor];
              self.editor.font = [UIFont fontWithName:@"Menlo" size:13];
              self.editor.text = @"print('Hello SERFIX')";
              self.editor.autocorrectionType = UITextAutocorrectionTypeNo;
              self.editor.autocapitalizationType = UITextAutocapitalizationTypeNone;
              self.editor.layer.borderColor = [UIColor colorWithRed:0.3 green:0.2 blue:0.8 alpha:0.5].CGColor;
              self.editor.layer.borderWidth = 1;
              self.editor.layer.cornerRadius = 6;
              [self.view addSubview:self.editor];

              self.scriptList = [[UITableView alloc] initWithFrame:self.editor.frame style:UITableViewStylePlain];
              self.scriptList.backgroundColor = self.editor.backgroundColor;
              self.scriptList.delegate = self;
              self.scriptList.dataSource = self;
              self.scriptList.separatorColor = [UIColor darkGrayColor];
              self.scriptList.hidden = YES;
              [self.view addSubview:self.scriptList];

              UIButton *execBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              execBtn.frame = CGRectMake(8, self.view.bounds.size.height - 75, 100, 40);
              [execBtn setTitle:@"Execute" forState:UIControlStateNormal];
              execBtn.backgroundColor = [UIColor colorWithRed:0.4 green:0.3 blue:0.9 alpha:1.0];
              [execBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              execBtn.layer.cornerRadius = 6;
              [execBtn addTarget:self action:@selector(execute) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:execBtn];

              UIButton *clearBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              clearBtn.frame = CGRectMake(116, self.view.bounds.size.height - 75, 100, 40);
              [clearBtn setTitle:@"Clear" forState:UIControlStateNormal];
              clearBtn.backgroundColor = [UIColor colorWithRed:0.8 green:0.2 blue:0.2 alpha:1.0];
              [clearBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              clearBtn.layer.cornerRadius = 6;
              [clearBtn addTarget:self action:@selector(clear) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:clearBtn];

              UIButton *loadBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              loadBtn.frame = CGRectMake(224, self.view.bounds.size.height - 75, 100, 40);
              [loadBtn setTitle:@"Load Script" forState:UIControlStateNormal];
              loadBtn.backgroundColor = [UIColor colorWithRed:0.2 green:0.5 blue:0.8 alpha:1.0];
              [loadBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              loadBtn.layer.cornerRadius = 6;
              [loadBtn addTarget:self action:@selector(showScriptBlox) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:loadBtn];

              self.scripts = [NSMutableArray array];
              [self loadTrendingScripts];
          }

          - (void)loadTrendingScripts {
              [SRFXScriptBlox fetchTrending:^(NSArray *scripts) {
                  [self.scripts removeAllObjects];
                  [self.scripts addObjectsFromArray:scripts];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self.scriptList reloadData];
                  });
              }];
          }

          - (void)tabTapped:(UIButton *)sender {
              self.selectedTab = sender.tag;
              [self updateTabSelection];
          }

          - (void)updateTabSelection {
              for (UIView *v in self.tabBar.subviews) {
                  if ([v isKindOfClass:[UIButton class]]) {
                      UIButton *b = (UIButton *)v;
                      [b setTitleColor:[UIColor lightGrayColor] forState:UIControlStateNormal];
                  }
              }
              UIButton *selected = (UIButton *)[self.tabBar viewWithTag:self.selectedTab];
              [selected setTitleColor:[UIColor colorWithRed:0.6 green:0.4 blue:1.0 alpha:1.0] forState:UIControlStateNormal];

              if (self.selectedTab == 0) {
                  self.editor.hidden = NO;
                  self.scriptList.hidden = YES;
              } else if (self.selectedTab == 1) {
                  self.editor.hidden = YES;
                  self.scriptList.hidden = NO;
                  if (self.scripts.count == 0) [self loadTrendingScripts];
              } else {
                  self.editor.hidden = YES;
                  self.scriptList.hidden = YES;
              }
          }

          - (void)showScriptBlox {
              self.selectedTab = 1;
              [self updateTabSelection];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.scripts.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"cell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"cell"];
                  cell.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.1 alpha:1.0];
                  cell.textLabel.textColor = [UIColor whiteColor];
                  cell.detailTextLabel.textColor = [UIColor lightGrayColor];
              }
              NSDictionary *s = self.scripts[indexPath.row];
              cell.textLabel.text = s[@"title"];
              cell.detailTextLabel.text = [NSString stringWithFormat:@"By %@ • %@", s[@"author"], s[@"game"]];
              return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              [tableView deselectRowAtIndexPath:indexPath animated:YES];
              NSDictionary *s = self.scripts[indexPath.row];
              NSString *slug = s[@"slug"];
              [SRFXScriptBlox fetchScript:slug completion:^(NSString *code) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.editor.text = code;
                      self.selectedTab = 0;
                      [self updateTabSelection];
                  });
              }];
          }

          - (void)execute {
              if (self.editor.text.length > 0) {
                  SRFXLuaExecute(self.editor.text.UTF8String);
              }
          }

          - (void)clear {
              self.editor.text = @"";
          }

          - (void)hide {
              self.view.window.hidden = YES;
          }

          - (void)minimize {
              self.view.window.frame = CGRectMake(self.view.window.frame.origin.x,
                                                   self.view.window.frame.origin.y,
                                                   60, 60);
          }

          @end
          EOF

      - name: Write ScriptBlox header
        run: |
          cat > injector/dylib/SRFXScriptBlox.h << 'EOF'
          #import <Foundation/Foundation.h>
          @interface SRFXScriptBlox : NSObject
          + (void)fetchTrending:(void(^)(NSArray *))completion;
          + (void)fetchScript:(NSString *)slug completion:(void(^)(NSString *))completion;
          @end
          EOF

      - name: Write ScriptBlox implementation
        run: |
          cat > injector/dylib/SRFXScriptBlox.m << 'EOF'
          #import "SRFXScriptBlox.h"
          @implementation SRFXScriptBlox
          + (void)fetchTrending:(void(^)(NSArray *))completion {
              NSURL *url = [NSURL URLWithString:@"https://scriptblox.com/api/scripts?sort=trending&limit=50"];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  if (data) {
                      NSError *err;
                      id json = [NSJSONSerialization JSONObjectWithData:data options:0 error:&err];
                      if ([json isKindOfClass:[NSDictionary class]]) {
                          NSArray *scripts = json[@"scripts"];
                          NSMutableArray *res = [NSMutableArray array];
                          for (NSDictionary *s in scripts) {
                              [res addObject:@{
                                  @"title": s[@"title"] ?: @"",
                                  @"author": s[@"author"] ?: @"",
                                  @"game": s[@"game"] ?: @"",
                                  @"slug": s[@"slug"] ?: @""
                              }];
                          }
                          completion(res);
                          return;
                      }
                  }
                  completion(@[]);
              }];
              [task resume];
          }
          + (void)fetchScript:(NSString *)slug completion:(void(^)(NSString *))completion {
              NSString *urlStr = [NSString stringWithFormat:@"https://scriptblox.com/api/scripts/%@", slug];
              NSURL *url = [NSURL URLWithString:urlStr];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  if (data) {
                      NSError *err;
                      id json = [NSJSONSerialization JSONObjectWithData:data options:0 error:&err];
                      if ([json isKindOfClass:[NSDictionary class]]) {
                          NSString *code = json[@"script"];
                          if (code) {
                              completion(code);
                              return;
                          }
                      }
                  }
                  completion(@"");
              }];
              [task resume];
          }
          @end
          EOF

      - name: Write Core header
        run: |
          cat > injector/dylib/SRFXCore.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          @interface SRFXCore : NSObject
          + (instancetype)shared;
          - (void)start;
          - (void)showUI;
          - (void)hideUI;
          @property (nonatomic, strong) UIWindow *uiWindow;
          @end
          EOF

      - name: Write Core implementation
        run: |
          cat > injector/dylib/SRFXCore.m << 'EOF'
          #import "SRFXCore.h"
          #import "SRFXMainViewController.h"
          #include "Core/SRFXLua.h"

          static SRFXCore *instance = nil;

          @interface SRFXCore ()
          @property (nonatomic, assign) BOOL inGame;
          @property (nonatomic, strong) NSTimer *checkTimer;
          @end

          @implementation SRFXCore

          + (instancetype)shared {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ instance = [[self alloc] init]; });
              return instance;
          }

          - (instancetype)init {
              self = [super init];
              self.inGame = NO;
              return self;
          }

          - (void)start {
              SRFXLuaInit();
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 4.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self startGameDetection];
              });
          }

          - (void)startGameDetection {
              self.checkTimer = [NSTimer scheduledTimerWithTimeInterval:1.5 repeats:YES block:^(NSTimer *t) {
                  BOOL nowInGame = [self isInsideGame];
                  if (nowInGame != self.inGame) {
                      self.inGame = nowInGame;
                      if (self.inGame) {
                          [self showUI];
                      } else {
                          [self hideUI];
                      }
                  }
              }];
          }

          - (BOOL)isInsideGame {
              UIWindow *keyWindow = nil;
              for (UIWindowScene *scene in [UIApplication sharedApplication].connectedScenes) {
                  if (scene.activationState == UISceneActivationStateForegroundActive) {
                      for (UIWindow *w in scene.windows) {
                          if (w.isKeyWindow) {
                              keyWindow = w;
                              break;
                          }
                      }
                  }
              }
              if (!keyWindow) return NO;
              NSString *className = NSStringFromClass([keyWindow.rootViewController class]);
              NSArray *gameVCs = @[@"RBXGameViewController", @"GameViewController", @"RobloxGameController", @"RBXViewController"];
              for (NSString *vcName in gameVCs) {
                  if ([className containsString:vcName]) return YES;
              }
              NSString *title = keyWindow.rootViewController.title ?: @"";
              if ([title containsString:@"Place"] || [title containsString:@"Game"]) return YES;
              if ([keyWindow.rootViewController respondsToSelector:@selector(childViewControllers)]) {
                  for (UIViewController *child in keyWindow.rootViewController.childViewControllers) {
                      NSString *childClass = NSStringFromClass([child class]);
                      if ([childClass containsString:@"Game"] || [childClass containsString:@"RBX"]) {
                          return YES;
                      }
                  }
              }
              return NO;
          }

          - (void)showUI {
              if (self.uiWindow && !self.uiWindow.hidden) return;
              UIWindowScene *scene = nil;
              for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]]) {
                      scene = (UIWindowScene *)s;
                      break;
                  }
              }
              if (!scene) return;
              SRFXMainViewController *vc = [[SRFXMainViewController alloc] init];
              self.uiWindow = [[UIWindow alloc] initWithWindowScene:scene];
              self.uiWindow.windowLevel = UIWindowLevelAlert + 2;
              self.uiWindow.backgroundColor = [UIColor clearColor];
              self.uiWindow.rootViewController = vc;
              self.uiWindow.hidden = NO;
              [self.uiWindow makeKeyAndVisible];
          }

          - (void)hideUI {
              self.uiWindow.hidden = YES;
          }

          @end
          EOF

      - name: Write entry
        run: |
          cat > injector/dylib/entry.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import "SRFXCore.h"
          __attribute__((constructor))
          static void initialize() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [[SRFXCore shared] start];
              });
          }
          EOF

      - name: Write hooks stub
        run: |
          cat > injector/dylib/SRFXHooks.h << 'EOF'
          #ifndef SRFXHooks_h
          #define SRFXHooks_h
          void SRFXHooksInstall(void);
          #endif
          EOF
          cat > injector/dylib/SRFXHooks.m << 'EOF'
          #import "SRFXHooks.h"
          void SRFXHooksInstall(void) {}
          EOF

      - name: Write stub files
        run: |
          for stub in srfx_obfuscator srfx_security srfx_memory srfx_editor srfx_uibridge; do
            echo "#import <Foundation/Foundation.h>" > "injector/dylib/${stub}.h"
            echo "@interface SRFX${stub#srfx_} : NSObject" >> "injector/dylib/${stub}.h"
            echo "+ (instancetype)shared;" >> "injector/dylib/${stub}.h"
            echo "@end" >> "injector/dylib/${stub}.h"
            echo "#import \"${stub}.h\"" > "injector/dylib/${stub}.m"
            echo "@implementation SRFX${stub#srfx_}" >> "injector/dylib/${stub}.m"
            echo "+ (instancetype)shared { static id i; static dispatch_once_t t; dispatch_once(&t,^{ i=[[self alloc] init];}); return i; }" >> "injector/dylib/${stub}.m"
            echo "@end" >> "injector/dylib/${stub}.m"
          done

      - name: Compile ObjC
        run: |
          mkdir -p build
          FILES="injector/dylib/entry.m injector/dylib/SRFXCore.m injector/dylib/SRFXHooks.m injector/dylib/SRFXScriptBlox.m SERFIX/UI/SRFXMainViewController.m injector/dylib/srfx_obfuscator.m injector/dylib/srfx_security.m injector/dylib/srfx_memory.m injector/dylib/srfx_editor.m injector/dylib/srfx_uibridge.m"
          for f in $FILES; do
            if [ -f "$f" ]; then
              xcrun -sdk iphoneos clang -c -fobjc-arc -I./injector/dylib -I./injector/dylib/Core -I./SERFIX/UI -I$LUA_INCLUDE -o "build/$(basename "$f" .m).o" "$f" -target arm64-apple-ios15.0 || exit 1
            fi
          done

      - name: Compile C++
        run: |
          for f in injector/dylib/Core/*.mm; do
            xcrun -sdk iphoneos clang++ -c -std=c++17 -fobjc-arc -I./injector/dylib -I./injector/dylib/Core -I$LUA_INCLUDE -o "build/$(basename "$f" .mm).o" "$f" -target arm64-apple-ios15.0 || exit 1
          done

      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared -framework UIKit -framework Foundation -framework CoreGraphics -framework WebKit -L$LUA_LIB -llua -undefined dynamic_lookup -o build/serfix.dylib build/*.o -lc++ -target arm64-apple-ios15.0

      - name: Patch IPA
        run: |
          mkdir -p extracted
          unzip -q Roblox.ipa -d extracted/
          APP=$(find extracted/Payload -name "*.app" | head -1)
          cp build/serfix.dylib "$APP/"
          rm -rf "$APP/_CodeSignature"
          ./tools/insert_dylib --all-yes @executable_path/serfix.dylib "$APP/Roblox" "$APP/Roblox_patched"
          mv "$APP/Roblox_patched" "$APP/Roblox"
          plutil -convert xml1 "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SERFIX" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SERFIX" "$APP/Info.plist"
          plutil -convert binary1 "$APP/Info.plist"

      - name: Package IPA
        run: cd extracted && zip -qr ../SERFIX.ipa Payload/ && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SERFIX
          path: SERFIX.ipa
