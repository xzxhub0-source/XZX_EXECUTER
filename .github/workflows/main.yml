name: Build XZX Executor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install pipx
          pipx ensurepath
          pipx install gdown
      
      - name: Download and install Lua headers from official source
        run: |
          # Create directories
          mkdir -p $HOME/lua-ios/include
          
          # Download Lua 5.4.6 source tarball
          curl -L -o lua-5.4.6.tar.gz https://www.lua.org/ftp/lua-5.4.6.tar.gz
          if [ ! -f lua-5.4.6.tar.gz ]; then
            echo "❌ Failed to download Lua source"
            exit 1
          fi
          
          # Extract headers
          tar -xzf lua-5.4.6.tar.gz
          cp lua-5.4.6/src/lua.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/luaconf.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lauxlib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lualib.h $HOME/lua-ios/include/
          cp lua-5.4.6/src/lua.hpp $HOME/lua-ios/include/
          
          # Verify headers
          if [ ! -f $HOME/lua-ios/include/lua.h ]; then
            echo "❌ Lua headers not copied correctly"
            exit 1
          fi
          
          # Set environment variable
          echo "LUA_INCLUDE_DIR=$HOME/lua-ios/include" >> $GITHUB_ENV
          
          echo "✅ Lua headers installed successfully"
          ls -la $HOME/lua-ios/include/
      
      - name: Download Roblox IPA
        run: |
          FILE_ID="12rjbAAh6s1FVTAxXoVcqgZwC7j2JySH0"
          pipx run gdown https://drive.google.com/uc?id=${FILE_ID} -O Roblox.ipa
          
          if [ ! -f "Roblox.ipa" ]; then
            echo "❌ Download failed"
            exit 1
          fi
          echo "✅ Download successful! Size: $(ls -la Roblox.ipa | awk '{print $5}') bytes"
      
      - name: Download and compile insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release
          
          # Find the compiled binary
          BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ insert_dylib binary not found"
            exit 1
          fi
          
          mkdir -p ../tools
          cp "$BINARY_PATH" ../tools/insert_dylib
          chmod +x ../tools/insert_dylib
          cd ..
          echo "✅ insert_dylib compiled and installed"
      
      - name: Create directory structure
        run: |
          mkdir -p XZX/Services
          mkdir -p XZX/UI
          mkdir -p injector/dylib/Core
      
      - name: Create LuaExecutor.h
        run: |
          cat > injector/dylib/Core/LuaExecutor.h << 'EOF'
          #ifndef LuaExecutor_h
          #define LuaExecutor_h

          #ifdef __cplusplus
          extern "C" {
          #endif

          void InitLua(void);
          void ExecuteScript(const char *script);

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF
      
      - name: Create LuaExecutor.mm
        run: |
          cat > injector/dylib/Core/LuaExecutor.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <lua.h>
          #include <lauxlib.h>
          #include <lualib.h>
          #include "LuaExecutor.h"

          static lua_State *L = nil;

          static int xzx_print(lua_State *L) {
              int n = lua_gettop(L);
              NSMutableString *output = [NSMutableString string];
              
              for (int i = 1; i <= n; i++) {
                  if (lua_isstring(L, i)) {
                      if (i > 1) [output appendString:@"\t"];
                      [output appendFormat:@"%s", lua_tostring(L, i)];
                  }
              }
              
              NSLog(@"[XZX] %@", output);
              return 0;
          }

          static int xzx_getscript(lua_State *L) {
              const char *url = luaL_checkstring(L, 1);
              
              dispatch_semaphore_t semaphore = dispatch_semaphore_create(0);
              __block NSString *result = nil;
              
              NSURL *nsUrl = [NSURL URLWithString:[NSString stringWithUTF8String:url]];
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithURL:nsUrl completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      result = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                  }
                  dispatch_semaphore_signal(semaphore);
              }];
              
              [task resume];
              dispatch_semaphore_wait(semaphore, dispatch_time(DISPATCH_TIME_NOW, 5 * NSEC_PER_SEC));
              
              if (result) {
                  lua_pushstring(L, [result UTF8String]);
              } else {
                  lua_pushnil(L);
              }
              
              return 1;
          }

          void InitLua(void) {
              if (!L) {
                  L = luaL_newstate();
                  luaL_openlibs(L);
                  
                  lua_register(L, "print", xzx_print);
                  lua_register(L, "getscript", xzx_getscript);
                  
                  luaL_dostring(L, "xzx = { version = '2.0.0' }");
              }
          }

          void ExecuteScript(const char *script) {
              if (!L) InitLua();
              
              int status = luaL_dostring(L, script);
              
              if (status != LUA_OK) {
                  const char *error = lua_tostring(L, -1);
                  NSLog(@"[XZX] Lua Error: %s", error);
                  lua_pop(L, 1);
              }
          }
          EOF
      
      - name: Create bridging header with correct relative path
        run: |
          cat > XZX/XZX-Bridging-Header.h << 'EOF'
          #ifndef XZX_Bridging_Header_h
          #define XZX_Bridging_Header_h
          
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          
          // Include Lua executor header - using relative path from current directory
          #include "../injector/dylib/Core/LuaExecutor.h"
          
          #endif
          EOF
          echo "✅ Bridging header created with correct path"
      
      - name: Create Swift files
        run: |
          # Create ScriptBloxAPI.swift
          cat > XZX/Services/ScriptBloxAPI.swift << 'EOF'
          import Foundation
          import UIKit

          public struct ScriptItem: Decodable {
              public let title: String
              public let script: String
              public let game: String?
              public let views: Int?
              public let likes: Int?
              public let thumbnail: String?
              
              enum CodingKeys: String, CodingKey {
                  case title, script, game, views, likes
                  case thumbnail = "image"
              }
              
              public init(from decoder: Decoder) throws {
                  let container = try decoder.container(keyedBy: CodingKeys.self)
                  title = try container.decode(String.self, forKey: .title)
                  script = try container.decode(String.self, forKey: .script)
                  game = try container.decodeIfPresent(String.self, forKey: .game)
                  views = try container.decodeIfPresent(Int.self, forKey: .views)
                  likes = try container.decodeIfPresent(Int.self, forKey: .likes)
                  thumbnail = try container.decodeIfPresent(String.self, forKey: .thumbnail)
              }
          }

          struct ScriptBloxResponse: Decodable {
              let result: ScriptResult
          }

          struct ScriptResult: Decodable {
              let scripts: [ScriptItem]
          }

          public class ScriptBloxAPI {
              public static let shared = ScriptBloxAPI()
              private var searchCache = NSCache<NSString, NSArray>()
              private var imageCache = NSCache<NSString, UIImage>()
              private var currentTask: URLSessionDataTask?
              
              private init() {}
              
              public func search(query: String, completion: @escaping ([ScriptItem]) -> Void) {
                  currentTask?.cancel()
                  
                  let cacheKey = NSString(string: query)
                  if let cached = searchCache.object(forKey: cacheKey) as? [ScriptItem] {
                      completion(cached)
                      return
                  }
                  
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) { [weak self] in
                      guard let self = self else { return }
                      
                      let urlString = "https://scriptblox.com/api/script/search?q=\(query)&mode=free"
                      guard let url = URL(string: urlString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "") else {
                          completion([])
                          return
                      }
                      
                      self.currentTask = URLSession.shared.dataTask(with: url) { data, response, error in
                          guard let data = data, error == nil else {
                              DispatchQueue.main.async { completion([]) }
                              return
                          }
                          
                          do {
                              let decoded = try JSONDecoder().decode(ScriptBloxResponse.self, from: data)
                              let scripts = decoded.result.scripts
                              self.searchCache.setObject(scripts as NSArray, forKey: cacheKey)
                              DispatchQueue.main.async {
                                  completion(scripts)
                              }
                          } catch {
                              DispatchQueue.main.async { completion([]) }
                          }
                      }
                      self.currentTask?.resume()
                  }
              }
              
              public func loadThumbnail(url: String, completion: @escaping (UIImage?) -> Void) {
                  let cacheKey = NSString(string: url)
                  
                  if let cached = imageCache.object(forKey: cacheKey) {
                      completion(cached)
                      return
                  }
                  
                  guard let imageUrl = URL(string: url) else {
                      completion(nil)
                      return
                  }
                  
                  URLSession.shared.dataTask(with: imageUrl) { [weak self] data, _, _ in
                      if let data = data, let image = UIImage(data: data) {
                          self?.imageCache.setObject(image, forKey: cacheKey)
                          DispatchQueue.main.async {
                              completion(image)
                          }
                      } else {
                          DispatchQueue.main.async {
                              completion(nil)
                          }
                      }
                  }.resume()
              }
          }
          EOF
          
          # Create TabManager.swift
          cat > XZX/Services/TabManager.swift << 'EOF'
          import Foundation

          public struct ScriptTab: Codable {
              public var id = UUID()
              public var name: String
              public var content: String
              public var isSaved: Bool = false
              
              public init(name: String, content: String) {
                  self.name = name
                  self.content = content
              }
          }

          public class TabManager: ObservableObject {
              public static let shared = TabManager()
              
              @Published public var tabs: [ScriptTab] = []
              @Published public var selectedTabIndex: Int = 0
              @Published public var savedScripts: [ScriptTab] = []
              
              private let userDefaults = UserDefaults.standard
              private let tabsKey = "xzx_tabs"
              private let savedKey = "xzx_saved"
              
              private init() {
                  loadTabs()
                  loadSaved()
                  
                  if tabs.isEmpty {
                      tabs.append(ScriptTab(name: "Untitled 1", content: "-- XZX Executor\nprint('Hello World!')"))
                  }
              }
              
              public func addTab() {
                  let newTab = ScriptTab(name: "Untitled \(tabs.count + 1)", content: "")
                  tabs.append(newTab)
                  selectedTabIndex = tabs.count - 1
                  saveTabs()
              }
              
              public func removeTab(at index: Int) {
                  guard tabs.count > 1 else { return }
                  tabs.remove(at: index)
                  if selectedTabIndex >= tabs.count {
                      selectedTabIndex = tabs.count - 1
                  }
                  saveTabs()
              }
              
              public func updateCurrentContent(_ content: String) {
                  guard selectedTabIndex < tabs.count else { return }
                  tabs[selectedTabIndex].content = content
                  saveTabs()
              }
              
              public func saveScript(at index: Int) {
                  guard index < tabs.count else { return }
                  var script = tabs[index]
                  script.isSaved = true
                  savedScripts.append(script)
                  saveSaved()
              }
              
              public func loadScript(_ script: ScriptTab) {
                  tabs.append(script)
                  selectedTabIndex = tabs.count - 1
                  saveTabs()
              }
              
              private func saveTabs() {
                  if let encoded = try? JSONEncoder().encode(tabs) {
                      userDefaults.set(encoded, forKey: tabsKey)
                  }
              }
              
              private func loadTabs() {
                  if let data = userDefaults.data(forKey: tabsKey),
                     let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) {
                      tabs = decoded
                  }
              }
              
              private func saveSaved() {
                  if let encoded = try? JSONEncoder().encode(savedScripts) {
                      userDefaults.set(encoded, forKey: savedKey)
                  }
              }
              
              private func loadSaved() {
                  if let data = userDefaults.data(forKey: savedKey),
                     let decoded = try? JSONDecoder().decode([ScriptTab].self, from: data) {
                      savedScripts = decoded
                  }
              }
          }
          EOF
          
          # Create NeonWindow.swift
          cat > XZX/UI/NeonWindow.swift << 'EOF'
          import UIKit

          public class NeonWindow: UIView {
              
              private let gradientLayer = CAGradientLayer()
              private var dragStartPoint: CGPoint?
              private var dragStartFrame: CGRect?
              
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  setup()
                  setupDragging()
              }
              
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  setup()
                  setupDragging()
              }
              
              private func setup() {
                  backgroundColor = UIColor(red: 0.08, green: 0.08, blue: 0.12, alpha: 0.95)
                  layer.cornerRadius = 18
                  layer.masksToBounds = true
                  
                  gradientLayer.frame = bounds
                  gradientLayer.colors = [
                      UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor,
                      UIColor(red: 0.45, green: 0.25, blue: 0.8, alpha: 1).cgColor,
                      UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor
                  ]
                  gradientLayer.locations = [0, 0.5, 1]
                  gradientLayer.startPoint = CGPoint(x: 0, y: 0)
                  gradientLayer.endPoint = CGPoint(x: 1, y: 1)
                  
                  layer.addSublayer(gradientLayer)
                  
                  let animation = CABasicAnimation(keyPath: "locations")
                  animation.fromValue = [0, 0.5, 1]
                  animation.toValue = [0.2, 0.7, 1.2]
                  animation.duration = 3
                  animation.autoreverses = true
                  animation.repeatCount = .infinity
                  gradientLayer.add(animation, forKey: "glowAnimation")
                  
                  layer.shadowColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1).cgColor
                  layer.shadowOpacity = 0.8
                  layer.shadowRadius = 25
                  layer.shadowOffset = .zero
              }
              
              private func setupDragging() {
                  let panGesture = UIPanGestureRecognizer(target: self, action: #selector(handleDrag(_:)))
                  addGestureRecognizer(panGesture)
              }
              
              @objc private func handleDrag(_ gesture: UIPanGestureRecognizer) {
                  switch gesture.state {
                  case .began:
                      dragStartPoint = gesture.location(in: superview)
                      dragStartFrame = frame
                  case .changed:
                      guard let startPoint = dragStartPoint,
                            let startFrame = dragStartFrame else { return }
                      
                      let translation = gesture.location(in: superview)
                      let dx = translation.x - startPoint.x
                      let dy = translation.y - startPoint.y
                      
                      frame = CGRect(
                          x: startFrame.origin.x + dx,
                          y: startFrame.origin.y + dy,
                          width: startFrame.width,
                          height: startFrame.height
                      )
                  default:
                      dragStartPoint = nil
                      dragStartFrame = nil
                  }
              }
              
              public override func layoutSubviews() {
                  super.layoutSubviews()
                  gradientLayer.frame = bounds
              }
          }
          EOF
          
          # Create SidebarView.swift
          cat > XZX/UI/SidebarView.swift << 'EOF'
          import UIKit

          public class SidebarView: UIView {
              
              public var buttons: [UIButton] = []
              public var onTabSelected: ((Int) -> Void)?
              
              private let items = [
                  ("📝", "Editor"),
                  ("🌐", "Hub"),
                  ("📌", "Tabs"),
                  ("💾", "Saved"),
                  ("⚙️", "Settings")
              ]
              
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  build()
              }
              
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  build()
              }
              
              private func build() {
                  backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9)
                  layer.cornerRadius = 12
                  
                  for i in 0..<items.count {
                      let btn = createButton(title: "\(items[i].0) \(items[i].1)", tag: i)
                      btn.frame = CGRect(x: 10, y: 20 + (i * 55), width: 160, height: 45)
                      addSubview(btn)
                      buttons.append(btn)
                  }
                  
                  animateButton(buttons[0])
              }
              
              private func createButton(title: String, tag: Int) -> UIButton {
                  let btn = UIButton(type: .system)
                  btn.setTitle(title, for: .normal)
                  btn.setTitleColor(.white, for: .normal)
                  btn.titleLabel?.font = .systemFont(ofSize: 14, weight: .medium)
                  btn.backgroundColor = UIColor(red: 0.16, green: 0.14, blue: 0.22, alpha: 1)
                  btn.layer.cornerRadius = 10
                  btn.tag = tag
                  btn.addTarget(self, action: #selector(buttonTapped(_:)), for: .touchUpInside)
                  
                  btn.layer.shadowColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.5).cgColor
                  btn.layer.shadowOffset = .zero
                  btn.layer.shadowRadius = 5
                  btn.layer.shadowOpacity = 0
                  
                  return btn
              }
              
              private func animateButton(_ button: UIButton) {
                  let animation = CABasicAnimation(keyPath: "shadowOpacity")
                  animation.fromValue = 0
                  animation.toValue = 0.8
                  animation.duration = 1.5
                  animation.autoreverses = true
                  animation.repeatCount = .infinity
                  button.layer.add(animation, forKey: "buttonGlow")
              }
              
              @objc private func buttonTapped(_ sender: UIButton) {
                  buttons.forEach { btn in
                      btn.backgroundColor = UIColor(red: 0.16, green: 0.14, blue: 0.22, alpha: 1)
                      btn.layer.removeAnimation(forKey: "buttonGlow")
                      btn.layer.shadowOpacity = 0
                  }
                  
                  sender.backgroundColor = UIColor(red: 0.25, green: 0.2, blue: 0.35, alpha: 1)
                  animateButton(sender)
                  onTabSelected?(sender.tag)
              }
          }
          EOF
          
          # Create EditorView.swift
          cat > XZX/UI/EditorView.swift << 'EOF'
          import UIKit

          public class EditorView: UIView {
              
              public let textView = UITextView()
              
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  build()
              }
              
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  build()
              }
              
              private func build() {
                  backgroundColor = UIColor(red: 0.05, green: 0.05, blue: 0.08, alpha: 1)
                  layer.cornerRadius = 12
                  
                  textView.frame = bounds
                  textView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  textView.font = UIFont(name: "Menlo", size: 14)
                  textView.textColor = .white
                  textView.backgroundColor = .clear
                  textView.text = "-- XZX Executor\nprint('Hello World!')"
                  addSubview(textView)
              }
          }
          EOF
          
          # Create HubView.swift
          cat > XZX/UI/HubView.swift << 'EOF'
          import UIKit

          public class HubView: UIView {
              
              private let collectionView: UICollectionView
              private let searchBar = UISearchBar()
              private var scripts: [ScriptItem] = []
              
              public override init(frame: CGRect) {
                  let layout = UICollectionViewFlowLayout()
                  layout.itemSize = CGSize(width: 280, height: 120)
                  layout.scrollDirection = .horizontal
                  layout.minimumInteritemSpacing = 15
                  layout.sectionInset = UIEdgeInsets(top: 10, left: 15, bottom: 10, right: 15)
                  
                  collectionView = UICollectionView(frame: .zero, collectionViewLayout: layout)
                  
                  super.init(frame: frame)
                  build()
              }
              
              required init?(coder: NSCoder) {
                  let layout = UICollectionViewFlowLayout()
                  layout.itemSize = CGSize(width: 280, height: 120)
                  layout.scrollDirection = .horizontal
                  layout.minimumInteritemSpacing = 15
                  layout.sectionInset = UIEdgeInsets(top: 10, left: 15, bottom: 10, right: 15)
                  
                  collectionView = UICollectionView(frame: .zero, collectionViewLayout: layout)
                  
                  super.init(coder: coder)
                  build()
              }
              
              private func build() {
                  backgroundColor = .clear
                  
                  searchBar.frame = CGRect(x: 10, y: 10, width: bounds.width - 20, height: 50)
                  searchBar.autoresizingMask = [.flexibleWidth]
                  searchBar.placeholder = "Search ScriptBlox..."
                  searchBar.searchBarStyle = .minimal
                  searchBar.barStyle = .black
                  searchBar.tintColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 1)
                  searchBar.delegate = self
                  addSubview(searchBar)
                  
                  collectionView.frame = CGRect(x: 0, y: 70, width: bounds.width, height: bounds.height - 70)
                  collectionView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  collectionView.backgroundColor = .clear
                  collectionView.register(ScriptCardCell.self, forCellWithReuseIdentifier: "cell")
                  collectionView.dataSource = self
                  addSubview(collectionView)
                  
                  search(query: "blox")
              }
              
              public func search(query: String) {
                  ScriptBloxAPI.shared.search(query: query) { [weak self] scripts in
                      self?.scripts = scripts
                      self?.collectionView.reloadData()
                  }
              }
          }

          extension HubView: UISearchBarDelegate {
              public func searchBarSearchButtonClicked(_ searchBar: UISearchBar) {
                  searchBar.resignFirstResponder()
                  if let query = searchBar.text, !query.isEmpty {
                      search(query: query)
                  }
              }
          }

          extension HubView: UICollectionViewDataSource {
              public func collectionView(_ collectionView: UICollectionView, numberOfItemsInSection section: Int) -> Int {
                  return scripts.count
              }
              
              public func collectionView(_ collectionView: UICollectionView, cellForItemAt indexPath: IndexPath) -> UICollectionViewCell {
                  let cell = collectionView.dequeueReusableCell(withReuseIdentifier: "cell", for: indexPath) as! ScriptCardCell
                  let script = scripts[indexPath.item]
                  cell.configure(with: script)
                  return cell
              }
          }

          public class ScriptCardCell: UICollectionViewCell {
              
              private let titleLabel = UILabel()
              private let gameLabel = UILabel()
              private let thumbnailView = UIImageView()
              private let loadButton = UIButton(type: .system)
              
              public override init(frame: CGRect) {
                  super.init(frame: frame)
                  setup()
              }
              
              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  setup()
              }
              
              private func setup() {
                  backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.16, alpha: 0.9)
                  layer.cornerRadius = 12
                  layer.borderWidth = 1
                  layer.borderColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.3).cgColor
                  
                  thumbnailView.frame = CGRect(x: 8, y: 8, width: 50, height: 50)
                  thumbnailView.backgroundColor = UIColor(red: 0.2, green: 0.2, blue: 0.25, alpha: 1)
                  thumbnailView.layer.cornerRadius = 8
                  thumbnailView.clipsToBounds = true
                  thumbnailView.contentMode = .scaleAspectFill
                  contentView.addSubview(thumbnailView)
                  
                  titleLabel.frame = CGRect(x: 66, y: 8, width: frame.width - 74, height: 20)
                  titleLabel.font = .systemFont(ofSize: 14, weight: .bold)
                  titleLabel.textColor = .white
                  contentView.addSubview(titleLabel)
                  
                  gameLabel.frame = CGRect(x: 66, y: 28, width: frame.width - 74, height: 16)
                  gameLabel.font = .systemFont(ofSize: 12)
                  gameLabel.textColor = .lightGray
                  contentView.addSubview(gameLabel)
                  
                  loadButton.frame = CGRect(x: frame.width - 60, y: 40, width: 50, height: 30)
                  loadButton.setTitle("Load", for: .normal)
                  loadButton.backgroundColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.8)
                  loadButton.setTitleColor(.white, for: .normal)
                  loadButton.titleLabel?.font = .systemFont(ofSize: 12, weight: .bold)
                  loadButton.layer.cornerRadius = 8
                  loadButton.addTarget(self, action: #selector(loadTapped), for: .touchUpInside)
                  contentView.addSubview(loadButton)
              }
              
              public func configure(with script: ScriptItem) {
                  titleLabel.text = script.title
                  gameLabel.text = script.game ?? "Unknown Game"
                  
                  if let thumbUrl = script.thumbnail {
                      ScriptBloxAPI.shared.loadThumbnail(url: thumbUrl) { [weak self] image in
                          self?.thumbnailView.image = image
                      }
                  }
              }
              
              @objc private func loadTapped() {
                  NotificationCenter.default.post(name: NSNotification.Name("LoadScript"), object: titleLabel.text)
              }
          }
          EOF
          
          # Create MainViewController.swift
          cat > XZX/MainViewController.swift << 'EOF'
          import UIKit

          public class MainViewController: UIViewController {
              
              private let neonWindow = NeonWindow()
              private let sidebar = SidebarView()
              private let editor = EditorView()
              private let hub = HubView()
              private let executeButton = UIButton()
              private let clearButton = UIButton()
              private let saveButton = UIButton()
              
              public override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .clear
                  InitLua()
                  setupWindow()
                  setupSidebar()
                  setupViews()
                  setupToolbar()
                  setupNotifications()
              }
              
              private func setupWindow() {
                  neonWindow.frame = CGRect(x: 40, y: 80, width: 900, height: 600)
                  view.addSubview(neonWindow)
              }
              
              private func setupSidebar() {
                  sidebar.frame = CGRect(x: 0, y: 0, width: 200, height: 600)
                  sidebar.onTabSelected = { [weak self] index in
                      self?.switchToTab(index)
                  }
                  neonWindow.addSubview(sidebar)
              }
              
              private func setupViews() {
                  let views: [(UIView, Int)] = [
                      (editor, 0),
                      (hub, 1)
                  ]
                  
                  for (view, tag) in views {
                      view.frame = CGRect(x: 210, y: 20, width: 670, height: 500)
                      view.tag = tag
                      view.isHidden = tag != 0
                      neonWindow.addSubview(view)
                  }
              }
              
              private func setupToolbar() {
                  executeButton.frame = CGRect(x: 220, y: 530, width: 100, height: 40)
                  executeButton.setTitle("▶️ Execute", for: .normal)
                  executeButton.backgroundColor = UIColor(red: 0.2, green: 0.8, blue: 0.3, alpha: 1)
                  executeButton.layer.cornerRadius = 8
                  executeButton.addTarget(self, action: #selector(executeScript), for: .touchUpInside)
                  neonWindow.addSubview(executeButton)
                  
                  clearButton.frame = CGRect(x: 330, y: 530, width: 100, height: 40)
                  clearButton.setTitle("🗑️ Clear", for: .normal)
                  clearButton.backgroundColor = UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  clearButton.layer.cornerRadius = 8
                  clearButton.addTarget(self, action: #selector(clearScript), for: .touchUpInside)
                  neonWindow.addSubview(clearButton)
                  
                  saveButton.frame = CGRect(x: 440, y: 530, width: 100, height: 40)
                  saveButton.setTitle("💾 Save", for: .normal)
                  saveButton.backgroundColor = UIColor(red: 0.3, green: 0.3, blue: 0.8, alpha: 1)
                  saveButton.layer.cornerRadius = 8
                  saveButton.addTarget(self, action: #selector(saveScript), for: .touchUpInside)
                  neonWindow.addSubview(saveButton)
              }
              
              private func setupNotifications() {
                  NotificationCenter.default.addObserver(
                      self,
                      selector: #selector(loadScriptFromHub(_:)),
                      name: NSNotification.Name("LoadScript"),
                      object: nil
                  )
              }
              
              private func switchToTab(_ index: Int) {
                  let views = neonWindow.subviews
                  for view in views where view.tag < 2 {
                      view.isHidden = view.tag != index
                  }
              }
              
              @objc private func executeScript() {
                  let script = editor.textView.text ?? ""
                  ExecuteScript(script)
              }
              
              @objc private func clearScript() {
                  editor.textView.text = ""
              }
              
              @objc private func saveScript() {
                  print("Script saved")
              }
              
              @objc private func loadScriptFromHub(_ notification: Notification) {
                  if let scriptTitle = notification.object as? String {
                      switchToTab(0)
                      editor.textView.text = "-- Loaded: \(scriptTitle)\n\nprint('Script loaded!')"
                  }
              }
          }
          EOF
      
