                  gameLabel.textColor = .lightGray; contentView.addSubview(gameLabel)
                  loadButton.frame = CGRect(x: frame.width - 60, y: 40, width: 50, height: 30); loadButton.setTitle("Load", for: .normal)
                  loadButton.backgroundColor = UIColor(red: 0.65, green: 0.35, blue: 1, alpha: 0.8); loadButton.setTitleColor(.white, for: .normal)
                  loadButton.titleLabel?.font = .systemFont(ofSize: 12, weight: .bold); loadButton.layer.cornerRadius = 8
                  loadButton.addTarget(self, action: #selector(loadTapped), for: .touchUpInside); contentView.addSubview(loadButton)
              }
              public func configure(with script: ScriptItem) {
                  titleLabel.text = script.title; gameLabel.text = script.game ?? "Unknown Game"
                  if let thumbUrl = script.thumbnail {
                      ScriptBloxAPI.shared.loadThumbnail(url: thumbUrl) { [weak self] image in self?.thumbnailView.image = image }
                  }
              }
              @objc private func loadTapped() { NotificationCenter.default.post(name: NSNotification.Name("LoadScript"), object: titleLabel.text) }
          }
          EOF
          
          cat > XZX/MainViewController.swift << 'EOF'
          import UIKit
          public class MainViewController: UIViewController {
              private let neonWindow = NeonWindow(); private let sidebar = SidebarView(); private let editor = EditorView(); private let hub = HubView()
              private let executeButton = UIButton(); private let clearButton = UIButton(); private let saveButton = UIButton()
              public override func viewDidLoad() {
                  super.viewDidLoad(); view.backgroundColor = .clear; InitLua()
                  neonWindow.frame = CGRect(x: 40, y: 80, width: 400, height: 500); view.addSubview(neonWindow)
                  sidebar.frame = CGRect(x: 0, y: 0, width: 180, height: 500); sidebar.onTabSelected = { [weak self] index in self?.switchToTab(index) }; neonWindow.addSubview(sidebar)
                  editor.frame = CGRect(x: 190, y: 20, width: 190, height: 420); editor.tag = 0; neonWindow.addSubview(editor)
                  hub.frame = CGRect(x: 190, y: 20, width: 190, height: 420); hub.tag = 1; hub.isHidden = true; neonWindow.addSubview(hub)
                  executeButton.frame = CGRect(x: 190, y: 450, width: 60, height: 40); executeButton.setTitle("▶️", for: .normal)
                  executeButton.backgroundColor = UIColor(red: 0.2, green: 0.8, blue: 0.3, alpha: 1); executeButton.layer.cornerRadius = 8
                  executeButton.addTarget(self, action: #selector(executeScript), for: .touchUpInside); neonWindow.addSubview(executeButton)
                  clearButton.frame = CGRect(x: 255, y: 450, width: 60, height: 40); clearButton.setTitle("🗑️", for: .normal)
                  clearButton.backgroundColor = UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1); clearButton.layer.cornerRadius = 8
                  clearButton.addTarget(self, action: #selector(clearScript), for: .touchUpInside); neonWindow.addSubview(clearButton)
                  saveButton.frame = CGRect(x: 320, y: 450, width: 60, height: 40); saveButton.setTitle("💾", for: .normal)
                  saveButton.backgroundColor = UIColor(red: 0.3, green: 0.3, blue: 0.8, alpha: 1); saveButton.layer.cornerRadius = 8
                  saveButton.addTarget(self, action: #selector(saveScript), for: .touchUpInside); neonWindow.addSubview(saveButton)
                  NotificationCenter.default.addObserver(self, selector: #selector(loadScriptFromHub(_:)), name: NSNotification.Name("LoadScript"), object: nil)
              }
              private func switchToTab(_ index: Int) { editor.isHidden = index != 0; hub.isHidden = index != 1 }
              @objc private func executeScript() { ExecuteScript(editor.textView.text ?? "") }
              @objc private func clearScript() { editor.textView.text = "" }
              @objc private func saveScript() { print("Script saved") }
              @objc private func loadScriptFromHub(_ notification: Notification) {
                  if let title = notification.object as? String { switchToTab(0); editor.textView.text = "-- Loaded: \(title)\n\nprint('Script loaded!')" }
              }
          }
          EOF
      
      - name: Compile Objective-C files
        run: |
          mkdir -p build
          for file in injector/dylib/*.m; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang -c -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} -o "build/$(basename "$file" .m).o" "$file" -target arm64-apple-ios15.0
            fi
          done
      
      - name: Compile C++ files
        run: |
          for file in injector/dylib/Core/*.mm; do
            if [ -f "$file" ]; then
              xcrun -sdk iphoneos clang++ -c -std=c++11 -I./injector/dylib -I./injector/dylib/Core -I${{ env.LUA_INCLUDE_DIR }} -o "build/$(basename "$file" .mm).o" "$file" -target arm64-apple-ios15.0
            fi
          done
      
      - name: Compile Swift files
        run: |
          SWIFT_FILES=$(find XZX -name "*.swift" -type f | tr '\n' ' ')
          xcrun -sdk iphoneos swiftc -c -whole-module-optimization -module-name XZX -import-objc-header XZX/XZX-Bridging-Header.h -I . -I ./injector/dylib -I ./injector/dylib/Core -I ${{ env.LUA_INCLUDE_DIR }} -target arm64-apple-ios15.0 -o build/XZXSwift.o $SWIFT_FILES
      
      - name: Link dylib
        run: |
          xcrun -sdk iphoneos clang++ -shared -framework UIKit -framework Foundation -framework CoreGraphics -framework WebKit -undefined dynamic_lookup -o build/executor.dylib build/*.o -lstdc++ -target arm64-apple-ios15.0
      
      - name: Extract IPA
        run: |
          unzip -q Roblox.ipa -d extracted/
          cp build/executor.dylib extracted/Payload/Roblox.app/
          rm -rf extracted/Payload/Roblox.app/_CodeSignature
          rm -f extracted/Payload/Roblox.app/embedded.mobileprovision
          ./tools/insert_dylib @executable_path/executor.dylib extracted/Payload/Roblox.app/Roblox extracted/Payload/Roblox.app/Roblox_patched --all-yes
          mv extracted/Payload/Roblox.app/Roblox_patched extracted/Payload/Roblox.app/Roblox
          INFO_PLIST="extracted/Payload/Roblox.app/Info.plist"
          plutil -convert xml1 "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName XZX" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string XZX" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName XZX" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string XZX" "$INFO_PLIST"
          plutil -convert binary1 "$INFO_PLIST"
          cd extracted; zip -qr ../XZX.ipa Payload/; cd ..
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XZX-Executor
          path: XZX.ipa
          retention-days: 90
